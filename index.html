(()=>{const U=[["1914-ru", 0, "Demander une enquête internationale", "enquete", 3, {"t": "Proposer de soumettre le conflit au tribunal de La Haye", "d": "Votre demande d’enquête de juin rend la proposition cohérente.", "kd": "ouverture", "l": 4, "fx": {"e": -12, "c": 0, "s": -4, "k": 10}, "xn": "Le 29 juillet, Nicolas II a bien suggéré à Guillaume II de porter le différend austro-serbe devant la conférence de La Haye. Berlin n’a pas donné suite."}], ["1914-uk", 0, "Proposer une conférence à quatre", "conf", 3, {"t": "Déclarer publiquement que Londres ne restera pas neutre si la France est attaquée", "d": "Votre conférence refusée prouve que vous avez tout tenté.", "kd": "ferme", "l": 5, "fx": {"e": 4, "c": 0, "s": 2, "k": -2}, "xn": "Uchronie : Grey n’a fait aucune déclaration publique de ce type avant le 3 août. Certains historiens pensent qu’elle aurait pu retenir Berlin."}], ["berlin-su", 0, "Proposer une commission monétaire quadripartite", "commission", 4, {"t": "Lever le blocus contre une conférence des ministres des Affaires étrangères", "d": "Votre offre monétaire de juin vous offre une sortie présentable.", "kd": "ouverture", "l": 5, "fx": {"e": -10, "c": 4, "s": 2, "k": 8}, "xn": "C’est l’issue réelle : l’accord Jessup-Malik prévoit la levée du blocus et la réunion des quatre ministres des Affaires étrangères à Paris, en mai 1949."}], ["berlin-de", 2, "Prononcer un appel public à la solidarité mondiale", "appel", 3, {"t": "Lancer une collecte internationale de charbon et de vêtements", "d": "Votre appel du 9 septembre a ému le monde.", "kd": "neutre", "l": 4, "fx": {"e": 0, "c": 10, "s": 4, "k": 0}, "xn": "Les colis CARE et l’aide internationale ont bien afflué vers Berlin ; l’appel de Reuter en a amplifié l’écho."}], ["suez-eg", 1, "Garantir officiellement la liberté de navigation", "navig", 3, {"t": "Faire valoir devant l’ONU votre garantie de libre navigation", "d": "Le trafic continue : l’argument est imparable.", "kd": "ouverture", "l": 4, "fx": {"e": -8, "c": 2, "s": 4, "k": 6}, "xn": "L’Égypte a bien plaidé devant l’ONU la continuité du trafic sous administration égyptienne."}], ["suez-us", 0, "Proposer un mécanisme international de navigation", "scua", 2, {"t": "Avertir en privé Eden que Washington ne couvrira aucune intervention", "d": "Votre effort diplomatique d’août rend l’avertissement crédible.", "kd": "ferme", "l": 4, "fx": {"e": -4, "c": 0, "s": 0, "k": 2}, "xn": "Uchronie : Eisenhower n’a pas formulé d’avertissement aussi explicite avant l’opération. Londres a cru, à tort, que Washington fermerait les yeux."}], ["cuba-cu", 1, "Demander à l’ONU d’envoyer des observateurs", "onu", 4, {"t": "Accepter des inspections de l’ONU contre une garantie écrite de non-invasion", "d": "Votre appel à l’ONU du 22 octobre rend l’offre crédible.", "kd": "concession", "l": 5, "fx": {"e": -12, "c": 4, "s": -6, "k": 12}, "xn": "Uchronie : Castro a refusé toute inspection sur son sol. La garantie américaine de non-invasion est restée orale."}], ["archer-us", 1, "Demander une enquête internationale indépendante", "enq", 3, {"t": "Proposer à Moscou des notifications mutuelles d’exercices", "d": "Votre retenue après le vol KAL 007 rend l’offre crédible.", "kd": "ouverture", "l": 5, "fx": {"e": -10, "c": 0, "s": -2, "k": 8}, "xn": "Ces mesures de confiance viendront plus tard : la notification des exercices militaires est adoptée à la conférence de Stockholm, en 1986."}], ["dayton-ba", 1, "Négocier des institutions centrales fortes", "inst", 4, {"t": "Exiger un Haut Représentant doté de pouvoirs étendus", "d": "Votre combat pour l’État central trouve ici son prolongement.", "kd": "neutre", "l": 5, "fx": {"e": -4, "c": 4, "s": 2, "k": -2}, "xn": "Le Haut Représentant prévu à Dayton reçoit en 1997 les « pouvoirs de Bonn », qui lui permettent d’imposer des lois et de révoquer des élus."}], ["orion-bo", 1, "Autoriser un corridor humanitaire", "corridor", 3, {"t": "Proposer à Aster un sommet bâti sur le succès du corridor", "d": "Le corridor a prouvé qu’un accord est possible.", "kd": "ouverture", "l": 4, "fx": {"e": -10, "c": 4, "s": 2, "k": 8}, "xn": "Concept réel : bâtir sur un succès humanitaire concret permet d’ouvrir une négociation plus large."}]];U.forEach(([id,ti,src,flag,tt,opt])=>{const s=SCEN.find(x=>x.id===id);if(!s)return;const o=s.turns[ti].opts.find(o=>o.t===src);if(!o){console.error('source introuvable',id,src);return}o.f=flag;opt.req=flag;s.turns[tt].opts.push(opt)})})();
/* V12.7 : rééquilibrage des dix rôles ajoutés en V12.5 et V12.6 (ils étaient trois à dix fois plus faciles que les autres). */
const BAL={'1914-ru':{k:.55},'1914-uk':{k:.55,obj:'ferme'},'berlin-su':{k:.55},'berlin-de':{k:.5,obj:'ferme'},'suez-eg':{k:.5,obj:'ferme'},'suez-us':{k:.45},'cuba-cu':{k:.5,obj:'ferme'},'archer-us':{k:.45},'dayton-ba':{k:.5,obj:'ferme'},'orion-bo':{k:.55}};
/* Équilibrage par rôle : coefficient propre à chaque crise ; pour les dirigeants dont l’objectif exige de tenir bon (souveraineté, résistance, État commun), les concessions coûtent plus cher et la fermeté utile rapporte davantage. Les ouvertures coûtent plus face à un adversaire opportuniste. */
Object.entries(BAL).forEach(([id,b])=>{const s=SCEN.find(x=>x.id===id);if(!s)return;const opp=PROFILE[id]==='opportuniste';s.turns.forEach(T=>T.opts.forEach(o=>{if((o.l||0)>0)o.l=Math.round(o.l*b.k);if(o.kd==='ouverture'){o.fx.s=(o.fx.s||0)-(opp?4:3);o.fx.k=Math.round((o.fx.k||0)*.7);o.fx.c=Math.round((o.fx.c||0)*.7)}if(b.obj==='ferme'){if(o.kd==='concession')o.l=(o.l||0)-2;if(o.kd==='ferme'&&(o.l||0)>0)o.l+=2}}))});

 {date:'27 octobre 1962',head:'Le samedi noir',text:'Un U-2 est abattu au-dessus de Cuba, sans ordre de Moscou. Le pilote est tué. La guerre n’a jamais semblé aussi proche.',

DUELS.cuba.epi={"war": "1962. Uchronie : la crise a dégénéré. Des armes nucléaires tactiques soviétiques étaient déjà à Cuba, et les sous-marins portaient des torpilles nucléaires : c’est l’échange que la crise réelle a évité.", "peace": "1963. La ligne directe fonctionne, et le traité d’interdiction partielle des essais nucléaires est signé : les deux Grands ont appris à se parler.", "us": "1964. Washington l’a emporté. Humilié, Khrouchtchev est écarté du pouvoir, et Moscou lance une course aux armements pour ne plus jamais être en position d’infériorité.", "su": "1964. Moscou a obtenu publiquement le retrait des missiles de Turquie et une garantie pour Cuba. Kennedy, accusé de faiblesse, affronte une campagne présidentielle difficile.", "comp": "1963. Un compromis discret : les missiles quittent Cuba, les Jupiter quittent la Turquie en secret. C’est, à peu près, ce qui s’est réellement passé."};
DUELS.cuba.lesson="La crise de Cuba est un dilemme du prisonnier : chacun gagne à être ferme si l’autre cède, mais deux fermetés mènent au désastre. Kennedy et Khrouchtchev s’en sont sortis par un compromis dont une partie est restée secrète, pour que chacun puisse sauver la face.";

const POL={
 ordi:(side,r,log,e)=>{const keep=D;D={r,log,e};const i=aiPick(side);D=keep;return i},
 aleatoire:()=>Math.floor(Math.random()*3),
 ouverture:(side,r)=>byKd(DUEL.rounds[r][side],'ouverture'),

 for(let r=0;r<5;r++){const A=DUEL.rounds[r].us[POL[pu]('us',r,log,e)],B=DUEL.rounds[r].su[POL[ps]('su',r,log,e)];let pa=A,pb=B;

let uxInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();uxInstallPrompt=e});
async function uxInstallHelp(){if(uxInstallPrompt){await uxInstallPrompt.prompt();uxInstallPrompt=null;return}uxDialog('GUERRE IA sur votre téléphone',`<p><b>iPhone :</b> ouvrez ce site dans Safari, utilisez Partager, puis « Sur l’écran d’accueil ».</p><p><b>Android :</b> ouvrez le menu du navigateur, puis « Installer l’application » ou « Ajouter à l’écran d’accueil ».</p><p>Après une première visite en ligne, le jeu local peut être rouvert hors connexion si votre navigateur autorise son stockage. Les duels à distance et la synchronisation nécessitent Internet.</p><p id="ux-offlinestatus" role="status">${navigator.serviceWorker?.controller?'Le stockage hors connexion est actif.':'Le stockage hors connexion sera préparé après le chargement du site.'}</p>`)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
let uxOfflineError=false;
if('serviceWorker' in navigator)navigator.serviceWorker.ready.then(()=>{const el=$('#ux-offlinestatus');if(el)uxOfflineCheck()}).catch(()=>{uxOfflineError=true});
async function uxOfflineCheck(){const el=$('#ux-offlinestatus');try{if(!('caches' in window)||!window.isSecureContext)throw Error('Mode hors connexion indisponible dans ce navigateur ou cet aperçu. Ouvrez le site dans Safari ou Chrome.');const cached=await caches.match('/');if(el)el.textContent=cached?'Le jeu est prêt pour une utilisation hors connexion sur cet appareil.':'Le jeu n’est pas encore enregistré. Rechargez la page en ligne avant de partir.'}catch(err){if(el)el.textContent=err.message}}
const uxInstallDetails=uxInstallHelp;uxInstallHelp=async function(){await uxInstallDetails();await uxOfflineCheck()};

/* V20.1: opt-in continuous sync, conflict preservation and reliable resumes. */
const uxSyncMeta=()=>uxRead('guerreia-sync-meta',{});
const uxAutoSync=()=>uxRead('guerreia-auto-sync',{});
class UxSyncQueue extends Map{set(key,value){const out=super.set(key,value),pending=uxRead('guerreia-pending-sync',{});pending[key]=true;uxWrite('guerreia-pending-sync',pending);return out}delete(key){const out=super.delete(key),pending=uxRead('guerreia-pending-sync',{});delete pending[key];uxWrite('guerreia-pending-sync',pending);return out}}
const uxSyncQueue=new UxSyncQueue();let uxSyncBusy=false;let uxSyncTimer;
let uxConflict=null;
function uxSetSyncStatus(slot,text){UX.syncStatus=UX.syncStatus||{};UX.syncStatus[slot]=text;const span=document.querySelector('[data-sync-status]');if(span&&S){const current='solo-'+S.gid;if(current===slot)span.textContent=text}}
async function uxSendSync(entry,quiet=false){
 if(!entry)return false;
 if(!navigator.onLine){uxSyncQueue.set(entry.slot,entry);uxSetSyncStatus(entry.slot,'Hors connexion · synchronisation en attente');if(!quiet)uxToast('Partie conservée sur cet appareil. Synchronisation à la reconnexion.');return false}
 const meta=uxSyncMeta();uxSetSyncStatus(entry.slot,'Synchronisation…');
 try{
  const r=await fetch('/api/saves',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...entry,expectedUpdated:meta[entry.slot]??null})});
  const result=await r.json();
  if(r.status===409){uxSyncQueue.delete(entry.slot);const auto=uxAutoSync();delete auto[entry.slot];uxWrite('guerreia-auto-sync',auto);uxConflict={entry,current:result.current};uxSetSyncStatus(entry.slot,'Autre version détectée · copie locale conservée');if(!quiet)uxShowConflict();else uxToast('Une autre version existe sur votre compte. Votre copie locale est conservée.');return false}
  if(!r.ok)throw Error(r.status===401?'Connectez-vous à ChatGPT pour synchroniser.':result.error||'Synchronisation indisponible.');
  meta[entry.slot]=result.updated;uxWrite('guerreia-sync-meta',meta);if(!uxSyncQueue.has(entry.slot)||uxSyncQueue.get(entry.slot).updated<=entry.updated)uxSyncQueue.delete(entry.slot);const auto=uxAutoSync();auto[entry.slot]=true;uxWrite('guerreia-auto-sync',auto);uxSetSyncStatus(entry.slot,'Synchronisé à '+new Date(result.updated).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));if(!quiet)uxToast('Partie synchronisée. Les prochaines décisions seront enregistrées automatiquement sur votre compte.');return true;
 }catch(err){uxSyncQueue.set(entry.slot,entry);uxSetSyncStatus(entry.slot,'Enregistré sur cet appareil · synchronisation en attente');if(!quiet)uxToast(err.message);return false}
}
async function uxFlushSync(){if(uxSyncBusy||!navigator.onLine)return;uxSyncBusy=true;let success=false;try{for(const entry of [...uxSyncQueue.values()])success=(await uxSendSync(entry,true))||success}finally{uxSyncBusy=false;if(success&&uxSyncQueue.size){clearTimeout(uxSyncTimer);uxSyncTimer=setTimeout(uxFlushSync,1500)}}}
uxCloudSave=async function(entry){if(uxSyncBusy){uxSyncQueue.set(entry.slot,entry);uxToast('Synchronisation en cours. Votre dernière décision est en attente.');return}uxSyncBusy=true;try{await uxSendSync(entry)}finally{uxSyncBusy=false;if(uxSyncQueue.size)clearTimeout(uxSyncTimer),uxSyncTimer=setTimeout(uxFlushSync,2500)}};
const uxSlotWithSync=uxSaveSlot;uxSaveSlot=function(kind,data){const entry=uxSlotWithSync(kind,data);if(uxAutoSync()[entry.slot]){uxSyncQueue.set(entry.slot,entry);clearTimeout(uxSyncTimer);uxSyncTimer=setTimeout(uxFlushSync,1200)}return entry};
window.addEventListener('online',()=>{uxToast('Connexion rétablie. Reprise des synchronisations.');uxFlushSync()});window.addEventListener('offline',()=>uxToast('Vous êtes hors connexion. La partie continue sur cet appareil.'));
function uxShowConflict(){if(!uxConflict)return;uxDialog('Deux versions de votre partie',`<p>Une autre sauvegarde a été créée depuis un autre appareil. Les deux versions sont conservées.</p><div class="panel"><b>Sur cet appareil</b><p>${esc(uxConflict.entry.kind==='solo'?'Tour '+(uxConflict.entry.data.t+1):'Manche '+(uxConflict.entry.data.r+1))}</p></div><div class="panel"><b>Sur votre compte</b><p>Enregistrée le ${uxConflict.current?new Date(uxConflict.current.updated).toLocaleString('fr-FR'):'date inconnue'}</p></div><div class="actions"><button class="primary" data-conflict-copy>Conserver ma version comme nouvelle partie</button>${uxConflict.current?'<button data-conflict-cloud>Reprendre la version du compte</button>':''}<button data-close>Continuer sur cet appareil</button></div>`)}
uxCloudList=async function(){const status=$('#ux-cloudstate');try{if(status)status.textContent='Chargement des parties synchronisées…';const r=await fetch('/api/saves');if(!r.ok)throw Error(r.status===401?'Connexion ChatGPT requise pour retrouver vos parties.':'Synchronisation indisponible.');const result=await r.json();UX.cloudItems=result.items.map(x=>({...x.payload,cloudUpdated:x.updated}));if(status)status.textContent=UX.cloudItems.length+' partie(s) synchronisée(s)';$('#ux-clouditems').innerHTML='<h3>Avec votre compte ChatGPT</h3>'+UX.cloudItems.map((x,i)=>`<div class="ux-save"><div><b>${esc(x.kind==='solo'?SCEN.find(s=>s.id===x.data.id)?.title||x.data.id:'Duel '+x.data.id)}</b><small>${new Date(x.cloudUpdated).toLocaleString('fr-FR')}</small></div><button data-cloudrestore="${i}">Reprendre</button></div>`).join('')}catch(err){if(status)status.textContent=err.message}};
const uxRestoreContinuity=uxRestore;uxRestore=function(entry){if(entry.cloudUpdated){const meta=uxSyncMeta();meta[entry.slot]=entry.cloudUpdated;uxWrite('guerreia-sync-meta',meta);const auto=uxAutoSync();auto[entry.slot]=true;uxWrite('guerreia-auto-sync',auto)}uxRestoreContinuity(entry);const view=uxRead('guerreia-positions',{})[uxPositionKey()];if(view){UX.drawer=view.drawer;const drawer=document.querySelector(`.ux-drawer[data-drawer="${view.drawer}"]`);if(drawer)drawer.open=true;requestAnimationFrame(()=>window.scrollTo({top:view.y,behavior:'instant'}))}};
function uxPositionKey(){return S?'solo-'+S.gid+'-'+S.t+(S.picked===null?'-choose':'-result'):D?'duel-'+(D.uxId||D.id)+'-'+D.r+'-'+D.phase:''}
let uxScrollTimer;window.addEventListener('scroll',()=>{if(!S&&!D)return;const key=uxPositionKey(),y=window.scrollY,drawer=UX.drawer;clearTimeout(uxScrollTimer);uxScrollTimer=setTimeout(()=>{const positions=uxRead('guerreia-positions',{});positions[key]={y,drawer};const entries=Object.entries(positions);uxWrite('guerreia-positions',Object.fromEntries(entries.slice(-100)))},250)},{passive:true});
const uxContinuityPlay=play;play=function(){uxContinuityPlay();const slot='solo-'+S.gid,status=UX.syncStatus?.[slot]||(uxAutoSync()[slot]?'Synchronisation automatique activée':'Sauvegarde sur cet appareil');document.querySelector('.ux-status')?.insertAdjacentHTML('beforeend',`<span data-sync-status role="status">${esc(status)}</span>${uxAutoSync()[slot]?'<button data-pause-sync>Désactiver la synchronisation auto</button>':''}${uxConflict?.entry.slot===slot?'<button data-show-conflict>Comparer les deux versions</button>':''}`)};
const uxContinuityLibrary=uxLibrary;uxLibrary=function(){uxContinuityLibrary();const history=uxRead('guerreia-history',[]);if(history.length)document.querySelector('#ux-dialog').insertAdjacentHTML('beforeend',`<h3>Rapports des parties terminées</h3>${history.map((x,i)=>`<div class="ux-save"><div><b>${esc(x.kind==='solo'?SCEN.find(s=>s.id===x.data.id)?.title||x.data.id:'Duel '+x.data.id)}</b><small>${new Date(x.updated).toLocaleString('fr-FR')}</small></div><button data-history="${i}">Relire le bilan</button></div>`).join('')}`)};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const has=k=>b.hasAttribute(k);if(!['data-pause-sync','data-show-conflict','data-conflict-copy','data-conflict-cloud','data-history'].some(has))return;e.preventDefault();e.stopImmediatePropagation();
 if(has('data-pause-sync')){const slot='solo-'+S.gid,auto=uxAutoSync();delete auto[slot];uxWrite('guerreia-auto-sync',auto);uxSyncQueue.delete(slot);delete UX.syncStatus?.[slot];render();uxToast('Synchronisation automatique désactivée. La sauvegarde locale reste active.')}
 if(has('data-show-conflict'))uxShowConflict();
 if(has('data-conflict-copy')&&uxConflict){const copy=structuredClone(uxConflict.entry),stamp=Date.now()+Math.random();if(copy.kind==='solo')copy.data.gid=stamp;else copy.data.uxId=stamp;const fresh=uxSaveSlot(copy.kind,copy.data);uxRestore(fresh);uxConflict=null;await uxCloudSave(fresh)}
 if(has('data-conflict-cloud')&&uxConflict?.current){const entry={...uxConflict.current.payload,cloudUpdated:uxConflict.current.updated};uxConflict=null;uxRestore(entry)}
 if(has('data-history')){const entry=uxRead('guerreia-history',[])[+b.dataset.history];if(!entry)return;uxArchiveActive();UX.room=null;clearInterval(uxRoomTimer);if(entry.kind==='solo'){S=structuredClone(entry.data);S.done=true;D=null}else{D=structuredClone(entry.data);D.phase='end';DUEL=DUELS[D.id];S=null}uxClose();render();window.scrollTo(0,0)}
},true);
// Resume buttons share validation and restore the last reading position.
document.addEventListener('click',e=>{const b=e.target.closest('#resumeBtn,#dResume');if(!b)return;e.preventDefault();e.stopImmediatePropagation();try{const kind=b.id==='resumeBtn'?'solo':'duel',data=kind==='solo'?loadGame():loadDuel();if(data)uxRestore({kind,data});else uxToast('Cette partie ne peut plus être restaurée. Consultez Mes parties.')}catch(err){uxToast(err.message)}},true);
render();

for(const entry of uxRead('guerreia-slots',[]))if(uxRead('guerreia-pending-sync',{})[entry.slot]&&uxAutoSync()[entry.slot])uxSyncQueue.set(entry.slot,entry);
if(uxSyncQueue.size)uxSyncTimer=setTimeout(uxFlushSync,2000);
const uxRemoteRefresh=uxRefreshRoom;uxRefreshRoom=async function(){if(!navigator.onLine)return;return uxRemoteRefresh()};

/* The API key stays on the server; the browser sends game context only. */
let uxAiStatus='checking';
async function uxConnectAI(){try{const r=await fetch('/api/ai',{cache:'no-store'});if(!r.ok){uxAiStatus=r.status===401?'signin':'unavailable';return}const state=await r.json();if(!state.configured){AI.sample=null;uxAiStatus='unconfigured';return}AI.sample={async json(_prompt,options={}){if(!S)throw Error('Aucune crise en cours.');const action=options.modelTier==='quick'?'council':'negotiate';const snapshot={action,id:S.id,turn:S.t,gauges:{...S.g},picked:S.picked,available:sc().turns[S.t].opts.map((o,i)=>({o,i})).filter(({o})=>!o.req||S.flags.includes(o.req)).map(x=>x.i),...(action==='negotiate'?{message:S.negDraft}:{} )};const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshot),signal:AbortSignal.timeout(50000)});const result=await r.json();if(!r.ok){const error=new Error(result.error||'Le service IA est indisponible.');error.code=result.code;throw error}return result.data}};uxAiStatus='ready';}catch{uxAiStatus='unavailable'}finally{if(S&&!S.brief&&!S.done&&!D)render()}}
const uxPlayAI=play;play=function(){uxPlayAI();const council=document.querySelector('[data-drawer="conseil"] .panel');if(council){council.insertAdjacentHTML('beforeend',`<p class="note">${AI.sample?'Avis générés par IA à la demande. Ils peuvent contenir des erreurs ; les repères historiques du jeu restent distincts.':'Le conseil préparé reste disponible. '+(uxAiStatus==='checking'?'Vérification de la connexion IA…':uxAiStatus==='signin'?'Connectez-vous pour consulter l’IA.':uxAiStatus==='unconfigured'?'La connexion de l’IA est en cours de configuration.':'Connexion IA momentanément indisponible.')}</p>${!AI.sample?'<button data-reconnect-ai>Vérifier la connexion IA</button>':''}`)}};
document.addEventListener('click',async e=>{if(!e.target.closest('[data-reconnect-ai]'))return;e.preventDefault();e.stopImmediatePropagation();await uxConnectAI();uxToast(AI.sample?'Le conseil IA et la négociation sont connectés.':'Connexion IA non disponible pour le moment. Le jeu reste accessible.')},true);
uxConnectAI();
</script></body></html>
