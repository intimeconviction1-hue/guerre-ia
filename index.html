.wrap{max-width:1240px;padding-block:22px 70px}

:root{color-scheme:dark;--bg:#0e1311;--table:#151c19;--line:#2a3632;--display:"Big Shoulders Stencil Display",Impact,"Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--night:#0a0f0e;--night2:#0f1715;--slate:#16201d;--slate2:#1c2925;--rule:#2c3b35;--rule2:#3d5148;--ink:#eef2ea;--ink2:#c7d1c8;--muted:#8fa197;--brass:#d9a441;--brass2:#f2c96b;--brassdk:#8a6420;--paper:#ece3cc;--paper2:#e2d6b8;--paper-ink:#241d12;--paper-mute:#6e5f43;--red:#b3271b;--alarm:#ff7a62;--calm:#6fcfa7;--steel:#7fa6c9;--type:"Special Elite","Courier Prime","Courier New",ui-monospace,monospace;--v16-accent:#e0b258;--v16-surface:#17231f;--v17-bg:#09110f;--v17-panel:#0f1715;--v17-panel2:#182220;--v17-line:#5f6f64;--v17-glow:rgba(224,178,88,.24);--v17-soft:#ced6cc;--v17-deep:#050807;--v17-shadow:0 22px 60px rgba(0,0,0,.38)}

.v17-timechip:focus-visible,.v17-timechip:hover{border-color:#c8a257;box-shadow:0 0 0 2px rgba(224,178,88,.22)}
.mode{border-radius:14px}
.crises{display:grid;grid-template-columns:repeat(auto-fit,minmax(295px,1fr));gap:18px;align-items:stretch}
.crise{position:relative;overflow:hidden;border-radius:18px;border:1px solid #5e6c61;background:linear-gradient(180deg,rgba(16,24,21,.90),rgba(7,11,10,.98));box-shadow:var(--v17-shadow);padding:18px 18px 16px;isolation:isolate;text-align:left}
.crise::after{content:'';position:absolute;inset:auto 0 0 0;height:54%;background:linear-gradient(180deg,transparent,rgba(7,10,10,.74) 24%,rgba(6,8,8,.97));z-index:0;pointer-events:none}
.crise>*{position:relative;z-index:1}
.crise .v17-scene{margin:-18px -18px 14px;height:136px;border-bottom:1px solid rgba(255,255,255,.08);background:var(--scene,linear-gradient(135deg,#2b3b36,#121a18));position:relative;overflow:hidden}
.crise .v17-scene::before{content:'';position:absolute;inset:0;background:
 radial-gradient(circle at 80% 18%,rgba(235,194,103,.42),transparent 0 18%),
 linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.35)),
 repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 2px,transparent 2px 18px);
 opacity:.92}
.crise .v17-scene::after{content:'';position:absolute;left:-4%;right:-4%;bottom:-18%;height:54%;background:radial-gradient(ellipse at center,rgba(11,16,15,.25),rgba(9,12,11,.92) 60%)}
.crise .v17-scene-label{position:absolute;left:12px;top:10px;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);font:700 10px var(--mono);letter-spacing:1.2px;color:#f1dbab;text-transform:uppercase;border:1px solid rgba(255,255,255,.08)}
.crise h3{font-size:34px;line-height:1.02;text-transform:uppercase;letter-spacing:.5px}
.crise .year{font-size:clamp(34px,4.7vw,52px);color:rgba(236,196,110,.16);text-shadow:none;right:12px;top:74px}
.crise .campbtns{display:grid;gap:10px;margin-top:16px}
.crise .campbtns button{padding:12px;border-radius:12px;border:1px solid #5f6c61;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));text-align:left;color:#eef1eb}
.crise .campbtns button b{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.4px}
.crise .campbtns button span,.crise .campbtns button em{display:block;margin-top:5px;color:#cbd5ca;font-size:12px;font-style:normal}
.crise.duelcard{border-color:#725b37;background:linear-gradient(180deg,rgba(26,20,12,.90),rgba(11,10,8,.98))}
.crise.duelcard .v17-scene{height:146px}
.crise.duelcard .chips .chip{background:#3d2d13;color:#f0d79b;border-color:#816430}
.rules{margin-top:22px;border-radius:16px;padding:8px;background:linear-gradient(180deg,rgba(15,22,20,.84),rgba(8,11,10,.96));border:1px solid #566559;box-shadow:var(--v17-shadow)}
.rules>div{border-radius:12px;background:rgba(255,255,255,.02)}
.v16-playinghead,.mstatus,.rolebar,.ux-status,.depeche,.panel,.choice,.outcome,.histbox,.cabinet,.neg,.track{border-radius:16px}
.v17-playhero{position:relative;overflow:hidden;margin:6px 0 12px;border:1px solid #6b5d43;border-radius:18px;background:linear-gradient(180deg,rgba(13,20,18,.85),rgba(8,11,11,.96));box-shadow:var(--v17-shadow)}
.v17-playhero::before{content:'';position:absolute;inset:0;background:var(--scene,linear-gradient(135deg,#2b3b36,#121a18));opacity:.98}
.v17-playhero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,9,8,.9),rgba(6,9,8,.52) 42%,rgba(6,9,8,.85));}
.v17-playhero .v17-playgrid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr);gap:18px;padding:24px}
.v17-playhero h1{margin:.22em 0 .16em;font:900 clamp(36px,5vw,60px)/.94 var(--display);text-transform:uppercase;max-width:15ch}
.v17-playhero p{margin:0;color:#eef2ea;max-width:62ch;line-height:1.7}
.v17-playkicker{font:700 11px var(--mono);letter-spacing:2px;text-transform:uppercase;color:#e2be73}
.v17-playstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-self:stretch}
.v17-playstats .v17-stat{padding:12px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(0,0,0,.26);backdrop-filter:blur(7px)}
.v17-playstats span{display:block;font:700 10px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:#d6b16a}
.v17-playstats b{display:block;margin-top:7px;font-size:16px;line-height:1.35;color:#f2f4ef}
.v17-playstats small{display:block;margin-top:5px;color:#cdd5cc;line-height:1.45}
.section-intro{padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid #46574c;border-radius:16px;margin:16px 0 14px}
.section-intro h3{display:flex;align-items:center;gap:10px;margin:0 0 6px;font:900 26px/1 var(--display);text-transform:uppercase}
.section-intro p{margin:0;color:#d9e0d8;line-height:1.6}
.step-label{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(180deg,#e4bd69,#bf8a2a);color:#25190a;font:900 15px var(--display)}
.choice{position:relative;overflow:hidden;padding:18px 16px;min-height:112px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid #4f6054}
.choice::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(224,178,88,.09),transparent 38%);opacity:0;transition:opacity .18s ease}
.choice:hover::before,.choice.picked::before{opacity:1}
.choice b{font-size:17px;text-transform:uppercase;letter-spacing:.3px}
.panel{background:linear-gradient(180deg,rgba(14,20,18,.92),rgba(8,10,10,.98));border:1px solid #4d5e53;box-shadow:var(--v17-shadow)}
.depeche{position:relative;overflow:hidden;background:linear-gradient(180deg,#e4d5b6,#c7b286 74%,#b2976d);color:#241d12;border:1px solid #91754f;box-shadow:var(--v17-shadow)}
.depeche::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 24px,rgba(79,58,30,.06) 24px 25px),linear-gradient(135deg,rgba(255,255,255,.24),transparent 18%);pointer-events:none}
.depeche h2,.depeche p,.depeche .date,.depeche .stamp{position:relative;z-index:1}
.flash-card{animation:v17flash 1.4s ease}
@keyframes v17flash{0%{box-shadow:0 0 0 0 rgba(224,178,88,.55)}100%{box-shadow:0 0 0 24px rgba(224,178,88,0)}}
[data-theme^="cuba"],.v17-playhero[data-theme^="cuba"]{--scene:linear-gradient(160deg,#243e46 0%,#265d71 22%,#2d8ca2 44%,#356f3f 70%,#182119 100%)}
[data-theme="1914"],[data-theme^="juillet14"],.v17-playhero[data-theme="1914"],[data-theme="1914"] .v17-scene{--scene:linear-gradient(160deg,#4e3e2d 0%,#74624a 25%,#39424c 56%,#1d2228 100%)}

[data-theme^="suez"],.v17-playhero[data-theme^="suez"]{--scene:linear-gradient(160deg,#5a4429 0%,#bc9257 22%,#8d785c 46%,#2a3634 72%,#111715 100%)}
[data-theme^="kippour"],.v17-playhero[data-theme^="kippour"]{--scene:linear-gradient(160deg,#6c532c 0%,#9b7a46 28%,#665d48 54%,#2b3130 78%,#0f1413 100%)}
[data-theme^="archer"],.v17-playhero[data-theme^="archer"]{--scene:linear-gradient(160deg,#1e3340 0%,#385f70 26%,#544d73 54%,#171926 100%)}
[data-theme^="dayton"],.v17-playhero[data-theme^="dayton"]{--scene:linear-gradient(160deg,#314035 0%,#607258 24%,#73888d 48%,#242e2d 100%)}
[data-theme^="orion"],.v17-playhero[data-theme^="orion"]{--scene:linear-gradient(160deg,#1f3658 0%,#346fa0 28%,#4a8fba 48%,#243553 70%,#0f1622 100%)}
[data-theme^="duel-cuba"]{--scene:linear-gradient(160deg,#3a2720 0%,#7f3525 24%,#c07a33 48%,#264d65 76%,#171a1e 100%)}
[data-theme^="duel-berlin"]{--scene:linear-gradient(160deg,#2b2623 0%,#4f4943 24%,#7f8279 48%,#43546c 76%,#141719 100%)}
@media(max-width:980px){.v17-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.v17-playhero .v17-playgrid{grid-template-columns:1fr}.v17-playstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.v17-hero{grid-template-columns:1fr}.v17-introcard{min-height:auto}.v17-commandpanel strong{font-size:34px}}
@media(max-width:600px){.v17-introcard{padding:24px 18px 22px}.v17-introcard h1{font-size:clamp(40px,13vw,58px)}.v17-introcard p{font-size:15px}.v17-metrics{grid-template-columns:1fr 1fr;gap:10px}.v17-ribbonwrap{padding:14px}.v17-timechip{min-width:145px}.v17-playhero .v17-playgrid{padding:18px}.v17-playhero h1{font-size:clamp(31px,11vw,44px)}.v17-playstats{grid-template-columns:1fr}.crise .v17-scene{height:112px}}
.depeche .stamp{position:absolute!important;top:16px;right:18px;left:auto;width:auto;display:inline-block;font-size:11px;letter-spacing:3px;padding:4px 9px;transform:rotate(6deg)}
.v17-playhero ~ .rolebar,.v16-playinghead{display:none}
.v17-introcard h1{font-size:clamp(34px,4.3vw,58px)!important;line-height:.95;max-width:16ch!important}
.side{top:16px}
.v17-commandpanel{display:flex!important;flex-direction:column;justify-content:flex-start!important;gap:20px}
.v17-commandpanel>*{margin-top:0!important}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

 {date:'16 octobre 1962',head:'Les photos du U-2',text:'Des clichés pris par un avion espion montrent des rampes de missiles balistiques soviétiques en construction à Cuba. Ils pourraient frapper Washington en quelques minutes. Personne d’autre ne le sait encore.',
  opts:[{cap:1,kd:'ferme',t:'Frappe aérienne immédiate',d:'Détruire les sites avant qu’ils soient opérationnels.',l:-6,fx:{e:25,c:-8,s:8,k:-20},dr:{e:4},dl:'Frappe sur Cuba : Moscou prépare sa riposte'},
        {kd:'neutre',t:'Réunir un comité de crise en secret',d:'Prendre une semaine pour peser toutes les options.',l:4,fx:{e:0,c:0,s:2,k:5},h:1,f:'excomm'},
        {kd:'neutre',t:'Dénoncer publiquement Moscou à l’ONU',d:'Mettre la pression par la publicité immédiate.',l:0,fx:{e:8,c:0,s:-4,k:-5}}],
  note:'Kennedy réunit l’ExComm, un cercle restreint de conseillers, et garde le secret pendant six jours. Les chefs d’état-major plaident pour la frappe aérienne ; elle est écartée, car elle ne garantit pas la destruction de tous les missiles.'},
 {date:'22 octobre 1962',head:'L’allocution',text:'Il faut annoncer une décision au pays et au monde. Les navires soviétiques continuent d’acheminer du matériel vers l’île.',
  opts:[{kd:'ferme',t:'Annoncer une « quarantaine » navale',d:'Bloquer les livraisons d’armes offensives, sans tirer.',l:4,fx:{e:10,c:0,s:12,k:-5},h:1},
        {cap:0,kd:'ferme',t:'Lancer l’invasion de Cuba',d:'Régler le problème par la force.',l:-8,fx:{e:35,c:-18,s:5,k:-25}},
        {kd:'neutre',t:'Négocier en secret, sans annonce',d:'Éviter de mettre Khrouchtchev au pied du mur.',l:-2,fx:{e:-5,c:0,s:-12,k:10}}],
  note:'Kennedy annonce à la télévision une « quarantaine ». Le mot est choisi avec soin : un « blocus » est un acte de guerre au regard du droit international.'},
 {date:'24 octobre 1962',head:'La ligne de quarantaine',text:'Des cargos soviétiques, escortés par des sous-marins, approchent de la ligne tenue par l’US Navy. Le monde retient son souffle.',
  opts:[{kd:'ferme',t:'Arraisonner de force le premier navire',d:'Montrer que la ligne est réelle.',l:-2,fx:{e:20,c:0,s:6,k:-12}},
        {kd:'ouverture',t:'Laisser passer les navires civils, contrôler un cargo choisi',d:'Faire respecter la règle sans humiliation.',l:3,fx:{e:-6,c:0,s:0,k:8},h:1},
        {kd:'concession',t:'Reculer la ligne pour gagner du temps',d:'Donner à Moscou quelques heures de plus pour réfléchir.',l:1,fx:{e:-8,c:0,s:-6,k:8}}],
  note:'Plusieurs navires soviétiques s’arrêtent ou font demi-tour. Le 26 octobre, la Navy inspecte sans incident le Marucla, un cargo affrété par les Soviétiques. Dean Rusk : « Nous étions les yeux dans les yeux, et je crois que l’autre a cligné. »'},
 {date:'27 octobre 1962',head:'Le samedi noir',text:'Un U-2 est abattu au-dessus de Cuba ; son pilote, le commandant Rudolf Anderson, est tué. Une seconde lettre de Khrouchtchev, plus dure que la première, exige le retrait des missiles américains Jupiter installés en Turquie.',
  opts:[{cap:0,kd:'ferme',t:'Représailles sur la batterie antiaérienne',d:'Venger le pilote et rétablir la dissuasion.',l:-6,fx:{e:25,c:-6,s:10,k:-15}},
        {kd:'ouverture',t:'Répondre à la première lettre et proposer en secret le retrait des Jupiter',d:'Sauver la face des deux côtés.',l:6,fx:{e:-20,c:0,s:0,k:15},h:1},
        {kd:'concession',t:'Accepter publiquement l’échange avec la Turquie',d:'Désamorcer vite, au prix d’un recul visible.',l:-2,fx:{e:-15,c:0,s:-15,k:10}},
        {kd:'ouverture',t:'Passer par le canal officieux Scali–Feklisov',d:'Un journaliste américain et un agent du KGB comme messagers.',l:5,fx:{e:-14,c:0,s:-2,k:12},req:'excomm',xn:'Le 26 octobre, l’officier du KGB Alexandre Feklisov a bien proposé au journaliste d’ABC John Scali les bases d’un compromis : retrait des missiles contre engagement de ne pas envahir Cuba.'}],
  note:'Kennedy répond à la première lettre et ignore la seconde. Le soir même, Robert Kennedy promet en secret à l’ambassadeur Dobrynine le retrait ultérieur des Jupiter. Le même jour, à bord du sous-marin B-59, l’officier Vassili Arkhipov refuse de valider le tir d’une torpille nucléaire.'},
 {date:'28 octobre 1962',head:'Radio Moscou',text:'Khrouchtchev annonce à la radio le démantèlement des missiles. Reste à fixer la suite.',
  opts:[{kd:'ferme',t:'Exiger des inspections de l’ONU, sinon menace',d:'Obtenir des garanties absolues.',l:0,fx:{e:10,c:0,s:5,k:-8}},
        {kd:'ouverture',t:'Accepter et créer une ligne directe avec Moscou',d:'Institutionnaliser le dialogue pour la prochaine crise.',l:8,fx:{e:-15,c:0,s:5,k:15},h:1},
        {kd:'neutre',t:'Proclamer une victoire totale',d:'Humilier publiquement le rival.',l:-5,fx:{e:5,c:0,s:10,k:-15}}],
  note:'Castro refuse les inspections ; le retrait est vérifié par survol aérien. Les Jupiter quittent la Turquie en avril 1963. Une liaison directe Washington–Moscou est créée par l’accord du 20 juin 1963, puis un traité d’interdiction partielle des essais nucléaires est signé en août.'}
 ],
 epi:['1967. La crise s’est close dans l’humiliation et la méfiance. Sans ligne directe ni accord, chaque incident en mer des Caraïbes ravive la peur nucléaire.','1967. La guerre a été évitée, mais Moscou retient la leçon : il faut rattraper le retard nucléaire. La course aux armements s’accélère.','1967. La ligne directe fonctionne, un traité limite les essais nucléaires, et les deux Grands ont appris à se parler en temps de crise.'],neg:{t:3,who:'Nikita Khrouchtchev',title:'premier secrétaire du Parti communiste de l’URSS',persona:'Veut avant tout éviter la guerre nucléaire, mais ne peut pas paraître capituler devant son Politburo, ses militaires et Fidel Castro. Exige au minimum une garantie que Cuba ne sera pas envahi ; voudrait le retrait des missiles Jupiter de Turquie. Impulsif, émotif, sensible à l’humiliation.'},
 real:'La guerre nucléaire est évitée de justesse. La crise donne naissance aux premiers outils de maîtrise des armements : ligne directe, traité de 1963. Leçon : laisser à l’adversaire une porte de sortie honorable.'},
{id:'1914',grp:'1914',camp:"Allemagne",title:'Juillet 1914',role:'Vous êtes le chancelier allemand, Theobald von Bethmann Hollweg.',hist:true,start:{e:30,c:65,s:50,k:40},
 pitch:'Un attentat à Sarajevo. Cinq semaines de décisions qui mènent l’Europe à la guerre.',
 turns:[
 {date:'5 juillet 1914',head:'Vienne frappe à la porte',text:'L’archiduc François-Ferdinand a été assassiné à Sarajevo le 28 juin par un nationaliste serbe de Bosnie. L’Autriche-Hongrie veut punir la Serbie et demande le soutien de l’Allemagne, son alliée.',
  opts:[{kd:'ferme',t:'Accorder un soutien sans conditions',d:'Le « chèque en blanc » : Vienne décide, Berlin suit.',l:-8,fx:{e:20,c:0,s:10,k:-10},h:1,dr:{e:3},dl:'Chèque en blanc : Vienne se sent libre d’agir'},
        {kd:'neutre',t:'Soutenir sous conditions',d:'Exiger une action limitée et rapide, avant que l’émotion retombe.',l:3,fx:{e:5,c:0,s:2,k:0}},
        {kd:'concession',t:'Refuser tout soutien militaire',d:'Prévenir Vienne qu’elle agira seule.',l:5,fx:{e:-12,c:0,s:-15,k:12},f:'retenue'}],
  note:'Les 5 et 6 juillet, Guillaume II puis Bethmann Hollweg assurent Vienne du soutien allemand, quelle que soit sa décision. Les historiens y voient un tournant décisif de la crise.'},
 {date:'23 juillet 1914',head:'L’ultimatum',text:'Vienne s’apprête à remettre un ultimatum à Belgrade, avec 48 heures pour répondre. Berlin connaît les grandes lignes du texte.',
  opts:[{kd:'ferme',t:'Laisser partir un texte conçu pour être rejeté',d:'Provoquer une guerre locale rapide.',l:-6,fx:{e:15,c:0,s:5,k:-12},h:1},
        {kd:'concession',t:'Pousser Vienne à adoucir ses exigences',d:'Laisser une issue à la Serbie.',l:3,fx:{e:-6,c:0,s:-2,k:6}},
        {kd:'ouverture',t:'Proposer une enquête internationale',d:'Confier l’attentat à des juges neutres.',l:6,fx:{e:-12,c:0,s:-6,k:12}}],
  note:'L’ultimatum exige notamment que des fonctionnaires autrichiens participent à l’enquête sur le sol serbe. Plusieurs diplomates européens le jugent inacceptable pour un État souverain.'},
 {date:'26 juillet 1914',head:'La réponse serbe',text:'Belgrade accepte presque toutes les exigences, sauf la participation autrichienne à l’enquête sur son sol. À Londres, Sir Edward Grey propose une conférence des quatre puissances non directement impliquées.',
  opts:[{kd:'ferme',t:'Rejeter la conférence de Londres',d:'Le conflit doit rester entre Vienne et Belgrade.',l:-6,fx:{e:15,c:0,s:4,k:-15},h:1},
        {kd:'ouverture',t:'Accepter la conférence',d:'Porter la crise à la table des puissances.',l:6,fx:{e:-15,c:0,s:-6,k:15}},
        {kd:'neutre',t:'Proposer la « halte à Belgrade »',d:'Une occupation limitée, puis la négociation.',l:2,fx:{e:0,c:-4,s:2,k:6}}],
  note:'Berlin écarte la conférence. Le 28 juillet, Guillaume II lit la réponse serbe et estime que « toute raison de guerre disparaît » ; il suggère une « halte à Belgrade ». Le même jour, l’Autriche-Hongrie déclare la guerre à la Serbie.'},
 {date:'30 juillet 1914',head:'La Russie mobilise',text:'Le tsar ordonne la mobilisation générale. Dans la logique militaire de l’époque, mobiliser, c’est presque déjà entrer en guerre.',
  opts:[{cap:1,kd:'ferme',t:'Ultimatum : démobilisez sous 12 heures',d:'Contraindre Saint-Pétersbourg à reculer.',l:-6,fx:{e:25,c:0,s:6,k:-15},h:1},
        {kd:'ouverture',t:'Proposer au tsar un gel mutuel des mobilisations',d:'Prolonger les télégrammes entre souverains.',l:5,fx:{e:-12,c:0,s:-4,k:12}},
        {kd:'neutre',t:'Mobiliser seulement à l’Est, de façon défensive',d:'Répondre sans menacer la France.',l:1,fx:{e:4,c:0,s:2,k:2}},
        {kd:'ouverture',t:'Proposer une médiation conjointe avec Londres',d:'Votre retenue de juillet vous rend crédible auprès de Grey.',l:8,fx:{e:-18,c:0,s:-4,k:15},req:'retenue',xn:'Uchronie : en réalité, Berlin n’a jamais pesé sur Vienne au point de rendre une médiation anglo-allemande crédible. Les propositions de Grey sont restées sans suite.'}],
  note:'Le 31 juillet, l’Allemagne adresse un ultimatum à la Russie. Les télégrammes entre « Willy » et « Nicky », cousins, n’empêchent rien. Le 1er août, l’Allemagne déclare la guerre à la Russie.'},
 {date:'2 août 1914',head:'Le plan Schlieffen',text:'Le plan militaire allemand prévoit de battre d’abord la France en passant par la Belgique, pays neutre dont le Royaume-Uni garantit l’indépendance.',
  opts:[{cap:0,kd:'ferme',war:1,t:'Appliquer le plan : ultimatum à la Belgique',d:'Traverser le pays pour contourner les défenses françaises.',l:-10,fx:{e:30,c:-20,s:5,k:-20},h:1},
        {kd:'neutre',t:'Rester défensif à l’Ouest',d:'Ne pas violer la neutralité belge.',l:5,fx:{e:-10,c:0,s:-6,k:10}},
        {kd:'ouverture',t:'Garantir la Belgique contre la neutralité britannique',d:'Tenter un marché avec Londres.',l:4,fx:{e:-6,c:0,s:-2,k:8}}],
  note:'Ultimatum à la Belgique le 2 août, déclaration de guerre à la France le 3, invasion de la Belgique le 4. Le Royaume-Uni entre en guerre le soir même. Bethmann Hollweg qualifie le traité belge de « chiffon de papier ».'}
 ],
 epi:['1919. La crise de 1914 a été contenue de justesse, mais rancunes et course aux armements empoisonnent l’Europe : la moindre étincelle suffirait à tout embraser.','1919. La guerre a été évitée de justesse, mais les alliances restent armées et la course navale continue. La prochaine crise des Balkans peut tout rallumer.','1919. La crise de 1914 a créé un précédent : les grandes puissances règlent les crises balkaniques en conférence. L’Europe reste en paix, mais rien n’est acquis.'],neg:{t:3,who:'le tsar Nicolas II',title:'empereur de Russie',persona:'Veut protéger la Serbie et le prestige russe, humilié en 1908 lors de la crise bosniaque. Craint une attaque allemande. Hésitant, influencé par ses généraux qui exigent la mobilisation générale. Attaché à son cousin Guillaume II mais méfiant.'},
 real:'Une guerre de quatre ans qui tue près de 10 millions de soldats. Aucun dirigeant ne voulait une guerre mondiale ; chacun a parié que l’autre reculerait. Leçon : les alliances rigides et les plans militaires automatiques réduisent la marge de la diplomatie.'},
{id:'munich',warOk:1,grp:'munich',camp:'France',title:'Munich, septembre 1938',role:'Vous êtes le président du Conseil français, Édouard Daladier.',hist:true,start:{e:45,c:55,s:50,k:35},
 pitch:'Hitler exige les Sudètes. La France est liée par traité à la Tchécoslovaquie. Céder ou tenir ?',
 turns:[
 {date:'12 septembre 1938',head:'Le discours de Nuremberg',text:'Hitler exige le « droit à l’autodétermination » des Allemands des Sudètes, en Tchécoslovaquie. Des troubles éclatent. La France est liée à Prague par un traité d’alliance ; le Royaume-Uni, lui, ne l’est pas.',
  opts:[{kd:'ferme',t:'Réaffirmer publiquement l’alliance avec Prague',d:'Rappeler des réservistes pour être crédible.',l:4,fx:{e:12,c:0,s:4,k:-8}},
        {kd:'concession',t:'Laisser Chamberlain négocier avec Hitler',d:'Suivre Londres, sans qui la France ne veut pas combattre.',l:-4,fx:{e:-6,c:0,s:0,k:6},h:1},
        {kd:'neutre',t:'Proposer une conférence avec l’URSS',d:'Activer le pacte franco-soviétique de 1935.',l:3,fx:{e:4,c:0,s:-4,k:-4},f:'moscou'}],
  note:'Daladier laisse l’initiative à Neville Chamberlain, qui rencontre Hitler à Berchtesgaden le 15 septembre. Paris refuse de s’engager sans le Royaume-Uni.'},
 {date:'19 septembre 1938',head:'Le plan franco-britannique',text:'Londres et Paris s’accordent : Prague devrait céder les territoires peuplés à plus de 50 % d’Allemands. Le président tchécoslovaque Edvard Beneš refuse d’abord.',
  opts:[{cap:1,kd:'concession',t:'Faire pression sur Prague pour qu’elle cède',d:'Prévenir que la France ne se battra pas seule.',l:-8,fx:{e:-10,c:-6,s:-4,k:8},h:1,dr:{s:-2},dl:'Prague abandonnée : vos alliés doutent de votre parole'},
        {kd:'ferme',t:'Refuser la cession et garantir l’aide militaire',d:'Honorer l’alliance, quoi qu’il en coûte.',l:5,fx:{e:15,c:0,s:2,k:-12}},
        {kd:'neutre',t:'Proposer un plébiscite sous contrôle international',d:'Laisser les habitants décider, sous observateurs.',l:-2,fx:{e:-2,c:0,s:0,k:4}}],
  note:'Dans la nuit du 20 au 21 septembre, Londres et Paris font savoir à Prague qu’elle sera seule si elle refuse. Beneš accepte le 21 septembre.'},
 {date:'23 septembre 1938',head:'Godesberg',text:'À Bad Godesberg, Hitler hausse les enchères : il veut occuper les Sudètes dès le 1er octobre, sans attendre aucune procédure. Prague décrète la mobilisation générale.',
  opts:[{kd:'ferme',t:'Rappeler des réservistes et se préparer',d:'Montrer que la France peut se battre.',l:3,fx:{e:12,c:0,s:6,k:-6},h:1},
        {cap:0,kd:'concession',t:'Accepter les nouvelles exigences',d:'Tout pour éviter la guerre.',l:-8,fx:{e:-12,c:-4,s:-10,k:8}},
        {kd:'ferme',t:'Déclarer un soutien total à Prague mobilisée',d:'Rompre avec l’apaisement.',l:5,fx:{e:20,c:0,s:4,k:-15}},
        {kd:'neutre',t:'Coordonner une dissuasion commune avec Moscou et Prague',d:'Les contacts noués avec l’URSS rendent une alliance de revers crédible.',l:7,fx:{e:6,c:0,s:4,k:-4},req:'moscou',xn:'Uchronie : l’URSS s’est dite prête à aider Prague si la France le faisait, mais sans frontière commune, le passage de l’Armée rouge dépendait de la Pologne et de la Roumanie, qui refusaient.'}],
  note:'La France rappelle des réservistes le 24 septembre ; la Royal Navy est mobilisée le 28. L’Europe se croit à la veille de la guerre.'},
 {date:'28 septembre 1938',head:'L’offre de Mussolini',text:'À quelques heures de l’expiration de l’ultimatum allemand, Mussolini propose une conférence à quatre : Allemagne, Italie, Royaume-Uni, France. Ni Prague ni Moscou ne sont invitées.',
  opts:[{cap:0,kd:'concession',t:'Accepter la conférence à quatre',d:'Saisir la dernière chance de paix.',l:-6,fx:{e:-18,c:-4,s:4,k:10},h:1},
        {kd:'neutre',t:'Exiger la présence de la Tchécoslovaquie',d:'On ne décide pas d’un pays sans lui.',l:2,fx:{e:5,c:0,s:0,k:-5}},
        {kd:'ferme',t:'Refuser et maintenir la mobilisation',d:'Ne plus négocier sous la menace.',l:3,fx:{e:18,c:0,s:0,k:-12}}],
  note:'La conférence se tient à Munich les 29 et 30 septembre. La Tchécoslovaquie n’est pas à la table : ses représentants attendent dans une pièce voisine.'},
 {date:'30 septembre 1938',head:'Le retour au Bourget',text:'Les accords de Munich sont signés : l’Allemagne occupera les Sudètes en octobre. À votre retour, une foule vous attend à l’aéroport du Bourget.',
  opts:[{cap:1,kd:'concession',t:'Célébrer une paix durable et ralentir l’effort militaire',d:'Récolter les fruits de la paix.',l:-10,fx:{e:-8,c:0,s:10,k:6}},
        {kd:'neutre',t:'Faire ratifier l’accord et accélérer le réarmement',d:'Accepter le répit, sans illusion.',l:4,fx:{e:-2,c:0,s:6,k:0},h:1},
        {kd:'ferme',t:'Dénoncer l’accord et renouer avec Moscou',d:'Reconnaître l’erreur aussitôt.',l:3,fx:{e:10,c:0,s:-6,k:-8}}],
  note:'Daladier est acclamé ; la phrase « Ah, les cons ! » lui est attribuée, sans certitude. La Chambre approuve les accords le 4 octobre, par 535 voix contre 75. Le 15 mars 1939, l’Allemagne occupe le reste de la Bohême-Moravie.'}
 ],
 epi:['1940. Les concessions n’ont pas arrêté Hitler. La Tchécoslovaquie a disparu, la Pologne a été envahie, et la France s’est effondrée en six semaines.','1943. La guerre mondiale a fini par éclater, mais la France, mieux préparée, tient ses positions. Le prix humain reste immense.','1943. Face à un front uni, le régime nazi a reculé ou vacillé. C’est une uchronie, mais elle n’est pas absurde : en 1938, des généraux allemands préparaient un complot contre Hitler en cas de guerre.'],neg:{t:2,who:'Adolf Hitler',title:'chancelier du Reich',persona:'Veut annexer les Sudètes immédiatement, puis démanteler la Tchécoslovaquie. Méprise les démocraties, qu’il juge faibles. Bluffe, menace, fixe des ultimatums. Ne recule que devant une force crédible et unie ; toute concession est interprétée comme une faiblesse et suivie de nouvelles exigences.'},
 real:'Munich devient le symbole de l’apaisement. La guerre éclate un an plus tard, après l’invasion de la Pologne. Les historiens débattent encore : Munich a-t-il fait gagner du temps pour réarmer, ou en a-t-il fait perdre ? Leçon : céder face à des ambitions sans limite peut retarder la guerre sans l’éviter.'},
{id:'munich-cs',warOk:1,grp:'munich',camp:'Tchécoslovaquie',title:'Munich, septembre 1938',role:'Vous êtes le président de la Tchécoslovaquie, Edvard Beneš.',hist:true,start:{e:50,c:55,s:60,k:15},
 pitch:'Votre pays a des alliés, une armée, des fortifications. Il va être sacrifié sans être consulté.',
 turns:[
 {date:'Mai 1938',head:'La crise de mai',text:'Le parti des Allemands des Sudètes, dirigé par Konrad Henlein et soutenu par Berlin, réclame l’autonomie. Des rumeurs signalent des mouvements de troupes allemandes à la frontière.',
  opts:[{kd:'ferme',t:'Mobiliser partiellement pour décourager Berlin',d:'Montrer que la Tchécoslovaquie se défendra.',l:3,fx:{e:8,c:0,s:8,k:-6},h:1,f:'mai'},
        {kd:'concession',t:'Accorder l’autonomie complète aux Sudètes',d:'Désamorcer en cédant sur le fond.',l:-4,fx:{e:-6,c:0,s:-10,k:4}},
        {kd:'neutre',t:'Saisir la Société des Nations',d:'Faire constater la pression allemande.',l:0,fx:{e:-2,c:0,s:0,k:2}}],
  note:'Les 20 et 21 mai, Prague rappelle des réservistes. Hitler, humilié par l’épisode, signe le 30 mai une directive secrète : sa « décision inébranlable » est d’écraser la Tchécoslovaquie.'},
 {date:'Début septembre 1938',head:'Le quatrième plan',text:'Un médiateur britannique, Lord Runciman, est à Prague. Londres et Paris vous pressent de faire des concessions aux Allemands des Sudètes.',
  opts:[{kd:'concession',t:'Accepter presque toutes leurs revendications',d:'Prouver votre bonne foi devant Londres et Paris.',l:2,fx:{e:-6,c:0,s:-4,k:4},h:1},
        {kd:'neutre',t:'Refuser la médiation britannique',d:'Ne pas laisser l’étranger décider de vos frontières.',l:-2,fx:{e:6,c:0,s:4,k:-6}},
        {kd:'ferme',t:'Interdire le parti de Henlein',d:'Frapper l’instrument de Berlin.',l:-1,fx:{e:10,c:0,s:6,k:-8}}],
  note:'Le « quatrième plan » de Beneš accorde presque tout. Le parti de Henlein rompt pourtant les négociations : Berlin ne voulait pas d’accord, mais un prétexte.'},
 {date:'21 septembre 1938',head:'L’ultimatum des alliés',text:'En pleine nuit, les ambassadeurs de France et du Royaume-Uni vous préviennent : si vous refusez de céder les Sudètes, vous serez seuls face à l’Allemagne.',
  opts:[{cap:1,kd:'concession',t:'Accepter le plan sous la contrainte',d:'Sans la France, la guerre est perdue d’avance.',l:-4,fx:{e:-10,c:0,s:-12,k:6},h:1},
        {kd:'ferme',t:'Refuser et se préparer à combattre seuls',d:'Vos fortifications peuvent tenir des semaines.',l:4,fx:{e:18,c:-10,s:10,k:-12}},
        {kd:'ferme',t:'Demander à Moscou une aide immédiate',d:'Même sans la France, en dépit du traité.',l:3,fx:{e:12,c:0,s:4,k:-8}},
        {kd:'neutre',t:'Rappeler à Paris et Londres que votre fermeté de mai a embarrassé Berlin',d:'Votre mobilisation de mai rend l’argument crédible.',l:5,fx:{e:6,c:0,s:6,k:-2},req:'mai',xn:'Uchronie : en mai, Hitler ne préparait pas d’attaque immédiate, mais l’épisode avait montré que la fermeté de Prague pouvait gêner Berlin. Paris et Londres n’en ont tiré aucune leçon.'}],
  note:'Beneš accepte le 21 septembre. Des foules manifestent à Prague ; le gouvernement démissionne et le général Syrový forme un cabinet. Moscou se dit prête à aider, mais seulement si la France intervient.'},
 {date:'23 septembre 1938',head:'Godesberg',text:'Hitler exige désormais l’occupation des Sudètes sous huit jours. Paris et Londres semblent enfin prêts à résister.',
  opts:[{kd:'ferme',t:'Décréter la mobilisation générale',d:'Occuper les fortifications de la frontière.',l:4,fx:{e:12,c:0,s:12,k:-6},h:1},
        {kd:'concession',t:'Évacuer les Sudètes sans combattre',d:'Épargner la population civile.',l:-5,fx:{e:-10,c:4,s:-12,k:4}},
        {kd:'neutre',t:'Proposer une rectification limitée des frontières',d:'Céder un peu pour garder l’essentiel.',l:0,fx:{e:-4,c:0,s:-4,k:2}}],
  note:'La mobilisation générale est décrétée le 23 septembre au soir. Des centaines de milliers d’hommes rejoignent les fortifications. Le pays est prêt à se battre.'},
 {date:'30 septembre 1938',head:'Sur nous, sans nous',text:'À Munich, sans vous, les quatre puissances ont décidé : l’Allemagne occupera les Sudètes à partir du 1er octobre. On vous demande d’accepter.',
  opts:[{cap:0,kd:'concession',t:'Accepter pour éviter un massacre inutile',d:'Personne ne viendra vous aider.',l:-4,fx:{e:-12,c:6,s:-15,k:4},h:1},
        {kd:'ferme',t:'Refuser et combattre seuls',d:'Mourir debout plutôt que disparaître sans combat.',l:1,fx:{e:30,c:-20,s:10,k:-15}},
        {kd:'concession',t:'Accepter, mais préparer un gouvernement en exil',d:'Mettre l’or et les archives à l’abri, organiser la suite.',l:5,fx:{e:-10,c:4,s:-8,k:0}}],
  note:'Prague accepte le 30 septembre. Les Tchèques parlent de la « trahison de Munich » et résument : « Sur nous, sans nous. » Beneš démissionne le 5 octobre et s’exile. Le 15 mars 1939, Hitler entre dans Prague.'}
 ],
 epi:['1939. Le 15 mars, la Wehrmacht entre dans Prague. La Tchécoslovaquie a disparu ; ses armes et les usines Škoda servent désormais l’Allemagne.','1940. Le pays est occupé, mais un gouvernement en exil reconnu par les Alliés prépare la libération ; des pilotes tchécoslovaques combattent dans la RAF.','1943. Appuyée sur un gouvernement en exil légitime et des ressources mises à l’abri, la résistance tchécoslovaque est un acteur respecté du camp allié. Une uchronie partielle, mais plausible.'],
 neg:{t:2,who:'Édouard Daladier',title:'président du Conseil français',persona:'Veut éviter la guerre et ne combattra pas sans le Royaume-Uni. Sait que l’armée française n’est pas prête à attaquer. Embarrassé par l’alliance avec Prague, il cherche à faire accepter le plan franco-britannique ; il peut promettre une garantie des nouvelles frontières, rien de plus.'},
 real:'La Tchécoslovaquie est sacrifiée sans avoir été consultée. Beneš cède pour éviter un massacre que personne ne l’aurait aidé à empêcher. Six mois plus tard, Prague est occupée. Leçon : un petit État ne peut pas compter sur des garanties que ses alliés ne sont pas prêts à honorer.'},
{id:'berlin',grp:'berlin',camp:"États-Unis",title:'Berlin, juin 1948',role:'Vous êtes le président des États-Unis, Harry S. Truman.',hist:true,start:{e:40,c:45,s:50,k:30},
 pitch:'Staline coupe toutes les routes vers Berlin-Ouest. Plus de deux millions d’habitants à nourrir. Sans tirer un coup de feu ?',
 turns:[
 {date:'24 juin 1948',head:'Le blocus',text:'Après l’introduction du deutsche mark dans les zones occidentales, les Soviétiques coupent les accès terrestres et fluviaux à Berlin-Ouest. La ville n’a que quelques semaines de réserves.',
  opts:[{kd:'ferme',t:'Forcer le passage avec un convoi blindé',d:'L’option défendue par le général Clay.',l:-4,fx:{e:25,c:0,s:6,k:-15},dr:{e:4},dl:'Convoi forcé : soldats américains et soviétiques face à face'},
        {kd:'neutre',t:'Rester et ravitailler la ville par avion',d:'Contourner le blocus par le ciel.',l:6,fx:{e:-2,c:8,s:6,k:0},h:1},
        {cap:0,kd:'concession',t:'Évacuer Berlin-Ouest',d:'Éviter la confrontation, abandonner la ville.',l:-8,fx:{e:-10,c:-6,s:-15,k:5}}],
  note:'Le pont aérien commence le 26 juin. Truman tranche : « Nous restons à Berlin, point final. » Peu de responsables croient alors possible de nourrir une ville entière par avion.'},
 {date:'Juillet 1948',head:'Le défi logistique',text:'Les livraisons restent loin des milliers de tonnes nécessaires chaque jour. Moscou parie sur l’échec du pont aérien avant l’hiver.',
  opts:[{kd:'neutre',t:'Mobiliser toute la flotte de transport et un spécialiste',d:'Confier l’opération au général William Tunner.',l:5,fx:{e:0,c:12,s:4,k:0},h:1,f:'tunner'},
        {kd:'neutre',t:'Réduire le pont aérien et négocier',d:'Limiter les coûts, tester Staline.',l:-4,fx:{e:-4,c:-8,s:-6,k:5}},
        {kd:'ferme',t:'Envoyer des bombardiers en Angleterre',d:'Un signal de force adressé à Moscou.',l:0,fx:{e:10,c:0,s:4,k:-8}}],
  note:'Tunner prend le commandement fin juillet et organise des rotations d’une précision industrielle. Des bombardiers B-29 sont aussi déployés en Grande-Bretagne ce mois-là, non équipés pour la bombe atomique, ce que Moscou ignore.'},
 {date:'9 septembre 1948',head:'« Peuples du monde, regardez cette ville ! »',text:'Devant le Reichstag en ruine, le maire élu Ernst Reuter harangue des centaines de milliers de Berlinois. Les négociations avec Moscou piétinent.',
  opts:[{kd:'neutre',t:'Porter l’affaire devant le Conseil de sécurité de l’ONU',d:'Prendre le monde à témoin.',l:2,fx:{e:-4,c:0,s:4,k:2},h:1},
        {kd:'ferme',t:'Laisser Clay tester un convoi',d:'Vérifier si les Soviétiques oseront tirer.',l:-5,fx:{e:20,c:0,s:4,k:-12}},
        {kd:'ouverture',t:'Ouvrir un canal secret avec Staline',d:'Explorer un compromis monétaire.',l:1,fx:{e:-6,c:0,s:-4,k:8}}],
  note:'Les Occidentaux saisissent le Conseil de sécurité en septembre ; une résolution de compromis se heurte au veto soviétique le 25 octobre. Le pont aérien devient un symbole.'},
 {date:'Hiver 1948',head:'Le froid',text:'Brouillard, verglas, pénurie de charbon. L’électricité est rationnée à quelques heures par jour. Les aéroports de Tempelhof et Gatow sont saturés.',
  opts:[{kd:'neutre',t:'Construire un troisième aéroport',d:'Faire bâtir Tegel en quelques mois par les Berlinois.',l:4,fx:{e:0,c:10,s:6,k:0},h:1},
        {kd:'neutre',t:'Rationner plus sévèrement',d:'Tenir en réduisant les besoins.',l:-2,fx:{e:0,c:-10,s:-4,k:0}},
        {kd:'ferme',t:'Escorter les avions par des chasseurs',d:'Dissuader tout harcèlement soviétique.',l:-2,fx:{e:10,c:0,s:2,k:-6}},
        {kd:'neutre',t:'Préparer un record de livraisons pour briser le moral adverse',d:'La machine de Tunner peut viser l’exploit.',l:5,fx:{e:0,c:14,s:8,k:-2},req:'tunner',xn:'Le 16 avril 1949, l’opération « Easter Parade » livre 12 941 tonnes en vingt-quatre heures, un record qui convainc Moscou que le blocus a échoué.'}],
  note:'Tegel est construit en environ trois mois et ouvre en novembre 1948. Le pilote Gail Halvorsen lâche des friandises en petits parachutes : on l’appelle le « bombardier des bonbons ».'},
 {date:'Printemps 1949',head:'La sortie',text:'Le pont aérien livre désormais plus que les trains d’avant le blocus. À l’ONU, un diplomate soviétique laisse entendre que Moscou pourrait lever le blocus.',
  opts:[{kd:'ouverture',t:'Négocier discrètement la levée, sans concession monétaire',d:'Laisser Staline reculer sans le dire.',l:6,fx:{e:-15,c:6,s:6,k:12},h:1},
        {kd:'neutre',t:'Exiger une reconnaissance publique de l’échec',d:'Humilier Moscou.',l:-4,fx:{e:5,c:0,s:4,k:-8}},
        {cap:1,kd:'concession',t:'Renoncer à créer un État ouest-allemand',d:'Payer la paix d’une concession majeure.',l:-6,fx:{e:-10,c:0,s:-15,k:10}}],
  note:'Des discussions secrètes entre les diplomates Philip Jessup et Iakov Malik aboutissent : le blocus est levé le 12 mai 1949. Entre-temps, l’OTAN est créée le 4 avril, et la RFA naît le 23 mai.'}
 ],
 epi:['1953. Berlin-Ouest a été abandonné ou arraché par la force. Les Européens doutent de Washington, et la guerre froide prend un tour plus dangereux.','1953. Berlin tient, mais la ville reste un point de friction permanent au cœur de l’Europe.','1953. Berlin-Ouest est devenu le symbole de la liberté. L’Alliance atlantique est solide, et Moscou sait que l’Ouest ne cédera pas sur la ville.'],neg:{t:4,who:'Joseph Staline',title:'dirigeant de l’URSS',persona:'Veut empêcher la création d’un État ouest-allemand et chasser les Occidentaux de Berlin, mais sans guerre. Patient, cynique, méfiant. Lève le blocus seulement s’il peut sauver la face et si le blocus a manifestement échoué.'},
 real:'Une victoire occidentale sans combat, grâce à une logistique hors norme. Mais l’Allemagne est désormais coupée en deux, et la guerre froide s’installe. Leçon : quand la force est trop risquée, contourner l’obstacle peut retourner la pression contre l’adversaire.'},
{id:'suez',grp:'suez',camp:"France",title:'Suez, 1956',role:'Vous êtes le président du Conseil français, Guy Mollet.',hist:true,start:{e:35,c:60,s:55,k:30},
 pitch:'Nasser nationalise le canal de Suez. Paris et Londres veulent le renverser, avec Israël. Gagner la guerre peut-il faire perdre la partie ?',
 turns:[
 {date:'26 juillet 1956',head:'La nationalisation',text:'À Alexandrie, Nasser annonce la nationalisation de la Compagnie du canal de Suez, à capitaux français et britanniques. Il veut financer le barrage d’Assouan, après le retrait des financements américains. Paris lui reproche aussi son soutien au FLN algérien.',
  opts:[{kd:'ferme',t:'Préparer avec Londres une intervention militaire',d:'Reprendre le canal et faire tomber Nasser.',l:-4,fx:{e:12,c:0,s:10,k:-10},h:1},
        {kd:'ouverture',t:'Saisir l’ONU',d:'Placer le différend sur le terrain du droit.',l:4,fx:{e:-6,c:0,s:-6,k:4},f:'onu'},
        {kd:'concession',t:'Négocier l’indemnisation des actionnaires',d:'Accepter le fait accompli contre compensation.',l:2,fx:{e:-8,c:0,s:-10,k:8}}],
  note:'Guy Mollet compare Nasser à Hitler. Paris et Londres décident de préparer une opération militaire commune, baptisée « Mousquetaire ».'},
 {date:'Septembre 1956',head:'Les conférences de Londres',text:'Les pays usagers du canal se réunissent à Londres. Washington propose une association des usagers et s’oppose à tout recours à la force. Eisenhower est en campagne pour sa réélection.',
  opts:[{kd:'neutre',t:'Jouer le jeu diplomatique en préparant l’opération',d:'Gagner du temps sans renoncer.',l:-1,fx:{e:4,c:0,s:2,k:0},h:1},
        {kd:'concession',t:'Se rallier au plan américain et renoncer à la force',d:'Ne pas se brouiller avec Washington.',l:3,fx:{e:-10,c:0,s:-10,k:8}},
        {kd:'ferme',t:'Frapper seuls, sans attendre Londres',d:'La France n’a besoin de personne.',l:-6,fx:{e:18,c:-4,s:4,k:-12}}],
  note:'Les conférences d’août et de septembre n’aboutissent à rien de décisif. Nasser refuse de céder le contrôle du canal ; les préparatifs militaires franco-britanniques se poursuivent.'},
 {date:'24 octobre 1956',head:'Le protocole de Sèvres',text:'Dans une villa de Sèvres, des responsables français, britanniques et israéliens mettent au point un plan secret : Israël attaquera dans le Sinaï ; Paris et Londres interviendront ensuite pour « séparer les belligérants ».',
  opts:[{kd:'ferme',t:'Signer le protocole secret',d:'Un prétexte parfait, si le secret tient.',l:-6,fx:{e:15,c:0,s:4,k:-12},h:1,dr:{k:-3},dl:'Collusion de Sèvres : le secret finira par se savoir'},
        {kd:'ferme',t:'Intervenir ouvertement aux côtés d’Israël',d:'Assumer l’alliance sans faux-semblant.',l:-3,fx:{e:12,c:0,s:2,k:-10}},
        {kd:'concession',t:'Renoncer à l’opération',d:'Le risque diplomatique est trop grand.',l:4,fx:{e:-12,c:0,s:-12,k:8}}],
  note:'Le protocole est signé le 24 octobre en présence de David Ben Gourion, de Guy Mollet, de son ministre Christian Pineau et de Maurice Bourgès-Maunoury. Israël attaque le 29 octobre ; l’ultimatum franco-britannique suit le 30.'},
 {date:'5 novembre 1956',head:'Port-Saïd',text:'Les parachutistes français et britanniques sautent sur Port-Saïd et Port-Fouad. Mais à Budapest, les chars soviétiques écrasent l’insurrection hongroise, et Moscou menace Paris et Londres de ses missiles. Washington fait pression sur la livre sterling.',
  opts:[{cap:0,kd:'ferme',t:'Pousser jusqu’au bout du canal',d:'Achever l’opération avant que tout s’effondre.',l:-6,fx:{e:20,c:-8,s:4,k:-15}},
        {kd:'concession',t:'Accepter le cessez-le-feu demandé par l’ONU',d:'Londres flanche ; la France ne peut pas rester seule.',l:2,fx:{e:-15,c:4,s:-10,k:8},h:1},
        {kd:'neutre',t:'Demander à Washington une garantie contre Moscou',d:'Forcer les Américains à choisir leur camp.',l:-2,fx:{e:4,c:0,s:0,k:-2}},
        {kd:'concession',t:'Proposer que la force de l’ONU prenne le relais de vos troupes',d:'Votre démarche à l’ONU en juillet vous rend crédible.',l:6,fx:{e:-16,c:4,s:-2,k:10},req:'onu',xn:'Uchronie partielle : la Force d’urgence des Nations unies, proposée par le Canadien Lester Pearson, est bien créée début novembre. Mais Paris, ayant choisi la force, n’a pas pu en faire un instrument de ses intérêts.'}],
  note:'Le 5 novembre, le maréchal Boulganine menace Londres et Paris. Le 6, sous la pression financière américaine, Anthony Eden accepte le cessez-le-feu. La France suit, à contrecœur, à minuit.'},
 {date:'Décembre 1956',head:'Le retrait',text:'Les troupes franco-britanniques quittent l’Égypte, remplacées par les Casques bleus. Nasser apparaît comme le grand vainqueur. Quelle leçon en tirer ?',
  opts:[{kd:'neutre',t:'Se tourner vers l’Europe et la bombe française',d:'Ne plus jamais dépendre de Washington.',l:6,fx:{e:-4,c:0,s:8,k:4},h:1},
        {kd:'neutre',t:'S’aligner désormais sur Washington',d:'Admettre qu’on ne peut rien sans les États-Unis.',l:2,fx:{e:-4,c:0,s:-6,k:4}},
        {kd:'concession',t:'Renouer avec Nasser',d:'Tourner la page au plus vite.',l:1,fx:{e:-6,c:0,s:-10,k:8}}],
  note:'Le retrait s’achève le 22 décembre. Selon la formule attribuée au chancelier Adenauer, présent à Paris le 6 novembre : « L’Europe sera votre revanche. » Le traité de Rome est signé le 25 mars 1957, et le programme nucléaire militaire français s’accélère.'}
 ],
 epi:['1961. La France est isolée, brouillée avec Washington, rejetée dans le monde arabe, et la guerre d’Algérie s’enlise.','1961. La crise a laissé des traces, mais Paris en a tiré les leçons : l’Europe se construit, et la France a fait exploser sa première bombe atomique en février 1960.','1961. La France a préservé ses relations avec Washington et le monde arabe tout en construisant l’Europe. Son influence au Proche-Orient sort renforcée.'],neg:{t:1,who:'Gamal Abdel Nasser',title:'président de l’Égypte',persona:'Veut garder la souveraineté égyptienne sur le canal, symbole de l’indépendance et du nationalisme arabe. Accepte d’indemniser les actionnaires et de garantir la liberté de navigation, mais refuse tout contrôle international imposé. Rejette fermement les menaces ; très populaire.'},
 real:'Une victoire militaire et une défaite politique. Nasser triomphe dans le monde arabe ; Anthony Eden démissionne en janvier 1957. Paris et Londres découvrent qu’ils ne peuvent plus agir contre la volonté de Washington et de Moscou. Leçon : une victoire militaire sans soutien diplomatique peut se transformer en défaite.'},
{id:'cuba-su',grp:'cuba',camp:'URSS',title:'Cuba, octobre 1962',role:'Vous êtes le dirigeant soviétique, Nikita Khrouchtchev.',hist:true,start:{e:40,c:60,s:50,k:30},
 pitch:'Les Américains ont des missiles en Turquie. Pourquoi n’en auriez-vous pas à Cuba ?',
 turns:[
 {date:'Mai 1962',head:'L’idée',text:'Les États-Unis ont une écrasante supériorité nucléaire et viennent d’installer des missiles Jupiter en Turquie, à vos portes. Un an après la tentative d’invasion de la baie des Cochons, Fidel Castro craint une nouvelle attaque.',
  opts:[{kd:'ferme',t:'Déployer en secret des missiles nucléaires à Cuba',d:'Protéger Cuba et rééquilibrer le rapport de force d’un coup.',l:-4,fx:{e:10,c:0,s:8,k:-8},h:1},
        {kd:'neutre',t:'Envoyer seulement des armes conventionnelles et des conseillers',d:'Défendre Cuba sans provoquer Washington.',l:3,fx:{e:2,c:0,s:-4,k:0}},
        {kd:'neutre',t:'Exiger publiquement le retrait des Jupiter de Turquie',d:'Porter le débat sur la scène internationale.',l:4,fx:{e:-4,c:0,s:-6,k:6}}],
  note:'Le Présidium approuve l’opération Anadyr. Plus de 40 000 soldats soviétiques et des dizaines de missiles sont acheminés à Cuba dans le plus grand secret.'},
 {date:'22 octobre 1962',head:'La quarantaine',text:'Kennedy révèle la présence des missiles à la télévision et annonce une « quarantaine » navale. Vos cargos approchent de la ligne américaine.',
  opts:[{kd:'neutre',t:'Dénoncer la « piraterie » mais ralentir les navires',d:'Protester fort, sans forcer le passage.',l:2,fx:{e:4,c:0,s:2,k:0},h:1},
        {cap:1,kd:'ferme',t:'Ordonner aux navires de forcer le blocus',d:'Ne pas plier devant les Américains.',l:-6,fx:{e:20,c:0,s:6,k:-12}},
        {kd:'concession',t:'Reconnaître les missiles et proposer un marché',d:'Prendre l’initiative diplomatique.',l:3,fx:{e:-6,c:0,s:-8,k:8},f:'aveu'}],
  note:'Khrouchtchev dénonce un acte de « piraterie ». Le 24 octobre, plusieurs navires s’arrêtent ou font demi-tour. À Cuba, le montage des missiles continue.'},
 {date:'26 octobre 1962',head:'La peur de l’invasion',text:'Vos services annoncent une invasion américaine imminente. Dans la nuit, Fidel Castro vous écrit : si les Américains envahissent l’île, l’URSS doit frapper la première.',
  opts:[{kd:'concession',t:'Écrire à Kennedy : retrait contre promesse de non-invasion',d:'Une longue lettre personnelle, d’homme à homme.',l:5,fx:{e:-10,c:0,s:-2,k:8},h:1},
        {cap:1,kd:'ferme',t:'Suivre Castro et préparer une frappe en cas d’invasion',d:'Tenir parole envers l’allié cubain.',l:-8,fx:{e:20,c:0,s:4,k:-12}},
        {kd:'ferme',t:'Garder le silence et accélérer les travaux',d:'Rendre les missiles opérationnels avant toute attaque.',l:-3,fx:{e:8,c:0,s:2,k:-6}}],
  note:'Le 26, Khrouchtchev envoie à Kennedy une lettre où il compare la crise à une corde où l’on a noué « le nœud de la guerre ». Il juge insensée la demande de Castro.'},
 {date:'27 octobre 1962',head:'Le tir non ordonné',text:'Ce matin, vous avez exigé publiquement le retrait des Jupiter de Turquie. Puis une batterie soviétique abat un avion espion américain au-dessus de Cuba, sans ordre de Moscou. Le pilote est tué.',
  opts:[{kd:'ferme',t:'Couvrir l’incident et maintenir la pression',d:'Ne jamais montrer de faiblesse.',l:-3,fx:{e:10,c:0,s:4,k:-8}},
        {kd:'ouverture',t:'Interdire tout nouveau tir et chercher un accord discret',d:'Passer par l’ambassadeur Dobrynine.',l:5,fx:{e:-12,c:0,s:0,k:10},h:1},
        {cap:1,kd:'ferme',t:'Mettre vos forces à Cuba en alerte maximale',d:'Se préparer au pire.',l:-5,fx:{e:18,c:0,s:2,k:-10}},
        {kd:'concession',t:'Proposer des inspections de l’ONU contre la promesse de non-invasion',d:'Votre franchise du 22 octobre rend l’offre crédible.',l:5,fx:{e:-12,c:0,s:-2,k:10},req:'aveu',xn:'Uchronie partielle : le secrétaire général de l’ONU, U Thant, a bien proposé ses bons offices. Mais Castro a refusé toute inspection sur son sol.'}],
  note:'Moscou reproche le tir aux commandants sur place. Le soir, Robert Kennedy propose à Dobrynine un marché : retrait des missiles contre promesse de non-invasion, et retrait des Jupiter, à condition que cela reste secret.'},
 {date:'28 octobre 1962',head:'La décision',text:'L’offre américaine est sur la table. Mais la partie sur la Turquie doit rester secrète : publiquement, c’est vous qui reculerez.',
  opts:[{kd:'concession',t:'Annoncer à la radio le démantèlement des missiles',d:'Accepter un bon accord que vous ne pourrez pas revendiquer.',l:6,fx:{e:-15,c:0,s:-8,k:12},h:1},
        {kd:'ferme',t:'Exiger que l’accord sur la Turquie soit rendu public',d:'Ne pas passer pour le perdant.',l:-2,fx:{e:8,c:0,s:4,k:-6}},
        {cap:0,kd:'ferme',t:'Garder les missiles et miser sur le bluff',d:'Parier que Kennedy n’osera pas attaquer.',l:-8,fx:{e:20,c:-6,s:2,k:-15}}],
  note:'Radio Moscou annonce le démantèlement le 28 octobre. L’accord sur les Jupiter reste secret. Castro, qui n’a pas été consulté, est furieux.'}
 ],
 epi:['1967. L’URSS sort humiliée de la crise, Cuba est isolé, et les deux Grands sont passés tout près de la catastrophe.','1964. Accusé d’avoir reculé devant Washington, Khrouchtchev est écarté du pouvoir en octobre. Moscou lance une course aux armements pour ne plus jamais être en position d’infériorité.','1967. Cuba n’a pas été envahi, les missiles ont quitté la Turquie et la ligne directe fonctionne : une paix que Moscou peut revendiquer.'],
 neg:{t:3,who:'John F. Kennedy',title:'président des États-Unis',persona:'Veut le retrait des missiles. Ne peut pas paraître céder sous la menace, à quelques jours des élections de mi-mandat, et ses chefs militaires le pressent d’attaquer. Prêt à promettre de ne pas envahir Cuba et à retirer les Jupiter discrètement, jamais publiquement.'},
 real:'La guerre nucléaire est évitée. Sur le fond, Khrouchtchev obtient ce qu’il voulait : Cuba n’est pas envahi, et les Jupiter quittent la Turquie en 1963. Mais le secret de l’accord le fait passer pour le perdant, et il est écarté en 1964. Leçon : un accord peut être bon sur le fond et désastreux pour celui qui ne peut pas le revendiquer.'},
{id:'kippour',grp:'kippour',camp:'États-Unis',title:'Kippour, octobre 1973',role:'Vous êtes le secrétaire d’État américain, Henry Kissinger.',hist:true,start:{e:50,c:45,s:50,k:35},
 pitch:'Une guerre au Proche-Orient, deux superpuissances derrière chaque camp, un embargo pétrolier. Éviter l’affrontement nucléaire et ouvrir la voie à la paix.',
 turns:[
 {date:'6 octobre 1973',head:'L’attaque surprise',text:'Le jour de Yom Kippour, l’Égypte et la Syrie attaquent Israël sur le canal de Suez et sur le plateau du Golan. Israël subit de lourdes pertes dans les premiers jours.',
  opts:[{kd:'neutre',t:'Appeler à un cessez-le-feu immédiat sur place',d:'Figer les lignes au plus vite.',l:-2,fx:{e:-5,c:4,s:-6,k:6}},
        {kd:'neutre',t:'Temporiser sans s’engager publiquement',d:'Laisser la situation militaire se clarifier.',l:2,fx:{e:0,c:-2,s:0,k:2},h:1},
        {kd:'ferme',t:'Avertir Moscou d’une intervention américaine',d:'Menacer pour arrêter l’offensive.',l:-4,fx:{e:12,c:0,s:2,k:-10},dr:{e:3},dl:'Menace sur Moscou : les flottes se surveillent en Méditerranée'}],
  note:'Washington temporise. Kissinger veut éviter à la fois une défaite d’Israël et une victoire écrasante qui fermerait la porte à toute négociation.'},
 {date:'13 octobre 1973',head:'Le pont aérien',text:'Moscou ravitaille l’Égypte et la Syrie par avion. Israël manque de munitions et d’équipements.',
  opts:[{kd:'ferme',t:'Lancer un pont aérien militaire massif vers Israël',d:'Rétablir l’équilibre face au soutien soviétique.',l:3,fx:{e:10,c:0,s:6,k:-8},h:1},
        {kd:'neutre',t:'Livrer discrètement par des vols civils',d:'Aider sans provoquer.',l:0,fx:{e:2,c:0,s:0,k:-2}},
        {kd:'neutre',t:'Refuser pour ménager les pays arabes',d:'Préserver les relations pétrolières.',l:-4,fx:{e:-4,c:0,s:-8,k:4}}],
  note:'L’opération Nickel Grass commence le 14 octobre. En quelques semaines, les avions américains livrent plus de 22 000 tonnes de matériel.'},
 {date:'20 octobre 1973',head:'L’arme du pétrole',text:'Les pays arabes producteurs réduisent leur production et décrètent un embargo contre les États-Unis. Sur le terrain, l’armée israélienne a franchi le canal de Suez.',
  opts:[{kd:'ouverture',t:'Négocier un cessez-le-feu directement avec Moscou',d:'Aller voir Brejnev en personne.',l:4,fx:{e:-8,c:4,s:0,k:8},h:1,f:'brejnev'},
        {kd:'neutre',t:'Suspendre l’aide militaire pour lever l’embargo',d:'Céder à la pression économique.',l:-4,fx:{e:-2,c:0,s:-10,k:4}},
        {kd:'ferme',t:'Menacer les pays producteurs',d:'Ne pas laisser le pétrole devenir une arme.',l:-6,fx:{e:15,c:0,s:4,k:-10}}],
  note:'Kissinger se rend à Moscou les 20 et 21 octobre. Le Conseil de sécurité adopte la résolution 338, qui appelle au cessez-le-feu, le 22 octobre.'},
 {date:'24 octobre 1973',head:'La menace de Brejnev',text:'Le cessez-le-feu est violé ; la IIIe armée égyptienne est encerclée. Brejnev menace d’intervenir seul si Washington refuse une force conjointe.',
  opts:[{kd:'ferme',t:'Placer les forces en alerte et faire ravitailler l’armée encerclée',d:'Fermeté face à Moscou, pression sur Israël.',l:5,fx:{e:8,c:6,s:2,k:-2},h:1},
        {kd:'concession',t:'Accepter une force conjointe américano-soviétique',d:'Coopérer pour éteindre l’incendie.',l:-3,fx:{e:-6,c:0,s:-8,k:8}},
        {cap:0,kd:'ferme',t:'Laisser Israël réduire l’armée encerclée',d:'Une victoire totale pour l’allié.',l:-8,fx:{e:20,c:-10,s:2,k:-15}},
        {kd:'ouverture',t:'Appeler Brejnev et proposer une déclaration commune',d:'Le lien noué à Moscou le 20 octobre peut servir.',l:4,fx:{e:-12,c:4,s:-4,k:10},req:'brejnev',xn:'Uchronie : en réalité, Washington a choisi l’alerte nucléaire plutôt qu’une démarche commune, tout en évitant d’humilier Moscou.'}],
  note:'Dans la nuit du 24 au 25 octobre, les forces américaines passent en alerte DEFCON 3. Washington obtient en parallèle qu’un convoi ravitaille la IIIe armée. La résolution 340 crée une force de l’ONU sans les superpuissances.'},
 {date:'Novembre 1973',head:'L’après-guerre',text:'Les armes se sont tues. Reste à transformer le cessez-le-feu en paix.',
  opts:[{kd:'ouverture',t:'Négocier pas à pas, en navette entre les capitales',d:'Accumuler de petits accords concrets.',l:8,fx:{e:-15,c:6,s:4,k:12},h:1},
        {kd:'neutre',t:'Viser un règlement global immédiat',d:'Traiter toutes les questions d’un coup.',l:-1,fx:{e:-4,c:0,s:0,k:4}},
        {kd:'neutre',t:'Se désengager de la région',d:'Laisser les acteurs régionaux régler leurs comptes.',l:-6,fx:{e:6,c:-4,s:-4,k:-4}}],
  note:'Des pourparlers s’ouvrent au « kilomètre 101 ». Suivent les accords de désengagement dans le Sinaï (janvier 1974) puis sur le Golan (mai 1974). C’est la « diplomatie de la navette ».'}
 ],
 epi:['1978. Le Proche-Orient reste en guerre larvée. Les superpuissances arment chaque camp, et le pétrole reste une arme.','1978. Les armes se sont tues, mais aucun accord de fond n’est en vue. La région attend la prochaine guerre.','1978. Sadate s’est rendu à Jérusalem, et les accords de Camp David se négocient. La paix entre l’Égypte et Israël devient possible.'],neg:{t:3,who:'Leonid Brejnev',title:'secrétaire général du Parti communiste de l’URSS',persona:'Veut sauver la IIIe armée égyptienne encerclée et le prestige soviétique, tout en préservant la détente avec Washington. Menace d’intervenir seul, mais préfère une solution négociée qui ne l’humilie pas.'},
 real:'L’affrontement entre superpuissances est évité, mais le prix du pétrole quadruple et l’économie mondiale entre en crise. La guerre ouvre aussi la voie à la paix israélo-égyptienne de 1979. Leçon : un équilibre où personne n’est écrasé laisse une place à la diplomatie.'},
{id:'kippour-su',grp:'kippour',camp:'URSS',title:'Kippour, octobre 1973',role:'Vous êtes le dirigeant soviétique, Leonid Brejnev.',hist:true,start:{e:50,c:45,s:50,k:35},
 pitch:'Vos alliés arabes attaquent. Les sauver sans casser la détente avec Washington.',
 turns:[
 {date:'4 octobre 1973',head:'Le secret',text:'Le Caire et Damas vous informent qu’ils attaqueront Israël dans deux jours. La détente avec Washington est votre grande réussite diplomatique.',
  opts:[{kd:'neutre',t:'Évacuer discrètement les familles de vos conseillers, sans prévenir Washington',d:'Protéger vos ressortissants, respecter le secret allié.',l:-1,fx:{e:4,c:0,s:0,k:-4},h:1},
        {kd:'concession',t:'Prévenir Washington pour empêcher la guerre',d:'Sauver la détente, quitte à trahir vos alliés.',l:3,fx:{e:-6,c:0,s:-6,k:8}},
        {kd:'ferme',t:'Encourager ouvertement l’offensive arabe',d:'Affaiblir Israël et l’influence américaine.',l:-4,fx:{e:10,c:0,s:4,k:-10}}],
  note:'Les 4 et 5 octobre, des avions soviétiques évacuent les familles des conseillers en Égypte et en Syrie. Moscou ne prévient pas Washington.'},
 {date:'10 octobre 1973',head:'Le ravitaillement',text:'Les armées arabes consomment leurs munitions à un rythme vertigineux. La Syrie recule sur le Golan.',
  opts:[{kd:'ferme',t:'Lancer un pont aérien et maritime massif',d:'Ne pas laisser vos alliés manquer de rien.',l:-1,fx:{e:10,c:0,s:6,k:-8},h:1},
        {kd:'neutre',t:'Livrer le minimum',d:'Garder le contrôle de l’escalade.',l:2,fx:{e:2,c:0,s:-4,k:0}},
        {kd:'ouverture',t:'Proposer à Washington un embargo commun sur les armes',d:'Arrêter la guerre par l’asphyxie.',l:4,fx:{e:-8,c:2,s:-6,k:8},f:'embargo'}],
  note:'Le pont aérien soviétique commence dès le 9 et le 10 octobre. Washington répond par le sien, l’opération Nickel Grass, le 14.'},
 {date:'18 octobre 1973',head:'Le retournement',text:'Les Israéliens ont franchi le canal de Suez. Votre Premier ministre Alexis Kossyguine, au Caire, constate que l’armée égyptienne risque l’effondrement.',
  opts:[{kd:'ouverture',t:'Inviter Kissinger à Moscou pour imposer un cessez-le-feu',d:'Agir avec Washington, en coprésidents de la paix.',l:4,fx:{e:-8,c:4,s:0,k:8},h:1},
        {kd:'ferme',t:'Menacer directement Israël',d:'Faire planer la menace d’une intervention.',l:-3,fx:{e:10,c:0,s:4,k:-8}},
        {kd:'neutre',t:'Laisser l’Égypte se débrouiller',d:'Sadate a refusé vos conseils de prudence.',l:-2,fx:{e:2,c:-4,s:-6,k:0}}],
  note:'Kissinger arrive à Moscou le 20 octobre. Les deux Grands rédigent ensemble la résolution 338, adoptée par le Conseil de sécurité le 22.'},
 {date:'24 octobre 1973',head:'La IIIe armée',text:'Le cessez-le-feu est violé ; la IIIe armée égyptienne est encerclée. Sadate vous supplie d’envoyer des troupes avec les Américains.',
  opts:[{kd:'ferme',t:'Écrire à Nixon : force conjointe, sinon intervention seule',d:'Une menace pour forcer Washington à retenir Israël.',l:1,fx:{e:15,c:4,s:4,k:-6},h:1},
        {cap:0,kd:'ferme',t:'Envoyer des divisions aéroportées en Égypte',d:'Sauver l’armée égyptienne par la force.',l:-10,fx:{e:30,c:0,s:6,k:-20}},
        {kd:'concession',t:'Accepter une force de l’ONU sans les superpuissances',d:'Laisser les Casques bleus séparer les armées.',l:4,fx:{e:-10,c:4,s:-4,k:8}},
        {kd:'ouverture',t:'Proposer à Nixon un arrêt mutuel des livraisons d’armes et une force de l’ONU',d:'Votre offre d’embargo du 10 octobre vous rend crédible.',l:6,fx:{e:-14,c:4,s:-2,k:12},req:'embargo',xn:'Uchronie : aucune proposition d’embargo commun n’a été faite. Les deux Grands ont continué d’armer leurs alliés jusqu’au cessez-le-feu.'}],
  note:'Brejnev écrit à Nixon dans la nuit du 24 octobre ; des divisions aéroportées soviétiques sont en alerte. Washington passe en DEFCON 3, puis obtient le ravitaillement de la IIIe armée. La résolution 340 crée une force de l’ONU sans les superpuissances.'},
 {date:'Décembre 1973',head:'La paix des autres',text:'Les armes se sont tues. Kissinger multiplie les navettes entre Le Caire et Jérusalem, sans vous.',
  opts:[{kd:'ouverture',t:'Coprésider la conférence de Genève avec Washington',d:'Rester à la table de la paix.',l:2,fx:{e:-6,c:0,s:0,k:6},h:1},
        {kd:'ferme',t:'Réarmer massivement la Syrie',d:'Garder au moins un allié solide.',l:-3,fx:{e:8,c:0,s:4,k:-6}},
        {cap:1,kd:'ferme',t:'Rompre la détente',d:'Washington vous a joué ; ne plus coopérer.',l:-6,fx:{e:12,c:0,s:4,k:-12}}],
  note:'La conférence de Genève s’ouvre le 21 décembre 1973 sous coprésidence soviétique et américaine, mais tourne court. L’Égypte bascule vers Washington et dénonce en 1976 son traité d’amitié avec l’URSS.'}
 ],
 epi:['1978. La détente est morte, et le Proche-Orient est devenu un champ de bataille par procuration entre les deux Grands.','1978. Moscou garde la Syrie, mais a perdu l’Égypte au profit de Washington. L’influence soviétique au Proche-Orient recule.','1978. La détente a survécu : les accords sur les armements progressent, et Moscou reste un médiateur incontournable au Proche-Orient. Une uchronie partielle.'],
 neg:{t:3,who:'Henry Kissinger',title:'secrétaire d’État américain',persona:'Veut empêcher toute présence militaire soviétique au Proche-Orient et préserver la détente, sans laisser Israël humilier l’Égypte. Ne cède jamais à une menace, mais accepte une solution de l’ONU sans les superpuissances. Nixon est affaibli par le Watergate.'},
 real:'L’URSS sauve l’armée égyptienne et évite l’affrontement direct, mais elle perd l’Égypte, qui bascule vers Washington. Leçon : armer un allié ne suffit pas à le garder ; c’est celui qui peut lui rendre son territoire qui l’emporte.'},
{id:'kippour-il',grp:'kippour',camp:'Israël',title:'Kippour, octobre 1973',role:'Vous êtes la Première ministre d’Israël, Golda Meir.',hist:true,start:{e:50,c:50,s:55,k:20},
 pitch:'Attaqué le jour le plus sacré du calendrier juif, sur deux fronts à la fois.',
 turns:[
 {date:'6 octobre 1973, à l’aube',head:'L’avertissement',text:'Un informateur au Caire prévient le Mossad : l’Égypte et la Syrie attaqueront aujourd’hui. C’est Yom Kippour ; le pays est à l’arrêt. Le chef d’état-major David Elazar réclame une frappe aérienne préventive et la mobilisation générale.',
  opts:[{kd:'ferme',t:'Autoriser la frappe préventive',d:'Frapper les premiers, comme en 1967.',l:-6,fx:{e:12,c:0,s:2,k:-10}},
        {kd:'neutre',t:'Refuser la frappe préventive et mobiliser les réserves',d:'Ne pas apparaître comme l’agresseur aux yeux de Washington.',l:5,fx:{e:0,c:-6,s:-4,k:2},h:1,f:'retenue'},
        {kd:'neutre',t:'Mobiliser seulement une partie des réserves',d:'Éviter de paniquer le pays sur un simple avertissement.',l:-2,fx:{e:2,c:-10,s:0,k:0}}],
  note:'Golda Meir refuse la frappe préventive : Israël ne doit pas apparaître comme l’agresseur, faute de quoi l’aide américaine serait compromise. Elle autorise une large mobilisation. L’attaque commence vers 14 heures.'},
 {date:'8 octobre 1973',head:'Deux fronts qui cèdent',text:'Sur le Golan, les blindés syriens sont à quelques kilomètres de la Galilée. Dans le Sinaï, la ligne Bar-Lev est tombée et une contre-attaque vient d’échouer. Il faut choisir un front prioritaire.',
  opts:[{kd:'neutre',t:'Priorité au Golan',d:'Il est le plus proche des villes israéliennes.',l:4,fx:{e:4,c:6,s:2,k:0},h:1},
        {kd:'neutre',t:'Priorité au Sinaï',d:'Repousser l’armée égyptienne, la plus nombreuse.',l:-3,fx:{e:4,c:-6,s:0,k:0}},
        {cap:1,kd:'concession',t:'Demander un cessez-le-feu sur les lignes actuelles',d:'Arrêter l’hémorragie, au prix de territoires perdus.',l:-4,fx:{e:-6,c:4,s:-12,k:4}}],
  note:'Le Golan reçoit la priorité. Le 10 octobre, les Syriens sont repoussés jusqu’à la ligne de cessez-le-feu de 1967 ; le 8, la contre-attaque dans le Sinaï a échoué.'},
 {date:'12 octobre 1973',head:'Les munitions',text:'Les stocks de munitions s’épuisent. Moscou ravitaille massivement l’Égypte et la Syrie. Washington hésite encore.',
  opts:[{kd:'neutre',t:'Demander à Washington un pont aérien d’urgence',d:'Convaincre Nixon et Kissinger que le temps presse.',l:5,fx:{e:2,c:0,s:4,k:-2},h:1},
        {kd:'ferme',t:'Pousser vers Damas pour forcer la Syrie à céder',d:'Une victoire décisive au Nord avant de manquer de tout.',l:-4,fx:{e:10,c:-4,s:4,k:-8}},
        {kd:'concession',t:'Accepter un cessez-le-feu sur place',d:'Préserver ce qui reste des stocks.',l:-2,fx:{e:-6,c:2,s:-8,k:4}},
        {kd:'neutre',t:'Rappeler à Washington que vous n’avez pas frappé les premiers',d:'Votre retenue du 6 octobre pèse dans la balance.',l:5,fx:{e:0,c:4,s:4,k:0},req:'retenue',xn:'Golda Meir a bien fait valoir auprès de Washington qu’Israël s’était abstenu de frapper le premier ; le pont aérien américain a suivi.'}],
  note:'Le pont aérien américain, l’opération Nickel Grass, commence le 14 octobre. Au Nord, les forces israéliennes avancent jusqu’à portée d’artillerie de Damas.'},
 {date:'15 octobre 1973',head:'Le canal',text:'La veille, la grande offensive blindée égyptienne a été repoussée. Le général Ariel Sharon propose de franchir le canal de Suez par une brèche entre deux armées égyptiennes.',
  opts:[{kd:'ferme',t:'Franchir le canal et encercler la IIIe armée',d:'Retourner la guerre en quelques jours.',l:3,fx:{e:10,c:-4,s:10,k:-8},h:1},
        {kd:'neutre',t:'Tenir sur la défensive',d:'Laisser la diplomatie prendre le relais.',l:-1,fx:{e:-4,c:0,s:-4,k:0}},
        {kd:'ouverture',t:'Proposer un cessez-le-feu en position de force',d:'Négocier maintenant, sans risquer plus de vies.',l:4,fx:{e:-8,c:2,s:-2,k:8}}],
  note:'Dans la nuit du 15 au 16 octobre, des parachutistes et des blindés traversent le canal près du lac Amer. En une semaine, la IIIe armée égyptienne est encerclée.'},
 {date:'24 octobre 1973',head:'L’armée encerclée',text:'Le cessez-le-feu de l’ONU est violé des deux côtés. La IIIe armée égyptienne est prise au piège, sans eau ni vivres. Washington vous demande de la laisser ravitailler.',
  opts:[{kd:'concession',t:'Accepter le ravitaillement sous pression américaine',d:'Ne pas humilier l’Égypte au point de rendre la paix impossible.',l:6,fx:{e:-10,c:6,s:-6,k:8},h:1},
        {cap:0,kd:'ferme',t:'Achever l’encerclement malgré l’ONU',d:'Une victoire totale, quoi qu’en dise Moscou.',l:-8,fx:{e:20,c:-10,s:6,k:-15}},
        {kd:'ouverture',t:'Échanger le ravitaillement contre la libération des prisonniers',d:'Obtenir le retour des soldats israéliens captifs.',l:6,fx:{e:-8,c:4,s:4,k:4}}],
  note:'Israël accepte le passage d’un convoi. Des généraux égyptiens et israéliens se rencontrent au « kilomètre 101 » : c’est la première négociation directe. Les prisonniers sont échangés en novembre.'}
 ],
 epi:['1978. Israël a gagné la guerre mais perdu la paix : aucun voisin ne négocie, et une nouvelle guerre se prépare.','1978. Les accords de désengagement tiennent, mais la société israélienne reste traumatisée et divisée.','1979. Le traité de paix israélo-égyptien est signé à Washington : le Sinaï sera restitué, et l’Égypte reconnaît Israël.'],
 neg:{t:4,who:'Anouar el-Sadate',title:'président de l’Égypte',persona:'Veut sauver sa IIIe armée et l’honneur égyptien, puis récupérer le Sinaï. Ne reconnaîtra pas Israël sans contrepartie majeure. Préfère la médiation américaine à Moscou. Habile, capable de gestes spectaculaires si son prestige est préservé.'},
 real:'Une victoire militaire au prix d’un traumatisme : près de 2 700 soldats israéliens tués. La commission Agranat met en cause la « conception » du renseignement, persuadé que l’Égypte n’attaquerait pas. Golda Meir démissionne en avril 1974. Leçon : la certitude d’être invulnérable est la faille la plus dangereuse du renseignement.'},
{id:'kippour-eg',grp:'kippour',camp:'Égypte',title:'Kippour, octobre 1973',role:'Vous êtes le président de l’Égypte, Anouar el-Sadate.',hist:true,start:{e:55,c:45,s:45,k:15},
 pitch:'Six ans après la défaite de 1967, une guerre limitée pour débloquer la diplomatie.',
 turns:[
 {date:'6 octobre 1973',head:'Opération Badr',text:'À 14 heures, vos troupes s’élancent sur le canal de Suez. Des canons à eau ouvrent des brèches dans les remparts de sable de la ligne Bar-Lev. Jusqu’où aller ?',
  opts:[{kd:'ferme',t:'Traverser et rester sous le parapluie antiaérien',d:'Un objectif limité, protégé par les missiles.',l:6,fx:{e:12,c:0,s:12,k:-6},h:1,f:'limite'},
        {kd:'ferme',t:'Foncer d’emblée vers les cols du Sinaï',d:'Exploiter la surprise au maximum.',l:-4,fx:{e:15,c:-6,s:6,k:-8}},
        {kd:'concession',t:'Renoncer à l’attaque au dernier moment',d:'Miser sur la seule diplomatie.',l:-2,fx:{e:-8,c:0,s:-12,k:4}}],
  note:'La traversée est un succès. Sadate ne veut pas reconquérir tout le Sinaï : il veut une guerre limitée qui force Israël et les États-Unis à négocier.'},
 {date:'13 octobre 1973',head:'L’appel de Damas',text:'Sur le Golan, la Syrie recule. Le président Hafez el-Assad vous presse de lancer une offensive pour soulager son front. Vos généraux savent qu’au-delà des missiles, vos chars seront exposés à l’aviation israélienne.',
  opts:[{kd:'ferme',t:'Lancer l’offensive vers les cols',d:'Tenir parole envers l’allié syrien.',l:-5,fx:{e:10,c:-8,s:2,k:-4},h:1},
        {kd:'neutre',t:'Rester sur la ligne conquise',d:'Ne pas sacrifier vos gains.',l:3,fx:{e:0,c:2,s:-4,k:0}},
        {kd:'ouverture',t:'Accepter un cessez-le-feu sur place',d:'Empocher la victoire tant qu’elle existe.',l:6,fx:{e:-8,c:4,s:4,k:6}},
        {kd:'neutre',t:'Dire franchement à Assad que votre guerre est limitée',d:'Votre stratégie prudente du 6 octobre vous permet d’assumer.',l:5,fx:{e:-2,c:4,s:-2,k:2},req:'limite',xn:'Uchronie : Sadate avait caché à Assad le caractère limité de ses objectifs. Ce manque de franchise a nourri une rancune durable entre Le Caire et Damas.'}],
  note:'Le 13 octobre, Sadate refuse un cessez-le-feu sur place. Le 14, l’offensive lancée hors du parapluie antiaérien tourne au désastre : l’Égypte perd une grande partie de ses blindés engagés.'},
 {date:'17 octobre 1973',head:'La brèche',text:'Des forces israéliennes ont franchi le canal derrière vos lignes. Votre chef d’état-major, le général Saad el-Shazly, veut ramener des troupes de la rive est pour écraser la tête de pont.',
  opts:[{kd:'neutre',t:'Refuser tout retrait de la rive est',d:'Ne rien rendre de ce qui a été conquis.',l:-2,fx:{e:4,c:-4,s:6,k:0},h:1},
        {kd:'neutre',t:'Retirer des forces pour écraser la tête de pont',d:'Suivre l’avis de Shazly.',l:-1,fx:{e:6,c:0,s:-6,k:0}},
        {kd:'ouverture',t:'Demander à Moscou d’obtenir un cessez-le-feu',d:'Arrêter la guerre avant l’encerclement.',l:3,fx:{e:-8,c:4,s:-4,k:4}}],
  note:'Sadate refuse le retrait. Le Premier ministre soviétique Alexis Kossyguine, présent au Caire du 16 au 19 octobre, le presse d’accepter un cessez-le-feu. Shazly sera écarté en décembre.'},
 {date:'24 octobre 1973',head:'La IIIe armée',text:'Malgré le cessez-le-feu de l’ONU, votre IIIe armée est encerclée sur la rive est, sans eau ni vivres.',
  opts:[{kd:'neutre',t:'Demander à Moscou et Washington d’envoyer des troupes',d:'Que les deux Grands fassent respecter le cessez-le-feu.',l:-2,fx:{e:12,c:2,s:2,k:2},h:1},
        {kd:'ouverture',t:'Négocier directement avec Israël',d:'Une rencontre militaire pour sauver vos soldats.',l:6,fx:{e:-10,c:6,s:-6,k:10}},
        {cap:1,kd:'ferme',t:'Ordonner à la IIIe armée de percer à tout prix',d:'Plutôt mourir que se rendre.',l:-6,fx:{e:10,c:-12,s:4,k:-8}}],
  note:'Sadate appelle à une force conjointe américano-soviétique. Brejnev menace d’intervenir seul ; Washington passe en alerte DEFCON 3, puis obtient d’Israël le ravitaillement de la IIIe armée.'},
 {date:'Novembre 1973',head:'Le choix de Washington',text:'Les armes se taisent. Moscou vous a armé, mais seul Washington peut obtenir d’Israël la restitution du Sinaï.',
  opts:[{kd:'ouverture',t:'Miser sur Kissinger plutôt que sur Moscou',d:'Basculer vers la médiation américaine.',l:8,fx:{e:-12,c:4,s:2,k:10},h:1},
        {kd:'neutre',t:'Rester aligné sur Moscou et exiger le retour aux lignes du 22 octobre',d:'Obtenir réparation par l’ONU.',l:-3,fx:{e:4,c:0,s:2,k:-4}},
        {cap:0,kd:'ferme',t:'Préparer une nouvelle guerre',d:'Effacer l’encerclement par une revanche.',l:-8,fx:{e:12,c:-4,s:4,k:-10}}],
  note:'Des généraux égyptiens et israéliens négocient au « kilomètre 101 ». Sadate se rapproche de Washington : accord de désengagement en janvier 1974, réouverture du canal en juin 1975.'}
 ],
 epi:['1978. L’Égypte est épuisée, toujours privée du Sinaï, et dépend entièrement de Moscou.','1978. L’honneur est restauré et le canal rouvert, mais le Sinaï reste en partie occupé.','1979. Le traité de paix est signé : l’Égypte récupérera tout le Sinaï, restitué en 1982. Sadate le paiera de sa vie en 1981.'],
 neg:{t:4,who:'Henry Kissinger',title:'secrétaire d’État américain',persona:'Veut évincer l’influence soviétique d’Égypte et garder Israël fort, sans humilier l’Égypte. Croit aux accords pas à pas, refuse les règlements globaux immédiats. Exige des gestes concrets ; flatte mais ne promet rien qu’il ne puisse obtenir d’Israël.'},
 real:'Une défaite militaire à la fin, mais une victoire politique : l’Égypte a brisé le mythe de l’invincibilité israélienne et retrouvé son honneur. Sadate peut négocier : Jérusalem en 1977, Camp David en 1978, traité de paix en 1979. Leçon : une guerre aux objectifs politiques limités peut débloquer une diplomatie gelée, au prix de milliers de morts.'},
{id:'archer',grp:'archer',camp:"URSS",title:'Able Archer, 1983',role:'Vous êtes le dirigeant soviétique, Iouri Andropov.',hist:true,start:{e:45,c:55,s:50,k:25},
 pitch:'Cette fois, vous êtes à Moscou. Reagan parle d’« empire du mal », les Pershing arrivent en Europe, et l’OTAN répète une guerre nucléaire. Et si ce n’était pas un exercice ?',
 turns:[
 {date:'1er septembre 1983',head:'Le vol KAL 007',text:'Un Boeing de la Korean Air Lines, égaré au-dessus de l’île de Sakhaline, est abattu par un chasseur soviétique. Les 269 personnes à bord sont tuées. Le monde s’indigne.',
  opts:[{kd:'ferme',t:'Affirmer qu’il s’agissait d’un avion espion',d:'Ne reconnaître aucune faute.',l:-4,fx:{e:8,c:0,s:6,k:-10},h:1},
        {kd:'concession',t:'Reconnaître une tragique erreur et présenter des regrets',d:'Désamorcer l’indignation internationale.',l:4,fx:{e:-6,c:0,s:-8,k:8}},
        {kd:'neutre',t:'Garder le silence',d:'Attendre que l’orage passe.',l:-1,fx:{e:2,c:0,s:0,k:-4}}],
  note:'Moscou nie d’abord, puis admet avoir abattu l’appareil en affirmant qu’il menait une mission d’espionnage. Reagan parle de « massacre ». Le climat est le plus tendu depuis des années.'},
 {date:'26 septembre 1983',head:'L’alerte',text:'Dans la nuit, le système d’alerte par satellite signale le lancement de missiles américains vers l’URSS. Dans ce scénario, l’alerte remonte jusqu’à vous. Vous avez quelques minutes.',
  opts:[{cap:0,kd:'ferme',war:1,t:'Riposter immédiatement, selon la doctrine',d:'Ne pas laisser l’ennemi détruire vos missiles au sol.',l:-20,fx:{e:60,c:-30,s:0,k:-30}},
        {kd:'neutre',t:'Attendre la confirmation des radars au sol',d:'Un satellite peut se tromper.',l:4,fx:{e:-4,c:0,s:0,k:0},h:1},
        {kd:'ferme',t:'Mettre les forces stratégiques en alerte maximale',d:'Se tenir prêt, sans tirer.',l:-4,fx:{e:18,c:0,s:2,k:-10}}],
  note:'En réalité, l’alerte n’est jamais montée jusqu’au Kremlin. L’officier de service, le lieutenant-colonel Stanislav Petrov, l’a jugée fausse : une attaque réelle aurait compté des centaines de missiles, pas cinq. C’était un reflet du soleil sur les nuages.'},
 {date:'Fin octobre 1983',head:'Les signaux',text:'Les États-Unis viennent d’envahir la Grenade. Les premiers Pershing II doivent arriver en Allemagne de l’Ouest. Le KGB signale un grand exercice de l’OTAN en préparation.',
  opts:[{kd:'ferme',t:'Intensifier l’opération RYaN',d:'Ordonner au KGB de traquer tout signe d’attaque surprise.',l:-5,fx:{e:8,c:0,s:2,k:-6},h:1,dr:{e:3},dl:'RYaN : vos espions voient des menaces partout'},
        {kd:'ouverture',t:'Ouvrir un canal discret avec Washington',d:'Demander ce que prépare réellement l’OTAN.',l:6,fx:{e:-8,c:0,s:-4,k:8},f:'canal'},
        {kd:'neutre',t:'Dénoncer publiquement l’escalade américaine',d:'Mobiliser l’opinion mondiale contre Reagan.',l:-2,fx:{e:6,c:0,s:4,k:-6}}],
  note:'L’opération RYaN, lancée en 1981, demande aux agents du KGB de surveiller des signes d’attaque imminente : bureaux éclairés la nuit à Londres ou Washington, stocks de sang dans les hôpitaux, mouvements de responsables.'},
 {date:'8 novembre 1983',head:'Able Archer 83',text:'L’OTAN simule une escalade jusqu’à l’emploi de l’arme nucléaire. L’exercice utilise des procédures nouvelles et des messages codés inédits. Vos analystes ne savent plus distinguer l’exercice d’une préparation réelle.',
  opts:[{cap:0,kd:'ferme',t:'Préparer une frappe préventive',d:'Si l’attaque vient, frapper le premier.',l:-15,fx:{e:30,c:-10,s:2,k:-20}},
        {kd:'ferme',t:'Mettre en alerte des unités aériennes nucléaires',d:'En RDA et en Pologne, sans aller plus loin.',l:-2,fx:{e:12,c:0,s:2,k:-6},h:1},
        {kd:'concession',t:'Considérer que c’est un exercice et ne rien faire',d:'Assumer le risque de vous tromper.',l:3,fx:{e:-6,c:0,s:-6,k:4}},
        {kd:'ouverture',t:'Interroger directement Washington par le canal discret',d:'Le contact noué en octobre peut lever le doute.',l:7,fx:{e:-14,c:0,s:-2,k:10},req:'canal',xn:'Uchronie : aucun canal de ce type n’a été activé. C’est un officier américain qui a évité la spirale, en choisissant de ne pas répondre à l’alerte soviétique.'}],
  note:'Des unités aériennes soviétiques à capacité nucléaire sont mises en alerte en RDA et en Pologne. Côté américain, le général Leonard Perroots choisit de ne pas relever le niveau d’alerte en réponse. L’exercice se termine le 11 novembre.'},
