 {date:'23 novembre 1983',head:'Les Pershing arrivent',text:'Les premiers missiles Pershing II sont déployés en Allemagne de l’Ouest. Ils peuvent atteindre Moscou en une dizaine de minutes. Vos négociateurs sont à Genève.',
  opts:[{kd:'neutre',t:'Quitter les négociations de Genève',d:'Ne pas négocier sous la menace.',l:-3,fx:{e:6,c:0,s:4,k:-8},h:1},
        {kd:'ouverture',t:'Rester à la table malgré tout',d:'Garder le dialogue ouvert.',l:5,fx:{e:-6,c:0,s:-6,k:8}},
        {kd:'ouverture',t:'Proposer un moratoire mutuel sur les nouveaux missiles',d:'Prendre l’initiative de la paix.',l:6,fx:{e:-8,c:0,s:-2,k:8}}],
  note:'La délégation soviétique quitte Genève le 23 novembre. À Londres, l’agent double Oleg Gordievsky révèle aux Britanniques l’ampleur de la peur soviétique. Informé, Reagan adoucit son discours le 16 janvier 1984. Andropov meurt en février 1984.'}
 ],
 epi:['1988. La méfiance a tout gelé : ni sommet, ni traité, et chaque fausse alerte peut devenir la dernière.','1988. La peur de 1983 a fini par pousser chaque camp à la retenue, mais le dialogue reste fragile.','1988. Reagan et Gorbatchev ont signé en décembre 1987 le traité sur les forces nucléaires intermédiaires : Pershing et SS-20 sont démantelés.'],neg:{t:3,who:'Ronald Reagan',title:'président des États-Unis',persona:'Croit à la paix par la force, veut déployer les Pershing et ne rien céder sous la pression. En privé, la perspective d’une guerre nucléaire le horrifie. Méfiant envers les dirigeants soviétiques, mais ouvert à un geste concret et vérifiable.'},
 real:'Le monde frôle peut-être la guerre nucléaire sans le savoir ; un rapport américain de 1990, déclassifié en 2015, juge le risque réel. Les historiens débattent encore de sa gravité. Leçon : le danger naît autant de la peur et des malentendus que des intentions réelles. Il faut savoir comment l’adversaire vous perçoit.'},
{id:'dayton',grp:'dayton',camp:'États-Unis',title:'Bosnie, 1995',role:'Vous êtes le négociateur américain Richard Holbrooke.',hist:true,start:{e:50,c:35,s:50,k:25},
 pitch:'Trois ans et demi de guerre, Srebrenica, Sarajevo assiégée. Arracher la paix à trois présidents qui se haïssent.',
 turns:[
 {date:'28 août 1995',head:'Le marché de Markale',text:'Un obus tombe sur un marché de Sarajevo et tue des dizaines de civils. Un mois plus tôt, à Srebrenica, environ 8 000 hommes et garçons bosniaques ont été massacrés. Neuf jours avant, trois membres de votre équipe sont morts sur la route du mont Igman.',
  opts:[{kd:'ferme',t:'Soutenir des frappes aériennes massives de l’OTAN',d:'Briser le siège et changer le rapport de force.',l:6,fx:{e:10,c:8,s:8,k:-6},h:1,f:'otan'},
        {kd:'neutre',t:'Proposer aussitôt une trêve, sans frappes',d:'Éviter d’ajouter la guerre à la guerre.',l:-5,fx:{e:-4,c:-6,s:-6,k:4}},
        {kd:'ferme',t:'Lever l’embargo sur les armes pour les Bosniaques',d:'Les laisser se défendre seuls.',l:-3,fx:{e:12,c:-4,s:4,k:-10},dr:{e:3},dl:'Embargo levé : les armes affluent dans la région'}],
  note:'L’OTAN lance l’opération Deliberate Force du 30 août au 20 septembre : environ 3 500 sorties aériennes contre les positions serbes de Bosnie. Le siège de Sarajevo commence à se desserrer.'},
 {date:'Septembre 1995',head:'L’offensive à l’Ouest',text:'Les forces croates et bosniaques reprennent de vastes territoires dans l’ouest de la Bosnie. Elles marchent vers Banja Luka, la grande ville serbe de Bosnie.',
  opts:[{kd:'neutre',t:'Laisser avancer, mais arrêter avant Banja Luka',d:'Rééquilibrer la carte sans provoquer un exode massif.',l:4,fx:{e:6,c:-8,s:2,k:0},h:1},
        {kd:'neutre',t:'Exiger l’arrêt immédiat de l’offensive',d:'Geler les lignes tout de suite.',l:-2,fx:{e:-6,c:4,s:-4,k:6}},
        {cap:1,kd:'ferme',t:'Encourager la prise de Banja Luka',d:'Écraser militairement les Serbes de Bosnie.',l:-8,fx:{e:15,c:-15,s:2,k:-12},dr:{c:-3},dl:'Chute de Banja Luka : des centaines de milliers de réfugiés'}],
  note:'Holbrooke raconte avoir demandé à Franjo Tuđman de s’arrêter avant Banja Luka, pour éviter des centaines de milliers de réfugiés supplémentaires. La carte se rapproche d’un partage presque égal du territoire.'},
 {date:'Octobre 1995',head:'Le lieu de la paix',text:'Un cessez-le-feu entre en vigueur le 12 octobre. Il faut maintenant réunir Slobodan Milošević, Franjo Tuđman et Alija Izetbegović.',
  opts:[{kd:'ouverture',t:'Les enfermer dans une base militaire américaine',d:'Huis clos, sans presse, jusqu’à l’accord.',l:2,fx:{e:-12,c:0,s:2,k:10},h:1},
        {kd:'neutre',t:'Organiser une grande conférence publique à Genève',d:'Associer l’Europe et l’ONU, sous l’œil des caméras.',l:-1,fx:{e:-4,c:0,s:0,k:2}},
        {kd:'neutre',t:'Négocier capitale par capitale',d:'Éviter de réunir des ennemis dans la même pièce.',l:0,fx:{e:-2,c:0,s:-2,k:4}}],
  note:'Les délégations sont réunies à partir du 1er novembre sur la base aérienne de Wright-Patterson, près de Dayton (Ohio). Isolement total : personne ne repart avant la fin.'},
 {date:'20 novembre 1995',head:'Le blocage',text:'Après trois semaines, tout bloque sur la carte, notamment sur la ville de Brčko, verrou du corridor serbe. Les délégations menacent de rentrer chez elles.',
  opts:[{kd:'neutre',t:'Annoncer la fermeture de la conférence',d:'Le dernier coup de bluff : demain, tout le monde rentre.',l:4,fx:{e:4,c:0,s:2,k:6},h:1},
        {cap:1,kd:'concession',t:'Céder une partie de Sarajevo aux Serbes',d:'Acheter l’accord au prix de la capitale.',l:-8,fx:{e:-6,c:-8,s:-10,k:4}},
        {kd:'neutre',t:'Prolonger les discussions sans limite',d:'Ne rien brusquer.',l:-3,fx:{e:2,c:0,s:-4,k:-2}},
        {kd:'neutre',t:'Rappeler à Milošević que les frappes peuvent reprendre',d:'La crédibilité de septembre pèse encore.',l:4,fx:{e:2,c:0,s:4,k:8},req:'otan',xn:'Les frappes de septembre ont donné à Holbrooke un levier qu’il a utilisé tout au long de la négociation : Milošević savait que l’OTAN pouvait recommencer.'}],
  note:'Le secrétaire d’État Warren Christopher et Holbrooke annoncent la fin de la conférence. Le lendemain, l’accord est conclu ; le sort de Brčko est renvoyé à un arbitrage. Les accords sont paraphés le 21 novembre.'},
 {date:'Décembre 1995',head:'Faire tenir la paix',text:'L’accord est signé. Mais sur le terrain, qui garantira que les armes se taisent ?',
  opts:[{kd:'neutre',t:'Déployer 60 000 soldats de l’OTAN au mandat robuste',d:'Une force capable de se faire respecter.',l:4,fx:{e:-15,c:12,s:-2,k:8},h:1},
        {kd:'neutre',t:'Confier la paix aux Casques bleus de l’ONU',d:'Reconduire le dispositif existant.',l:-5,fx:{e:4,c:-6,s:2,k:0}},
        {cap:0,kd:'ferme',t:'Laisser les parties appliquer l’accord seules',d:'Faire confiance à leur signature.',l:-8,fx:{e:10,c:-10,s:4,k:-6}}],
  note:'Les accords sont signés à Paris le 14 décembre 1995. L’IFOR, force de l’OTAN de 60 000 soldats dont 20 000 Américains, remplace les Casques bleus. La constitution issue de Dayton divise la Bosnie en deux entités ; elle est toujours en vigueur.'}
 ],
 epi:['2000. La guerre a repris par intermittence. Les réfugiés ne sont pas rentrés, et les criminels de guerre restent libres.','2000. Les armes se sont tues, mais la Bosnie reste divisée et sous tutelle internationale. La réconciliation n’a pas commencé.','2000. La paix tient, les premiers réfugiés rentrent, et le tribunal pénal international juge les crimes commis. Le chemin reste long.'],neg:{t:3,who:'Slobodan Milošević',title:'président de la Serbie',persona:'Veut la levée des sanctions contre la Serbie et la préservation d’une entité serbe en Bosnie. Pragmatique et cynique, se pose en faiseur de paix, négocie volontiers au nom des Serbes de Bosnie. Cède sur un point s’il obtient un avantage ailleurs.'},
 real:'La guerre, qui a fait environ 100 000 morts et plus de deux millions de déplacés, s’arrête. Le prix : une Bosnie découpée selon des lignes ethniques, un État complexe et souvent bloqué. Leçon : la diplomatie appuyée par la force peut arrêter une guerre ; elle ne fabrique pas la réconciliation.'},
{id:'orion',grp:'orion',camp:'Aster',title:'Le détroit d’Orion',role:'Vous présidez le conseil de crise de la République d’Aster, État imaginaire.',hist:false,start:{e:35,c:45,s:50,k:35},
 pitch:'Deux États inventés, un détroit vital et une tempête qui affame les îles. Ici, rien n’est écrit.',
 turns:[
 {date:'Jour 1',head:'Le détroit fermé',text:'La Fédération de Boréa ferme le détroit d’Orion aux cargos d’Aster, invoquant une « inspection de sécurité ». Le blé importé n’arrive plus dans les îles.',
  opts:[{kd:'ferme',t:'Envoyer la flotte escorter les cargos',d:'Forcer le passage.',l:-5,fx:{e:20,c:5,s:10,k:-15}},
        {kd:'neutre',t:'Demander une réunion bilatérale d’urgence',d:'Comprendre ce que veut Boréa.',l:3,fx:{e:-5,c:0,s:-2,k:8}},
        {kd:'neutre',t:'Saisir la Ligue des Îles, organisation neutre',d:'Internationaliser le différend.',l:4,fx:{e:-3,c:2,s:2,k:3},f:'ligue'}],
  note:'Concept réel : la liberté de navigation dans les détroits internationaux, protégée par le droit de la mer (convention de Montego Bay, 1982).'},
 {date:'Jour 4',head:'La tempête',text:'Un cyclone ravage l’archipel. Les stocks de nourriture tiennent dix jours. Des manifestations éclatent dans les ports.',
  opts:[{kd:'ouverture',t:'Ouvrir un corridor humanitaire sous observation neutre',d:'Faire passer les secours, quelles que soient les tensions.',l:6,fx:{e:-8,c:15,s:4,k:6}},
        {kd:'ferme',t:'Rationner et accuser Boréa',d:'Souder la population contre l’adversaire.',l:-6,fx:{e:10,c:-10,s:8,k:-10},dr:{c:-3},dl:'Rationnement : la faim gagne les îles'},
        {kd:'neutre',t:'Acheter du blé ailleurs à prix fort',d:'Contourner le détroit, au prix d’une dette.',l:1,fx:{e:0,c:8,s:-6,k:0}}],
  note:'Concept réel : le corridor humanitaire, passage sécurisé négocié pour acheminer l’aide ou évacuer des civils en temps de crise.'},
 {date:'Jour 7',head:'L’incident',text:'Une frégate boréenne et un chalutier d’Aster entrent en collision de nuit. Deux pêcheurs sont portés disparus. Les réseaux sociaux s’enflamment.',
  opts:[{cap:1,kd:'ferme',t:'Riposter contre la frégate',d:'Montrer que le sang versé a un prix.',l:-8,fx:{e:25,c:-8,s:10,k:-20},dr:{e:4},dl:'Riposte navale : les deux flottes en état d’alerte'},
        {kd:'ouverture',t:'Proposer une enquête conjointe',d:'Établir les faits avant de juger.',l:6,fx:{e:-10,c:0,s:-4,k:12}},
        {kd:'ferme',t:'Exiger des excuses publiques sous 24 heures',d:'Fermeté, sans tirer.',l:-1,fx:{e:8,c:0,s:6,k:-6}}],
  note:'Concept réel : le dilemme de sécurité. Chaque camp, en se protégeant, inquiète l’autre, qui se protège à son tour ; l’escalade naît souvent d’un incident mal interprété.'},
 {date:'Jour 10',head:'La médiation',text:'La Ligue des Îles propose un sommet sur un navire neutre. Boréa accepte, mais exige d’abord le retrait de votre flotte du détroit.',
  opts:[{kd:'ferme',t:'Refuser tout préalable',d:'Ne rien céder avant la table.',l:-4,fx:{e:10,c:0,s:6,k:-10}},
        {kd:'ouverture',t:'Retirer la flotte en échange de la réouverture partielle',d:'Un geste contre un geste.',l:6,fx:{e:-12,c:5,s:-4,k:12}},
        {kd:'concession',t:'Accepter sans contrepartie',d:'Prouver sa bonne foi.',l:-2,fx:{e:-10,c:0,s:-12,k:15}},
        {kd:'ouverture',t:'Demander à la Ligue des Îles de garantir le sommet',d:'Saisie dès le premier jour, la Ligue peut parler aux deux camps.',l:4,fx:{e:-14,c:4,s:2,k:12},req:'ligue',xn:'Concept réel : une médiation précoce par un tiers accepté par tous augmente nettement les chances d’accord.'}],
  note:'Concept réel : les mesures de confiance, petits gestes réciproques et vérifiables qui rendent possible une négociation plus large.'},
 {date:'Jour 14',head:'L’accord',text:'Les délégations sont à table. Il reste à choisir l’architecture de l’accord.',
  opts:[{kd:'ouverture',t:'Gestion conjointe du détroit avec observateurs',d:'Partager la souveraineté et la surveillance.',l:8,fx:{e:-15,c:8,s:-2,k:15}},
        {kd:'ouverture',t:'Accord minimal de libre passage',d:'Régler l’urgence, reporter le fond.',l:2,fx:{e:-6,c:5,s:4,k:4}},
        {cap:1,kd:'neutre',t:'Partition du détroit en deux zones',d:'Chacun chez soi, sous haute surveillance.',l:-4,fx:{e:2,c:0,s:8,k:-6}}],
  note:'Concept réel : un accord durable combine des intérêts réciproques, un mécanisme de vérification et un arbitre accepté par les deux parties.'}
 ],
 epi:['An 5. Le détroit reste fermé une saison sur deux. Les îles d’Aster s’appauvrissent, et une nouvelle collision pourrait tout embraser.','An 5. Le libre passage tient, mais la question du détroit n’est pas réglée. Chaque élection ravive le nationalisme.','An 5. La gestion conjointe du détroit fonctionne. Aster et Boréa commercent à nouveau, et la Ligue des Îles cite l’accord en exemple.'],neg:{t:3,who:'la présidente Ilsa Varn',title:'présidente de la Fédération de Boréa',persona:'Veut contrôler les revenus du détroit et ne pas paraître faible devant ses nationalistes, à l’approche d’élections. Ne veut pas la guerre. Accepte un compromis s’il lui permet de revendiquer une victoire.'},
 real:'Ce scénario est fictif : il n’y a pas d’issue historique. Comparez votre trajectoire avec celle de Cuba 1962 et de Juillet 1914.'}
];

function start(id){const sc=SCEN.find(x=>x.id===id);S={v:SAVE_V,gid:Date.now()+Math.random(),id,mode:MODE,t:0,g:{...sc.start},log:[],picked:null,last:null,over:null,flags:[],drifts:[],driftMsg:null,neg:null,negDraft:'',negBusy:false,negErr:null,brief:true,cp:2,acts:{},intel:null,profKnown:false,conc:0,firm:0,weak:0,spiral:0,notes:{}};AI.lines=null;saveGame();render();window.scrollTo({top:0})}
function saveGame(){try{if(S&&!S.done)localStorage.setItem('guerreia-save',JSON.stringify({...S,negBusy:false}));else localStorage.removeItem('guerreia-save')}catch{}}
function loadGame(){try{const g=JSON.parse(localStorage.getItem('guerreia-save'));const s=g&&SCEN.find(x=>x.id===g.id);
  const ok=s&&g.v===SAVE_V&&Number.isInteger(g.t)&&g.t>=0&&g.t<s.turns.length&&g.g&&['e','c','s','k'].every(k=>Number.isFinite(g.g[k]))&&Array.isArray(g.log)&&Array.isArray(g.flags)&&Array.isArray(g.drifts)&&MODES[g.mode]&&(g.picked===null||Number.isInteger(g.picked))&&Number.isFinite(g.cp)&&g.acts&&typeof g.acts==='object';
  if(!ok){localStorage.removeItem('guerreia-save');return null}return g}catch{try{localStorage.removeItem('guerreia-save')}catch{}return null}}
function sc(){return SCEN.find(x=>x.id===S.id)}

function choose(i){
  if(S.picked!==null||negBlocking())return;
  const turn=sc().turns[S.t],o=turn.opts[i],M=MODES[S.mode],fx={};
  for(const k in o.fx)fx[k]=Math.round(o.fx[k]*M.mul);
  const pa=profileAdjust(o,fx);
  let fog=null;
  if(Math.random()<M.fog){const pool=(CEV[sc().grp||S.id]&&Math.random()<.75)?CEV[sc().grp||S.id]:FOG;fog=pool[Math.floor(Math.random()*pool.length)];for(const k in fog[1])fx[k]=(fx[k]||0)+fog[1][k]}
  const before={...S.g};for(const k in fx)S.g[k]=clamp(S.g[k]+fx[k]);
  const kd=kind(o);let smsg=null,sl=0;
  if(kd==='concession'||(kd==='ouverture'&&PROFILE[S.id]==='opportuniste')){S.conc=(S.conc||0)+1;S.firm=0}else if(kd==='ferme'){S.firm=(S.firm||0)+1;S.conc=0}else{S.conc=0;S.firm=0}
  const thr=PROFILE[S.id]==='prudent'?4:3;
  if(S.conc>=thr&&!S.weak){S.weak=1;S.drifts.push({l:'Faiblesse perçue : l’adversaire pousse son avantage',dr:{e:4,k:-2}});sl=-3;smsg=(thr===4?'Quatre':'Trois')+(PROFILE[S.id]==='opportuniste'?' gestes conciliants de suite : face à un opportuniste, même une ouverture passe pour de la faiblesse ; il pousse son avantage.':' concessions de suite : l’adversaire vous juge faible et pousse son avantage.')}
  if(S.firm>=3&&!S.spiral){S.spiral=1;S.drifts.push({l:'Spirale de la fermeté : chaque camp surenchérit',dr:{e:4}});sl=-2;smsg='Trois coups de force de suite : la spirale de l’escalade s’enclenche.'}
  const iw=S.intel&&S.intel.t===S.t&&S.intel.wrong>=0&&S.mode!=='conseiller'?S.intel.wrong:-1;
  const vk=voixKey(fx,o.war||S.g.e>=100);S.picked=i;S.last={vk,fx,fog:fog?fog[0]:null,before,pmsg:pa.msg,smsg,iw,iwT:iw>=0?turn.opts[iw].t:null,iwCode:S.intel&&S.intel.code};
  if(o.f&&!S.flags.includes(o.f))S.flags.push(o.f);
  if(o.dr)S.drifts.push({l:o.dl,dr:o.dr});
  S.log.push({t:S.t,vk,date:turn.date,head:turn.head,choice:o.t,h:!!o.h,l:(o.l||0)+pa.dl+sl,cap:o.cap??2,histChoice:(turn.opts.find(x=>x.h)||{}).t});
  AI.lines=null;
  if(o.war||S.g.e>=100)S.over='war';else if(S.g.s<=0)S.over='fall';
  render();setTimeout(()=>{const n=document.querySelector('.outcome')||$('#nextBtn');if(n){n.tabIndex=-1;n.focus({preventScroll:true});n.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}},30);
}
function next(){

  S.t++;S.picked=null;S.last=null;AI.lines=null;S.driftMsg=null;S.cp=Math.min(4,(S.cp||0)+1);S.acts={};S.intel=null;
  if(S.drifts.length){const tot={};S.drifts.forEach(d=>{for(const k in d.dr){tot[k]=(tot[k]||0)+d.dr[k];S.g[k]=clamp(S.g[k]+d.dr[k])}});S.driftMsg=tot;
    if(S.g.e>=100){S.over='war';return finish()}if(S.g.s<=0){S.over='fall';return finish()}}

}
function longTerm(){const raw=clamp(50+S.log.reduce((a,l)=>a+(l.l||0),0)),cap=Math.min(2,...S.log.map((l,i)=>(l.cap===1&&S.log.slice(i+1).some(x=>!x.neg&&(x.l||0)>=5))?2:(l.cap??2)));return cap===0?Math.min(raw,39):cap===1?Math.min(raw,64):raw}
function parts(){const g=S.g;return{imm:S.over==='war'?0:Math.round(((100-g.e)+g.k+g.s)/3),dur:longTerm(),civ:g.c}}

const NEGFX={accepte:{e:-6,k:6,s:1},contre:{},refuse:{e:4,k:-4},rejet:{e:6,k:-6,s:-3}};

function levers(id,txt){const t=txt.toLowerCase(),L=LEV[id]||[];return L.map((x,i)=>({i,sign:x[1],note:x[2],hit:new RegExp(x[0]).test(t)}))}

    return `<div class="gauge ${k==='e'?'danger':''}"><div class="row"><span>${G[k]}</span><strong>${zone(v)}</strong></div><div class="bar"><i style="width:${hi}%;opacity:.35;margin-left:0${k==='e'?'':';background:var(--muted)'}"></i></div><small>Estimation entre ${lo} et ${hi}</small></div>`}).join('');
  return Object.keys(G).filter(k=>k!=='e').map(k=>{const v=S.g[k],d=S.last?S.last.fx[k]||0:0;
    return `<div class="gauge ${k==='e'?'danger':''}"><div class="row"><span>${G[k]}</span><strong>${v}${d?` <small class="${(k==='e'?-d:d)>0?'up':'down'}">${d>0?'+':''}${d}</small>`:''}</strong></div><div class="bar"><i style="width:${v}%${k==='e'?'':';background:'+(v<30?'var(--alarm)':v<55?'var(--brass)':'var(--calm)')}"></i></div>${k==='e'?'<small>À 100, la guerre éclate.</small>':k==='s'?'<small>À 0, vous êtes renversé.</small>':''}</div>`}).join('');
}

function dialHTML(){
  const v=S.g.e,fog=S.mode==='brouillard',a=(-90+v*1.8)*Math.PI/180,cx=110,cy=104,r=82;
  const lab=v<25?'Calme':v<45?'Tension':v<65?'Crise':v<85?'Alerte':'Bord du gouffre';
  const arc=(f,t,c)=>{const p=x=>{const an=(-90+x*1.8)*Math.PI/180;return[cx+r*Math.sin(an),cy-r*Math.cos(an)]};const[a1,b1]=p(f),[a2,b2]=p(t);return `<path d="M${a1.toFixed(1)} ${b1.toFixed(1)} A${r} ${r} 0 0 1 ${a2.toFixed(1)} ${b2.toFixed(1)}" stroke="${c}" stroke-width="12" fill="none"/>`};
  const nx=cx+(r-14)*Math.sin(a),ny=cy-(r-14)*Math.cos(a);
  return `<div class="dial" role="img" aria-label="Escalade : ${fog?lab:v+' sur 100, '+lab}"><svg viewBox="0 0 220 114">${arc(0,25,'var(--calm)')}${arc(25,45,'#8fae6a')}${arc(45,65,'var(--brass)')}${arc(65,85,'#d9823f')}${arc(85,100,'var(--alarm)')}
    ${fog?`<path d="M${cx} ${cy} L${(cx+(r+6)*Math.sin(a-0.21)).toFixed(1)} ${(cy-(r+6)*Math.cos(a-0.21)).toFixed(1)} A${r+6} ${r+6} 0 0 1 ${(cx+(r+6)*Math.sin(a+0.21)).toFixed(1)} ${(cy-(r+6)*Math.cos(a+0.21)).toFixed(1)} Z" fill="var(--ink)" opacity=".18"/>`:`<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`}
    <circle cx="${cx}" cy="${cy}" r="6" fill="var(--ink)"/></svg>
    <div class="dialtxt"><span class="kicker">Escalade</span><strong class="${v>=65?'down':''}">${fog?lab:v}</strong><span>${fog?'estimation':lab}</span></div></div>`;
}
function rulesPage(){$('#homeBtn').hidden=true;
  const sec=(n,t,b)=>`<section class="rsec"><div class="rnum">${n}</div><div><h2>${t}</h2>${b}</div></section>`;
  $('#app').innerHTML=`<article class="rules-page">
  <header class="rhead"><div class="kicker">Manuel du joueur</div><h1>Règles du jeu</h1><p>GUERRE IA vous place aux commandes lors des grandes crises du XXe siècle. Vous avez cinq décisions. Le but n’est pas seulement d’éviter la guerre : c’est de laisser derrière vous une paix qui tienne.</p></header>
  ${sec('01','Le but',`<p>Chaque crise vous donne un rôle, un adversaire et un objectif formulé comme un dilemme. Vous gagnez si la crise se dénoue sans guerre <em>et</em> si vos choix tiennent dans la durée. On peut perdre en ayant évité la guerre, et gagner en ayant pris des risques.</p>`)}
  ${sec('02','Choisir une crise et un camp',`<p>Huit crises, de 1914 à 1995, et un monde fictif, soit 24 rôles. Chaque crise se joue dans plusieurs camps : Juillet 1914 (Allemagne, Russie ou Royaume-Uni), Munich (France ou Tchécoslovaquie), Berlin (États-Unis, URSS ou Berlin-Ouest), Suez (France, Égypte ou États-Unis), Cuba (États-Unis, URSS ou Cuba), Kippour (États-Unis, URSS, Israël ou Égypte), Able Archer (URSS ou États-Unis), la Bosnie (États-Unis ou Bosnie) et Orion (Aster ou Boréa). Un dossier de crise présente la situation avant la première dépêche.</p>`)}
  ${sec('03','Le déroulé d’un tour',`<ol><li><b>Lire la dépêche</b> : la situation à ce moment précis.</li><li><b>Agir au cabinet</b>, si vous le souhaitez : renseignement, canal discret, discours.</li><li><b>Négocier</b>, une fois par crise, au tour indiqué dans le dossier.</li><li><b>Décider</b> parmi trois ou quatre options.</li><li><b>Découvrir les conséquences</b> : effets sur les jauges, réaction de l’adversaire, imprévu éventuel et ce qui s’est réellement passé.</li></ol>`)}
  ${sec('04','Les instruments',`<dl class="rdl"><div><dt>Escalade</dt><dd>Le risque de guerre, de « Calme » à « Bord du gouffre ». <b>À 100, la guerre éclate</b> et la partie s’arrête.</dd></div><div><dt>Civils</dt><dd>La protection des populations, des deux côtés.</dd></div><div><dt>Soutien intérieur</dt><dd>Votre marge de manœuvre politique. <b>À 0, vous êtes renversé.</b></dd></div><div><dt>Confiance adverse</dt><dd>La possibilité de négocier avec l’autre camp.</dd></div></dl>`)}
  ${sec('05','Le cabinet',`<p>Vous disposez de <b>capital politique</b> : 2 points au départ, 1 de plus à chaque tour, 4 au maximum. Chaque action coûte 1 point et ne peut servir qu’une fois par tour.</p><dl class="rdl"><div><dt>Renseignement</dt><dd>Révèle le profil de l’adversaire et l’effet probable de chaque option sur l’escalade. Le rapport a une fiabilité : A en mode Conseiller, B en Chef d’État, C en Brouillard total. Un rapport peut se tromper.</dd></div><div><dt>Canal discret</dt><dd>Améliore la confiance et baisse l’escalade, avec un risque de fuite qui coûte du soutien.</dd></div><div><dt>Discours à la nation</dt><dd>Fait monter votre soutien, mais l’adversaire se raidit.</dd></div></dl>`)}
  ${sec('06','Le profil de l’adversaire',`<p>Chaque adversaire a un profil caché qui modifie l’effet réel de vos choix.</p><dl class="rdl"><div><dt>Opportuniste</dt><dd>Empoche les concessions sans contrepartie, ce qui abîme l’avenir. La fermeté le fait hésiter.</dd></div><div><dt>Prudent</dt><dd>Redoute l’escalade. Les gestes d’ouverture portent davantage.</dd></div><div><dt>Orgueilleux</dt><dd>Surenchérit face à la fermeté publique. Il faut lui laisser sauver la face.</dd></div></dl>`)}
  ${sec('07','Le canal direct',`<p>Une fois par crise, vous écrivez vous-même au dirigeant adverse. L’IA lui répond en personnage : il accepte, fait une contre-proposition, refuse ou rejette sèchement. Les effets sont fixés par le jeu, pas par l’IA. Un accord qui règle le cœur de la crise compte double. Une contre-proposition ne rapporte rien tant que vous ne l’avez pas acceptée.</p><p>Chaque dirigeant a ses <b>leviers</b> et ses <b>pièges</b> : une garantie de non-invasion pour Khrouchtchev, la levée des sanctions pour Milošević ; une concession pour Hitler est un piège. Le bilan révèle la grille complète.</p>`)}
  ${sec('08','Ce qui engage la suite',`<dl class="rdl"><div><dt>Options débloquées</dt><dd>Certains choix ouvrent plus tard une option supplémentaire, encadrée en pointillés. Quand elle n’a jamais existé historiquement, sa fiche le signale comme uchronie.</dd></div><div><dt>Effets durables</dt><dd>Les décisions brutales pèsent à chaque tour suivant, comme une frappe sur Cuba ou le chèque en blanc de 1914.</dd></div><div><dt>Séries</dt><dd>Le jeu distingue les <b>concessions</b> (céder du terrain, au prix de votre soutien), les <b>ouvertures</b> (gestes diplomatiques sans rien céder), la <b>fermeté</b> et les choix neutres. Trois concessions de suite font passer pour faible ; face à un adversaire opportuniste, les ouvertures comptent aussi : l’adversaire pousse son avantage (quatre face à un adversaire prudent). Trois coups de force de suite enclenchent une spirale d’escalade. Les meilleures stratégies alternent.</dd></div><div><dt>Imprévus</dt><dd>Le brouillard de guerre : un incident propre à l’époque peut modifier l’effet de votre décision. Un avion espion égaré, une fuite dans la presse, le brouillard sur Tempelhof.</dd></div></dl>`)}
  ${sec('09','Les trois modes',`<dl class="rdl"><div><dt>Conseiller</dt><dd>L’effet probable sur l’escalade est indiqué avant chaque choix ; peu d’imprévus.</dd></div><div><dt>Chef d’État</dt><dd>Aucune indication ; imprévus fréquents.</dd></div><div><dt>Brouillard total</dt><dd>Jauges approximatives, effets amplifiés de 25 %, imprévus constants, renseignement peu fiable.</dd></div></dl>`)}
  ${sec('10','Le bilan',`<p>Trois notes, jamais affichées pendant la partie : <b>paix immédiate</b> (escalade, confiance et soutien intérieur ; elle tombe à zéro si la guerre éclate), <b>stabilité durable</b> (la valeur à long terme de vos décisions) et <b>protection des civils</b>. Le score global en est la moyenne.</p><p>Certaines décisions sont <b>irréversibles</b> : elles plafonnent l’avenir quoi que vous fassiez ensuite, comme envahir Cuba ou accepter Munich. D’autres erreurs graves peuvent être <b>réparées</b> par une décision forte plus tard.</p><dl class="rdl"><div><dt>Paix durable</dt><dd>La crise est dénouée et l’avenir est solide.</dd></div><div><dt>Fermeté payante</dt><dd>Des choix coûteux sur le moment, que l’avenir justifie.</dd></div><div><dt>Paix fragile</dt><dd>La guerre est évitée, mais la prochaine crise couve.</dd></div><div><dt>Paix illusoire</dt><dd>Le calme immédiat cache la catastrophe.</dd></div><div><dt>Crise ouverte</dt><dd>Pas de guerre, mais rien n’est réglé.</dd></div><div><dt>Vous êtes renversé</dt><dd>Votre soutien s’est effondré.</dd></div><div><dt>La guerre a éclaté</dt><dd>L’escalade a atteint 100.</dd></div></dl><p>Le bilan compare ensuite vos choix à ceux de l’Histoire, cite les décisions qui ont pesé, révèle le profil de l’adversaire et ce que votre personnage ignorait, puis raconte l’épilogue des années plus tard.</p>`)}
  ${sec('11','Pratique',`<dl class="rdl"><div><dt>Clavier</dt><dd>Touches 1 à 4 pour sélectionner, Entrée pour confirmer, puis continuer.</dd></div><div><dt>Sauvegarde</dt><dd>La partie en cours est conservée dans votre navigateur ; l’accueil propose de la reprendre.</dd></div><div><dt>IA</dt><dd>Les réactions préparées et les adversaires à règles fixes fonctionnent sans IA générative. Le conseil génératif et la négociation libre nécessitent une connexion à un service IA ; leur disponibilité est indiquée dans le cabinet.</dd></div></dl>`)}
  ${sec('12','Le mode Duel',`<p>Deux dirigeants d’une même crise s’affrontent, à deux sur le même écran ou contre l’ordinateur. Deux crises disponibles : Cuba 1962, Kennedy contre Khrouchtchev, et Berlin 1948, Truman contre Staline.</p><p>À chaque manche, chacun choisit en secret ; les décisions sont révélées ensemble et se combinent selon une matrice : fermeté contre fermeté, l’escalade bondit ; fermeté contre concession, le ferme gagne la manche ; ouverture contre ouverture, la tension retombe et la confiance monte ; celui qui s’ouvre face à la fermeté paie son geste. L’escalade est commune : à 100, tout le monde perd. La <b>position</b> mesure qui emporte la partie diplomatique.</p><p>L’ordinateur est un adversaire stratégique automatisé, à règles fixes : il joue comme un dirigeant prudent, rend coup pour coup et répond aux ouvertures, avec une part de hasard ; au bord du gouffre, il cherche le plus souvent une sortie. En mode expert, la catégorie des options n’est révélée qu’après le choix, et chaque geste a une chance sur cinq d’être mal perçu par l’adversaire : une ouverture lue comme une temporisation, une temporisation lue comme une menace.</p>`)}
  <div class="actions"><button class="primary" id="rulesBtn2">${S&&!S.done?'Retour à la partie':'Choisir une crise'}</button></div>
  </article>`;}

function campCard(s,best){const m=SCEN.filter(x=>x.grp===s.grp), key=v17theme(s.grp||s.id);

'cuba-cu':['La Havane, nuit. Les camions soviétiques roulent tous feux éteints vers Pinar del Río. Vous savez ce qu’ils transportent.','La Havane, soir. Vous écoutez Kennedy à la radio. L’alerte de combat est déjà décrétée, des centaines de milliers d’hommes rejoignent leurs postes.','Côte nord. Les miliciens creusent des tranchées face à la mer. À l’horizon, les silhouettes grises des destroyers américains.','Ambassade soviétique, nuit du 26 au 27. Vous dictez une lettre à Khrouchtchev : si l’invasion vient, qu’il frappe le premier.','La Havane. Vous apprenez l’accord par la radio. Personne ne vous a consulté. Votre colère, vos proches ne l’oublieront pas.'],
'1914':['Potsdam, chaleur d’été. L’émissaire autrichien Hoyos a apporté la lettre de François-Joseph. Le Kaiser part bientôt en croisière vers la Norvège.','Chancellerie, Wilhelmstrasse, soir. Vienne vient de remettre son ultimatum à Belgrade : quarante-huit heures. Vous en connaissiez presque le texte.','Chancellerie. La réponse serbe accepte presque tout. Votre femme Martha est morte en mai ; depuis, vous dormez à peine.','Chancellerie, nuit. Les télégrammes de Saint-Pétersbourg se succèdent. Au téléphone, Moltke réclame la mobilisation.','Chancellerie. Sous vos fenêtres, la foule chante. Le plan exige d’entrer en Belgique dans quelques heures.'],
'1914-ru':['Peterhof, douceur de l’été. La nouvelle de Sarajevo arrive. Votre fils Alexis, hémophile, vous inquiète davantage que les Balkans.','Saint-Pétersbourg. Sazonov a lu l’ultimatum autrichien en s’écriant : « C’est la guerre européenne ! » Dans les faubourgs, les grévistes tenaient encore des barricades.','Peterhof. Le Kaiser vous télégraphie en signant « Willy ». Vous répondez « Nicky ». Belgrade sera bombardée cette nuit.','Peterhof, après-midi. Sazonov insiste : la mobilisation partielle est techniquement impossible. Vous restez longtemps silencieux.','Peterhof, soir. L’ambassadeur Pourtalès a remis la déclaration de guerre à Sazonov, en pleurant. L’impératrice, qui redoutait cette guerre, vous attend.'],
'1914-uk':['Downing Street. Le Cabinet a passé l’après-midi sur l’Irlande. Puis on vous fait lire l’ultimatum autrichien, et le silence tombe.','Itchen Abbas, Hampshire, dimanche. Votre cottage au bord de la rivière, le seul endroit où vous dormez. Les dépêches vous y rattrapent.','Foreign Office. Belgrade a été bombardée dans la nuit. Vos yeux vous font souffrir ; vous faites lire les télégrammes à voix haute.','Foreign Office. Le Cabinet est divisé, des ministres menacent de démissionner si Londres s’engage. L’ambassadeur Paul Cambon attend dans l’antichambre.','Foreign Office, soir. L’ultimatum à Berlin expire à 23 h, heure de Londres. Dans le parc, on allume les réverbères.'],
munich:['Ministère de la Guerre, rue Saint-Dominique. À la radio, Hitler hurle depuis Nuremberg. Votre interprète traduit à voix basse.','Retour de Londres. Dans l’avion, vous relisez le plan qui livre les Sudètes. Vous n’avez pas dormi.','Paris, nuit. Les premières affiches de rappel des réservistes sont collées sur les murs. Les gares se remplissent d’hommes en civil, une valise à la main.','Paris, après-midi. Dans les squares, on creuse des tranchées, on essaie des masques à gaz. Le téléphone sonne : Mussolini propose une conférence.','Aéroport du Bourget. Par le hublot, vous voyez une foule immense. Vous croyez qu’elle vient vous huer. Elle vous acclame.'],
'munich-cs':['Château de Prague. Vous avez rappelé une classe de réservistes. Dans les Sudètes, les postes frontière sont tenus jour et nuit.','Château de Prague. Vous dites aux chefs sudètes : écrivez vos revendications, je signerai. Ils restent sans voix.','Château de Prague, 2 h du matin. Les ministres de France et de Grande-Bretagne vous font réveiller pour remettre leur ultimatum.','Prague, soir. Mobilisation générale. Les hommes rejoignent les fortifications de la frontière, parmi les plus modernes d’Europe.','Château de Prague, matin. On vous apporte l’accord signé à Munich, sans vous. Dans la rue, des passants pleurent.'],
berlin:['Maison-Blanche. Année électorale, les sondages vous donnent battu. Le général Clay câble depuis Berlin : la ville n’a que quelques semaines de vivres.','Bureau ovale. Les cartes des couloirs aériens couvrent la table. Vos experts vous répètent que nourrir une ville par les airs est impossible.','En pleine campagne présidentielle. Les journaux montrent trois cent mille Berlinois rassemblés devant le Reichstag en ruine.','Bureau ovale. Vous venez d’être réélu contre tous les pronostics. À Berlin, le brouillard cloue les avions au sol des jours entiers.','Maison-Blanche. Les rapports de Tempelhof annoncent un atterrissage par minute, de jour comme de nuit.'],
'berlin-su':['Kremlin, rideaux tirés. On vous apprend que les Occidentaux introduisent un nouveau mark dans leurs zones. Vous travaillez la nuit, comme toujours.','Kremlin, nuit. Trains, péniches et camions vers Berlin-Ouest sont arrêtés. Vos généraux pensent que la ville cédera en quelques semaines.','Datcha de Kountsevo. Les rapports de Berlin comptent les avions américains et britanniques. Personne n’ose vous dire qu’ils sont chaque semaine plus nombreux.','Kremlin. L’hiver devait faire plier Berlin. Les avions continuent, même dans le brouillard.','Kremlin. Lever le blocus, c’est avouer l’échec. Le prolonger, c’est l’avouer plus tard.'],
'berlin-de':['Berlin-Ouest, nuit. Les lumières s’éteignent quartier par quartier : les centrales de l’Est coupent le courant.','Aéroport de Tempelhof. Les avions se posent entre les immeubles en ruine. Des enfants comptent les appareils, assis sur les gravats.','Devant le Reichstag en ruine. Trois cent mille personnes. Le micro grésille, vous savez que le monde écoute.','Berlin-Ouest. On abat les arbres du Tiergarten pour se chauffer. Le courant n’arrive que quelques heures par jour, souvent la nuit.','Minuit et une minute, 12 mai. Les premières voitures franchissent la ligne. Sur l’autoroute, des Berlinois pleurent.'],
suez:['Hôtel Matignon. Nasser a parlé à Alexandrie, la radio retransmet le rire de la foule. Vous pensez à Munich. Vous pensez à l’Algérie.','Matignon. À Londres, les conférences se succèdent, les formules aussi. À Toulon et à Malte, les militaires chargent déjà les navires.','Sèvres, une villa discrète. Ben Gourion est venu en secret. Les Britanniques voudront ensuite qu’on détruise les exemplaires du protocole.','Matignon, petit matin. Les parachutistes sautent sur Port-Saïd. Dans la nuit, Moscou a menacé Paris et Londres de ses fusées.','Matignon. Les troupes rembarquent. Dans les rues de Paris, on fait la queue pour l’essence avec des tickets.'],
'suez-eg':['Alexandrie, place Manshiya. Vous prononcez le nom de Ferdinand de Lesseps : c’est le signal. À Ismaïlia, vos hommes entrent dans les bureaux du canal.','Le Caire. Les pilotes étrangers du canal menacent de partir ; on forme en hâte des pilotes égyptiens. Les navires passent toujours.','Le Caire. Vos services signalent des mouvements israéliens, des navires français à Chypre. Personne ne croit à une entente entre Paris, Londres et Israël.','Le Caire, soir. Des parachutistes israéliens sont largués près du col de Mitla. Vous ne savez pas encore qu’ils ne sont pas seuls.','Le Caire. Port-Saïd brûle. Vous avez fait couler des navires pour bloquer le canal. À Washington, Eisenhower exige le cessez-le-feu.'],
'suez-us':['Maison-Blanche. Vous êtes en campagne pour un second mandat, encore convalescent de votre opération de juin.','Maison-Blanche. Foster Dulles multiplie les formules pour gagner du temps. Vous répétez à Londres que la force serait une erreur.','Maison-Blanche. Les U-2 photographient en Israël bien plus d’avions français que déclaré. Londres et Paris ne vous disent plus rien.','Retour d’un meeting en Virginie. On vous apprend qu’Israël attaque dans le Sinaï, à une semaine de l’élection.','Jour de l’élection. Les chars soviétiques écrasent Budapest. Vous appelez Eden : le cessez-le-feu, aujourd’hui.'],
kippour:['Hôtel Waldorf-Astoria, New York, 6 h 15. Joseph Sisco vous réveille : l’Égypte et la Syrie attaquent. Le président est en Floride.','Washington. Israël manque d’obus, les avions-cargos attendent sur les pistes. Le Pentagone hésite ; vous perdez patience.','Dans l’avion pour Moscou. L’Arabie saoudite annonce l’embargo pétrolier. À Washington, ce même soir, Nixon limoge le procureur du Watergate.','Maison-Blanche, salle de crise, nuit. Nixon, épuisé, ne descend pas : c’est vous qui présidez. Une lettre de Brejnev évoque une intervention unilatérale.','Le Caire. Vous rencontrez Sadate pour la première fois. Il vous parle de paix ; vous découvrez qu’il le pense.'],
'kippour-su':['Kremlin. Sadate a prévenu Moscou : l’attaque est imminente. Vous faites évacuer en secret les familles de vos conseillers en Égypte et en Syrie.','Kremlin. Les Antonov décollent vers Damas et Le Caire. Vous savez que Washington compte chaque vol.','Kremlin. Kossyguine revient du Caire : les Israéliens ont franchi le canal. Sadate refuse encore de l’admettre.','Kremlin, soir. La IIIe armée égyptienne est encerclée. Sadate vous supplie. Vos divisions aéroportées sont en alerte.','Kremlin. La conférence de Genève s’ouvre, mais c’est Kissinger qui fait la navette entre les capitales.'],
'kippour-il':['Tel-Aviv, 4 h du matin. Le téléphone vous réveille : la guerre commence aujourd’hui. C’est Yom Kippour, les rues sont vides, les radios muettes.','Tel-Aviv, état-major de la Kirya. Moshe Dayan revient du front, bouleversé. Il envisage le pire à voix haute.','Tel-Aviv. Les stocks d’obus ne tiendront que quelques jours. Vous proposez d’aller voir Nixon vous-même, en secret.','Tel-Aviv. Les chars de Sharon approchent du canal dans la nuit. Les noms des morts arrivent par télex, par dizaines.','Jérusalem. La IIIe armée égyptienne est prise au piège. Washington vous demande de la laisser respirer. Vos généraux veulent finir.'],
'kippour-eg':['Centre 10, Le Caire, 14 h. Vous êtes en uniforme. Sur les cartes, les premiers milliers d’hommes franchissent le canal en canots.','Le Caire. Assad réclame une offensive pour soulager le Golan. Vos généraux préviennent : ce serait sortir du parapluie antiaérien.','Le Caire. Les Israéliens ont passé le canal près de Déversoir. Votre chef d’état-major Chazli veut retirer des forces de la rive est.','Le Caire. La IIIe armée est encerclée à l’est du canal, presque sans eau. Vous appelez Moscou et Washington dans la même heure.','Le Caire. Kissinger entre dans votre bureau. Vous avez décidé de parier sur Washington.'],
archer:['Moscou. Un Boeing coréen a été abattu près de Sakhaline. Vos reins vous lâchent ; vous travaillez de plus en plus depuis votre lit.','Centre d’alerte Serpoukhov-15, nuit. Sur l’écran du lieutenant-colonel Petrov, cinq missiles américains. Il hésite à transmettre.','Hôpital de Kountsevo. Vous dirigez l’URSS depuis une chambre. Les rapports de l’opération RYAN s’empilent sur la table de chevet.','Kountsevo, nuit. Le KGB signale des messages chiffrés inédits entre Londres et Washington. En RDA, des avions sont armés sur les pistes.','Kountsevo. Les premiers Pershing II arrivent en Allemagne de l’Ouest. À Genève, vos négociateurs quittent la table.'],
'archer-us':['Orlando, devant les évangéliques. Vous appelez l’URSS « empire du mal ». Deux semaines plus tard, vous annoncez la défense antimissile spatiale.','Washington. Le vol KAL 007 abattu : 269 morts, dont un membre du Congrès. Vous parlez à la télévision d’un massacre.','Maison-Blanche. L’OTAN prépare un grand exercice. Vous deviez y participer en personne ; vos conseillers vous en ont dissuadé.','Maison-Blanche. Les écoutes signalent une activité soviétique anormale. Personne n’y voit encore de la peur.','Maison-Blanche. Le mois dernier, le téléfilm The Day After vous a laissé, écrivez-vous dans votre journal, « très déprimé ».'],
dayton:['Paris. Il y a neuf jours, trois de vos collègues sont morts sur la route du mont Igman, au-dessus de Sarajevo, quand leur blindé a basculé. Ce matin, un obus frappe le marché de Markale.','Belgrade. Milošević reçoit tard, boit, plaisante. Pendant ce temps, l’offensive croato-bosniaque avance à l’ouest.','Washington. Il faut un lieu clos, loin des caméras : une base aérienne de l’Ohio. Les délégués dormiront à quelques mètres les uns des autres.','Base de Wright-Patterson, Ohio, nuit. Les valises sont faites, l’annonce de l’échec est rédigée. Le café est froid.','Paris, palais de l’Élysée. La signature officielle approche. Il faudra soixante mille soldats pour faire tenir ce papier.'],
'dayton-ba':['Sarajevo assiégée, présidence. Les coupures d’eau durent depuis des mois. Les obus tombent toujours sur la ville.','Sarajevo. Les cartes du partage passent de main en main : 51 % pour la Fédération, 49 % pour les Serbes de Bosnie.','Sarajevo. Des centaines de milliers de déplacés attendent de savoir s’ils rentreront chez eux. Srebrenica hante chaque discussion.','Base de Wright-Patterson, Ohio. Votre chambre est étroite. On se dispute la largeur d’un couloir vers Goražde, carte par carte.','Wright-Patterson. Vous signez en disant que ce n’est pas une paix juste, mais qu’elle est plus juste que la guerre.'],
orion:['Port-Aster, salle du conseil, 6 h. Sur l’écran, les cargos s’immobilisent à l’entrée du détroit. Au marché, le prix du pain a déjà bougé.','Port-Aster. La tempête a couché les antennes du littoral. Les garde-côtes demandent s’ils doivent sortir malgré la houle.','Salle du conseil, nuit. Un patrouilleur a tiré, on ne sait pas encore qui le premier. Les familles des marins attendent devant la base.','Une capitale neutre, un hôtel aux rideaux lourds. Le médiateur vous fait attendre vingt minutes. C’est voulu.','Port-Aster. Le texte tient en six pages. Dans les cafés du port, les pêcheurs regardent la télévision sans parler.'],
'orion-bo':['Palais de Borée, aube. Votre ministre des Finances a chiffré le péage : il paierait les écoles du nord pendant dix ans.','Archipel du sud. Le cyclone a arraché les toits. Vos soldats déblaient avec les camions qui devaient tenir le détroit.','Palais de Borée, nuit. Un de vos patrouilleurs a été touché. Son commandant demande l’autorisation de riposter.','Palais de Borée. L’offre de médiation arrive par un envoyé discret. Votre opposition dira que vous reculez.','Palais de Borée. Vous relisez le traité ligne à ligne. Demain, on vous jugera sur un seul paragraphe.']
};
const VOIX={
'1914':{t:[['Le sergent nous a fait graisser les fusils deux fois aujourd’hui. Personne ne dit pourquoi.','Un soldat du contingent, Munich'],['Ma mère a acheté du sucre pour trois mois. Au village, on dit que les Russes arrivent.','Une institutrice, Prusse-Orientale']],a:[['Les permissions de moisson sont maintenues. Le blé n’attendra pas les diplomates.','Un fermier, Champagne'],['Au café, on rejoue aux cartes. Hier, personne n’osait.','Un garçon de café, Vienne']],c:[['On parle de réquisitionner nos chevaux. Comment rentrerons-nous la récolte ?','Un paysan, Galicie'],['Les trains de réservistes passent toute la nuit. Les femmes restent sur le quai bien après le départ.','Une épouse de réserviste, gare de l’Est, Paris']],n:[['Les journaux de l’après-midi s’arrachent. Je les vends avant même de crier les titres.','Un crieur de journaux, Londres'],['Mon fiancé dit que ce sera fini avant Noël. Je fais semblant de le croire.','Une couturière, Berlin']]},
munich:{t:[['Les douaniers allemands ont doublé. On entend des camions toute la nuit.','Un tisserand, Sudètes'],['On creuse des tranchées dans le square sous ma fenêtre. Les enfants trouvent ça amusant.','Une concierge, Paris']],a:[['À l’usine, on reparle des congés plutôt que des masques à gaz.','Une ouvrière, Boulogne-Billancourt'],['Mon mari est rentré de la caserne. Il n’a même pas défait son sac.','Une mère de famille, Lyon']],c:[['Nous partons cette nuit avec une valise. Les voisins qui portent l’insigne sudète ne nous saluent plus.','Une famille juive, Karlsbad'],['À l’école, on distribue des masques à gaz trop grands pour les petits.','Une institutrice, Prague']],n:[['La radio ne s’éteint plus. On dîne en écoutant Londres.','Un employé de banque, Paris'],['Dans la file chez le boulanger, on ne parle que de Hitler. Puis de la pluie.','Une retraitée, Lille']]},
berlin:{t:[['Des soldats soviétiques défilent à la limite du secteur. Personne ne sait s’ils vont s’arrêter.','Un policier, Potsdamer Platz'],['Ils ont fermé le pont. Ma tante est de l’autre côté.','Un écolier, Kreuzberg']],a:[['La boulangerie a eu de la farine ce matin. La queue chantait.','Une ménagère, Neukölln'],['Un pilote a lancé des bonbons accrochés à des mouchoirs. J’en ai attrapé un.','Une fillette, Tempelhof']],c:[['Quatre heures d’électricité par jour, au milieu de la nuit. Ma mère repasse à deux heures du matin.','Un apprenti, Charlottenburg'],['Le grand-père a passé l’hiver dans la cuisine, sous trois manteaux. Il n’y avait plus de bois.','Une veuve, Wedding']],n:[['Les pommes de terre déshydratées ont le goût de carton. On les pèse quand même au gramme près.','Une cuisinière, Steglitz'],['Je compte les avions depuis le toit. Hier, j’ai perdu le compte.','Un garçon de douze ans, Tempelhof']]},
suez:{t:[['On nous a rappelés, nous, les réservistes. Ma femme l’a appris par la radio.','Un réserviste, Toulon'],['Les canons antiaériens sont montés sur les toits de la ville.','Un instituteur, Port-Saïd']],a:[['Les navires passent toujours devant Ismaïlia. Les pilotes égyptiens les guident, et ça marche.','Un employé du canal, Ismaïlia'],['L’essence revient à la pompe. On ressort la voiture.','Un artisan, Marseille']],c:[['On a envoyé les enfants chez les grands-parents, loin du canal.','Une institutrice, Ismaïlia'],['Le quartier brûle. On porte les blessés sur des portes arrachées.','Une infirmière, Port-Saïd']],n:[['La radio du Caire et la radio de Londres disent le contraire. On écoute les deux.','Un étudiant, Alexandrie'],['Mes parents habitent Le Caire depuis trois générations. On nous dit de partir.','Une famille juive, Le Caire']]},
cuba:{t:[['Mon fils a seize ans, il est milicien. Il dort à la caserne depuis une semaine.','Une mère, La Havane'],['Le maître nous a fait répéter l’exercice : sous la table, les mains sur la tête.','Une écolière, Miami']],a:[['Le base-ball reprend dimanche. Le reste, on verra.','Un chauffeur, La Havane'],['Ce soir, on rallume les lumières du port.','Un pêcheur, Cojímar']],c:[['Les rations de riz ont encore baissé ce mois-ci.','Une ménagère, Santiago de Cuba'],['Plus une conserve, plus une bougie dans les rayons. Mon patron a fermé à midi pour rentrer chez lui.','Une vendeuse, Los Angeles']],n:[['Les soldats russes portent des chemises à carreaux pour passer pour des techniciens agricoles.','Un paysan, Pinar del Río'],['Mon père a creusé un abri dans le jardin. Ma mère y range les confitures.','Un adolescent, Ohio']]},
kippour:{t:[['Ils sont venus me chercher à la synagogue, en plein jeûne. J’ai encore mon talith dans le sac.','Un réserviste, Haïfa'],['Le ciel au-dessus du canal est plein de missiles. On dort dans les trous, le casque sur la tête.','Un soldat égyptien, rive est']],a:[['Mon mari a appelé du front. Trente secondes. Il est vivant.','Une épouse, Tel-Aviv'],['On parle d’un cessez-le-feu. Ma mère a recommencé à cuisiner pour quatre.','Une étudiante, Le Caire']],c:[['Dans mon équipage de char, on était quatre. Je suis rentré seul.','Un tankiste, Golan'],['Plus d’eau depuis des jours dans la IIIe armée. On partage la gourde au bouchon près.','Un soldat égyptien, rive est']],n:[['Les autobus ont été réquisitionnés pour le front. On va au travail à pied.','Une employée, Jérusalem'],['Mon fils est au Sinaï, il n’a pas écrit. Je laisse la radio allumée la nuit.','Une mère, Beer-Sheva']]},
archer:{t:[['On a testé les sirènes ce matin. Personne n’a levé la tête.','Une employée, Hambourg'],['L’alerte a sonné à trois heures. Nos chasseurs attendaient sur la piste, armés.','Un mécanicien, base aérienne, RDA']],a:[['La télévision a reparlé de football. Ça m’a rassurée.','Une retraitée, Moscou'],['Les deux télévisions, la leur et la nôtre, parlent de discussions. On veut y croire.','Un étudiant, Leipzig']],c:[['Nous étions des centaines de milliers dans les rues de Bonn contre les missiles. Ma fille portait une colombe en carton.','Une manifestante, Bonn'],['Mon frère était dans le vol 007. On ne nous a rien rendu.','Une sœur, Séoul']],n:[['On achète du sel et des allumettes, au cas où. Ma grand-mère dit qu’elle a déjà vécu ça.','Une ouvrière, Kiev'],['Les soldats américains de la base sont consignés. Les lumières restent allumées toute la nuit.','Une serveuse, Mutlangen']]},
dayton:{t:[['Les colonnes de l’offensive passent devant chez nous. Les voisins sont partis dans la nuit.','Un paysan, Bosnie occidentale'],['On court entre les immeubles. Ma fille compte jusqu’à dix, et on traverse.','Une mère, Sarajevo']],a:[['Ce matin, un tramway a roulé. Les gens le regardaient comme un miracle.','Un étudiant, Sarajevo'],['Le gaz est revenu. J’ai fait un vrai café, le premier depuis des mois.','Un musicien, Sarajevo']],c:[['On a quitté la maison sur un tracteur. Nous étions des dizaines de milliers sur la route.','Une réfugiée serbe, route de Banja Luka'],['Je cherche mon mari sur les listes de la Croix-Rouge. Srebrenica, juillet.','Une femme, Tuzla']],n:[['À l’hôtel, les journalistes attendent la paix comme on attend le bus.','Un chauffeur, Sarajevo'],['Là-bas, dans l’Ohio, ils dessinent nos villages sur des cartes.','Un instituteur, Goražde']]},
orion:{t:[['Les chalutiers restent à quai. Pas de pêche, pas de paye.','Un pêcheur, côte nord'],['Les patrouilleurs sont sortis cette nuit. Mon mari est à bord du deuxième.','Une femme de marin, Port-Aster']],a:[['Le prix du riz a baissé ce matin.','Une marchande, marché de Borée'],['Les cargos repassent, on les voit depuis la jetée. Les enfants leur font signe.','Une institutrice, Port-Aster']],c:[['L’hôpital n’a plus d’oxygène. Les bateaux de livraison sont bloqués au détroit.','Un médecin, Borée'],['Le cyclone a tout pris. Les secours ne peuvent venir que par la mer, et la mer est fermée.','Un maire de village, archipel du sud']],n:[['Les deux télévisions montrent le même détroit, avec deux histoires différentes.','Un étudiant, Port-Aster'],['Mon cousin vit de l’autre côté. On s’appelle chaque soir pour savoir si on est encore amis.','Une vendeuse, frontière']]}
};
const VECU_FIN={'Paix durable':'Des années plus tard, on vous demandera ce que vous avez ressenti ces jours-là. Vous parlerez de la fatigue, et de ceux qui ne sont pas morts.','Fermeté payante':'On vous reprochera longtemps votre dureté. Ceux qui sont nés après la crise ne sauront jamais ce qu’elle leur a coûté, ni ce qu’elle leur a épargné.','Paix fragile':'Le soir, vous rangez le dossier sans le fermer tout à fait. Vous savez qu’il reviendra.','Paix illusoire':'La foule vous applaudit. Vous souriez, et vous pensez déjà à la prochaine fois.','Crise ouverte':'Rien n’est fini. Demain matin, le même dossier sera sur votre bureau, plus épais.','Vous êtes renversé':'Vous quittez votre bureau avec un carton. Le planton vous salue encore, par habitude.','La guerre a éclaté':'Les télégrammes ne parlent plus de diplomatie mais de pertes. Vous les lisez un par un, et vous signez.'};
function voixKey(fx,war){const c=fx.c||0,e=fx.e||0,k=fx.k||0;return ((war||c<=-6)?'c':e>=6?'t':(e<=-6||k>=8)?'a':'n')+(S.t>=3?1:0)}
function voixGet(vk){const V=VOIX[sc().grp||S.id];if(!V||!vk)return null;const a=V[vk[0]];return a?a[+vk.slice(1)%a.length]:null}
function voixHTML(vk){const v=voixGet(vk);return v?`<figure class="vecu-voix"><div class="kicker">Pendant ce temps, loin des salles de crise</div><blockquote>« ${esc(v[0])} »</blockquote><figcaption>${esc(v[1])}</figcaption></figure>`:''}
function climat(){const g=S.g,out=[];
  if(g.e>=75)out.push('Les états-majors ne dorment plus. Vous non plus.');else if(g.e<=25)out.push('Pour la première fois depuis des jours, quelqu’un a ri en réunion.');
  if(g.s<=25)out.push('Dans les couloirs, on parle déjà de votre successeur.');else if(g.s>=80)out.push('Votre entourage fait bloc derrière vous. Pour l’instant.');
  if(g.c<=35)out.push('Les rapports sur la population s’empilent sur votre bureau : peur, pénuries, départs.');
  if(g.k<=20)out.push('Plus aucun message ne passe. Vous ne savez plus ce que pense l’autre camp.');else if(g.k>=70)out.push('Un canal officieux fonctionne encore : des messages passent la nuit.');
  return out.slice(0,2)}
function carnetHTML(){const note=(S.notes||{})[S.t]||'';return `<label class="vecu-carnet"><span class="kicker">Votre carnet · une phrase sur ce choix</span><textarea id="carnetIn" maxlength="160" rows="2" placeholder="Pourquoi ce choix ? Ce que vous craignez ? Elle vous sera rendue à la fin.">${esc(note)}</textarea></label>`}

let carnetT=0;document.addEventListener('input',e=>{if(e.target.id!=='carnetIn'||!S)return;S.notes=S.notes||{};S.notes[S.t]=e.target.value.slice(0,160);clearTimeout(carnetT);carnetT=setTimeout(saveGame,400)});

  <div class="track" role="progressbar" aria-label="Progression de la crise" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${S.t+1}">${s.turns.map((_,i)=>`<i class="${i<S.t?'done':i===S.t?'now':''}"></i>`).join('')}</div>
  <div class="rolebar"><div><div class="kicker">Votre rôle</div><b>${esc((r=>r.charAt(0).toUpperCase()+r.slice(1))(s.role.replace(/^Vous êtes /,'').replace(/\.$/,'')))}</b></div><div><div class="kicker">Face à</div><b>${esc(BRIEF[s.id][0])}</b></div><div><div class="kicker">Votre objectif</div><b>${esc(BRIEF[s.id][1])}</b></div></div>

    ${S.driftMsg&&!L?`<div class="driftnote">Vos décisions passées pèsent encore : ${Object.keys(S.driftMsg).map(k=>G[k]+' '+(fogMode?(S.driftMsg[k]>0?'en hausse':'en baisse'):(S.driftMsg[k]>0?'+':'')+S.driftMsg[k])).join(', ')}.</div>`:''}
    <div class="v16-guidance"><b>● ORDRE DU JOUR</b><span>Consultez vos conseillers ou votre cabinet, puis choisissez une option stratégique. Les décisions engagent la suite de la crise.</span></div>

    <div class="choices" role="group" aria-label="Décisions proposées">${vis.map(({o,i},pos)=>`<button data-key="${pos+1}" aria-label="Option ${pos+1} : ${esc(o.t)}" class="choice ${S.picked===i?'picked':''} ${o.req?'unlocked':''}" data-choice="${i}" ${S.picked!==null||negBlocking()?'disabled':''}>${o.req?'<em class="unl">Débloqué par un choix précédent</em>':''}<b>${esc(o.t)}</b><span>${esc(o.d)}</span>${hint(o,i)}</button>`).join('')}</div>
    ${L?`<div class="outcome" aria-live="polite"><h3>Conséquences</h3><div class="delta">${deltas||'<span>Aucun changement notable</span>'}</div><div class="foe">${esc(foeReply(L.fx))}</div>${voixHTML(L.vk)}${carnetHTML()}${L.smsg?`<div class="warnline">${esc(L.smsg)}</div>`:''}${L.iw>=0?`<div class="warnline">${L.iw===S.picked?'Le renseignement s’est trompé sur l’option que vous avez choisie : il en annonçait l’effet inverse sur l’escalade.':'Le rapport de renseignement contenait une erreur, sur l’option « '+esc(L.iwT)+' »'+' : il en annonçait l’effet inverse.'} Fiabilité de la source : ${L.iwCode}. Même un bon service se trompe.</div>`:(S.intel&&S.intel.t===S.t?'<div class="fog">Le rapport de renseignement de ce tour était exact.</div>':'')}${L.pmsg&&S.profKnown?`<div class="fog">Profil ${esc(PROF[PROFILE[S.id]][0].toLowerCase())} : ${esc(L.pmsg.charAt(0).toLowerCase()+L.pmsg.slice(1))}</div>`:''}${L.fog?`<div class="fog">Imprévu : ${esc(L.fog)}.</div>`:''}
      <div class="histbox"><div class="kicker">${s.hist?'Dans l’Histoire':'Pour comprendre'}</div>${s.hist&&histOpt?`<p style="margin:4px 0"><b>Choix réel :</b> ${esc(histOpt.t)}${turn.opts[S.picked].h?' (comme vous)':''}.</p>`:''}<p style="margin:4px 0">${esc(turn.note)}</p>${turn.opts[S.picked].xn?`<p style="margin:8px 0 4px"><b>Votre option :</b> ${esc(turn.opts[S.picked].xn)}</p>`:''}</div>

function debrief(){
  const s=sc(),sc_=score(),hist=S.log.filter(l=>l.h).length,nDec=S.log.filter(l=>!l.neg).length,P=parts();
  let title,sub;
  if(S.over==='war'&&s.warOk&&P.dur>=65){title='Fermeté payante';sub='La guerre éclate en 1938, mais dans les meilleures conditions possibles : l’avenir vous donne raison, au prix de lourdes pertes.'}
  else if(S.over==='war'){title='La guerre a éclaté';sub=s.warOk&&P.dur>=40?'Vous n’avez pas évité la guerre, mais vous l’affrontez dans de meilleures conditions que l’Histoire.':'L’escalade est devenue incontrôlable.'}
  else if(S.over==='fall'){title='Vous êtes renversé';sub='Sans soutien intérieur, aucune politique ne tient.'}
  else if(P.imm>=55&&P.dur<40){title='Paix illusoire';sub='Le calme immédiat cache la tempête à venir.'}
  else if(P.dur>=65&&P.imm>=50){title='Paix durable';sub='Vous avez désamorcé la crise et posé les bases de l’avenir.'}
  else if(P.dur>=65){title='Fermeté payante';sub='Des choix coûteux sur le moment, mais l’avenir vous donne raison.'}
  else if(P.dur>=40&&P.imm>=50){title='Paix fragile';sub='La guerre est évitée, mais la prochaine crise couve.'}
  else{title='Crise ouverte';sub='Pas de guerre, mais rien n’est réglé.'}
  const decs=S.log.filter(l=>!l.neg);
  const sealed=decs.filter(l=>l.cap===0).sort((a,b)=>a.l-b.l)[0];
  const worst=[...decs].sort((a,b)=>a.l-b.l)[0],bestD=[...decs].sort((a,b)=>b.l-a.l)[0];
  const epi=(S.over==='war'&&!s.warOk)?(WAR[s.grp||s.id]||s.epi[0]):(sealed&&EP[sealed.choice])?EP[sealed.choice]:s.epi[P.dur<40?0:P.dur<65?1:2];
  const key=sealed||(P.dur>=65?bestD:(worst&&worst.l<=-3?worst:bestD));const mid=P.dur>=40&&P.dur<65;
  const epiWhy=[S.over==='fall'?'Écarté du pouvoir, vous n’avez pas vu cette suite ; d’autres l’ont écrite à votre place.':'',key?(key===sealed?`Votre décision du ${key.date}, « ${key.choice} », a scellé cet avenir.`:key.l>0?(P.dur>=65?`La décision qui a le plus compté pour l’avenir : « ${key.choice} », le ${key.date}.`:`Votre meilleure décision, « ${key.choice} », le ${key.date}, n’a pas suffi à consolider l’avenir.`):(mid?`La décision qui a fragilisé l’avenir : « ${key.choice} », le ${key.date}.`:`La décision la plus lourde de conséquences : « ${key.choice} », le ${key.date}.`)):'',S.weak?'Vos concessions répétées ont convaincu l’adversaire que vous céderiez encore.':'',S.spiral?'Vos coups de force successifs ont durci durablement l’autre camp.':''].filter(Boolean).join(' ');
  $('#app').innerHTML=`<div class="debrief">
   <div class="verdict"><div class="date" style="font-size:12px;letter-spacing:2px;text-transform:uppercase">${esc(s.title)} · Mode ${MODES[S.mode].n} · Rapport final</div><h2>${title}</h2><p style="margin:0">${sub}</p>
    <div class="scoreline"><div>Score global<strong>${sc_} / 100</strong></div><div>Paix immédiate<strong>${P.imm}</strong></div><div>Stabilité durable<strong>${P.dur}</strong></div><div>Protection des civils<strong>${P.civ}</strong></div>${s.hist?`<div>Fidélité à l’Histoire<strong>${hist} / ${nDec}</strong></div>`:''}</div></div>
   ${carnetFin(title)}<section class="panel"><h3>Le profil de votre adversaire</h3><p class="lesson"><b>${PROF[PROFILE[s.id]][0]}.</b> ${esc(PROF[PROFILE[s.id]][1])}</p></section>
   <section class="ignore"><div class="kicker">Ce que vous ignoriez</div><p>${esc(IGN[s.id]||'')}</p></section>
   ${(()=>{const dec=S.log.filter(l=>!l.neg&&l.l);const plus=[...dec].sort((a,b)=>b.l-a.l).filter(l=>l.l>0).slice(0,2),minus=[...dec].sort((a,b)=>a.l-b.l).filter(l=>l.l<0).slice(0,2);
     return (plus.length||minus.length)?`<section class="panel"><h3>Les décisions qui ont pesé sur l’avenir</h3><div class="weigh">${plus.map(l=>`<div class="up"><b>+</b> ${esc(l.date)} · ${esc(l.choice)}</div>`).join('')}${minus.map(l=>`<div class="down"><b>−</b> ${esc(l.date)} · ${esc(l.choice)}${l.cap===0?' <span class="chip">irréversible</span>':''}</div>`).join('')}</div></section>`:''})()}
   ${s.neg&&LEV[s.id]?`<section class="panel"><h3>Les leviers de ${esc(s.neg.who)}</h3><div class="weigh">${LEV[s.id].map((x,i)=>{const used=S.neg&&S.neg.lv&&S.neg.lv[i]&&S.neg.lv[i].hit;return `<div class="${x[1]==='+'?'up':'down'}">${x[1]==='+'?'Levier':'Piège'} : ${esc(x[2])}${S.neg&&S.neg.lv?(used?' <span class="chip hist">utilisé</span>':''):''}</div>`}).join('')}</div></section>`:''}
   <section class="epilogue"><div class="kicker">Épilogue · le temps long</div><p>${esc(epi)}</p>${epiWhy?`<p class="why">${esc(epiWhy)}</p>`:''}<p class="note">La stabilité durable ne s’affiche pas pendant la partie : elle juge vos décisions des années plus tard.</p></section>
   ${S.neg&&S.neg.reply?`<section class="panel"><h3>Votre négociation avec ${esc(s.neg.who)}</h3><p class="lesson"><b>Vous :</b> ${esc(S.neg.text)}</p><p class="lesson"><b>${esc(s.neg.who)} :</b> ${esc(S.neg.reply)}</p></section>`:''}
   ${s.hist?`<section class="panel"><h3>Votre trajectoire face à l’Histoire</h3><div class="compare">${S.log.map(l=>`<div class="cmp"><div class="k">${esc(l.date)}</div><div><span class="k">Vous</span><br><span class="${l.h?'same':'diff'}">${esc(l.choice)}</span></div><div><span class="k">L’Histoire</span><br>${esc(l.histChoice||'')}</div></div>`).join('')}</div></section>`:''}
   <section class="panel"><h3>Ce qu’il faut retenir</h3><p class="lesson">${esc(s.real)}</p></section>
   <div class="actions"><button class="primary" data-start="${s.id}">Rejouer cette crise</button><button class="ghost" id="backBtn">Choisir une autre crise</button></div></div>`;
}
let VIEW=null;
function render(){if(S&&!S.done)saveGame();$('#rulesBtn').textContent=VIEW==='rules'?(S&&!S.done?'Retour à la partie':'Retour'):'Règles du jeu';if(VIEW==='rules')return rulesPage();if(!S)return home();if(S.done)return debrief();if(S.brief)return briefing();play()}

document.addEventListener('click',e=>{
  const st=e.target.closest('[data-start]');if(st)return start(st.dataset.start);
  const md=e.target.closest('[data-mode]');if(md)return setMode(md.dataset.mode);
  const c=e.target.closest('[data-choice]');if(c)return choose(+c.dataset.choice);
  if(e.target.closest('#nextBtn'))return next();
  if(e.target.closest('#aiBtn'))return askAI();
  if(e.target.closest('#negBtn'))return negotiate();
  if(e.target.closest('#rulesBtn3')){VIEW='rules';render();window.scrollTo({top:0});return}
  if(e.target.closest('#rulesBtn2')){VIEW=null;render();window.scrollTo({top:0});return}
  if(e.target.closest('#rulesBtn')){VIEW=VIEW==='rules'?null:'rules';render();window.scrollTo({top:0});return}
  const cb=e.target.closest('[data-cab]');if(cb)return cabinet(cb.dataset.cab);
  if(e.target.closest('#beginBtn')){S.brief=false;render();window.scrollTo({top:0});return}
  if(e.target.closest('#resumeBtn')){S=loadGame();if(S){S.negBusy=false;AI.lines=null;render()}return}
  const cr=e.target.closest('[data-counter]');if(cr)return counter(cr.dataset.counter==='yes');
  if(e.target.closest('#homeBtn')||e.target.closest('#backBtn')){S=null;VIEW=null;render()}
});
document.addEventListener('keydown',e=>{if(!S||S.done||e.target.matches('textarea,input')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.brief&&e.key==='Enter'){e.preventDefault();S.brief=false;render();return}
  if(/^[1-4]$/.test(e.key)&&S.picked===null&&!S.brief){const b=document.querySelectorAll('.choice:not(:disabled)')[+e.key-1];if(b){e.preventDefault();choose(+b.dataset.choice);setTimeout(()=>{const n=$('#nextBtn');n&&n.scrollIntoView({behavior:'smooth',block:'center'})},50)}}
  else if(e.key==='Enter'&&$('#nextBtn')&&!e.target.matches('button')){e.preventDefault();next()}});

(()=>{const D={"1914-uk": {"prof": "fier", "ctx": "Juillet 1914. Le Royaume-Uni n’est lié par aucune alliance formelle avec la France ni la Russie, seulement par une « entente ». Le cabinet libéral est divisé, et l’opinion britannique se soucie davantage de l’Irlande que des Balkans. Seul un traité de 1839 engage Londres : la garantie de la neutralité belge.", "ign": "Bethmann Hollweg a espéré jusqu’au bout la neutralité britannique. Certains historiens pensent qu’un avertissement clair et public de Londres, fin juillet, aurait pu peser sur Berlin.", "lev": [["neutralit|belgique", "+", "Il espère par-dessus tout la neutralité britannique."], ["conférence|médiation|halte", "+", "Une médiation qui ménage l’honneur autrichien peut l’intéresser."], ["menace|ultimatum|guerre", "-", "Une menace publique renforce les militaires à Berlin."]], "real": "Londres entre en guerre le 4 août 1914, après l’invasion de la Belgique. Les historiens débattent encore : un engagement britannique clair dès la fin juillet aurait-il dissuadé Berlin ? Leçon : l’ambiguïté peut encourager l’adversaire à parier sur votre neutralité.", "turns": [["Proposer une conférence à quatre", null, "Le 26 juillet, Grey propose une conférence des quatre puissances non directement impliquées : Royaume-Uni, France, Allemagne et Italie. Berlin la refuse, au motif que le conflit ne concerne que Vienne et Belgrade."], ["Consulter Berlin sur une médiation privée", null, "Grey presse Berlin de modérer Vienne. Bethmann Hollweg transmet ses suggestions sans conviction ; l’Autriche-Hongrie déclare la guerre à la Serbie le 28 juillet."], ["Demeurer équivoque sur les intentions britanniques", null, "Le 29 juillet, Grey avertit en privé l’ambassadeur allemand Lichnowsky que Londres ne resterait pas forcément à l’écart. Mais, faute d’accord au sein du cabinet, il refuse tout engagement public envers Paris et Saint-Pétersbourg."], ["Garantir la neutralité belge publiquement", null, "Le 31 juillet, Grey demande à Paris et à Berlin s’ils respecteront la neutralité belge. La France répond oui ; l’Allemagne élude. La Belgique devient la ligne rouge britannique."], ["Adresser un ultimatum avec délai de retrait", null, "Le 4 août, Londres exige de Berlin le respect de la neutralité belge, avant minuit heure de Berlin. Sans réponse, le Royaume-Uni est en guerre. La veille, Grey aurait dit : « Les lampes s’éteignent dans toute l’Europe. »"]], "caps": {"Refuser la guerre et abandonner la Belgique": 0, "Annoncer que Londres restera neutre": 1}}, "berlin-de": {"prof": "opportuniste", "ctx": "Juin 1948. Élu maire de Berlin en 1947, Ernst Reuter n’a pas pu prendre ses fonctions à cause du veto soviétique ; Louise Schroeder assure l’intérim. Social-démocrate et ancien exilé, Reuter est pourtant devenu la voix politique de Berlin-Ouest, plus de deux millions d’habitants encerclés par la zone soviétique.", "ign": "Staline n’a jamais fait abattre un avion du pont aérien : c’était le seul terrain où il ne pouvait pas gagner sans risquer la guerre. Le moral des Berlinois était donc la vraie cible du blocus.", "lev": [["face|honneur|conférence|quadripartite", "+", "Une issue qui lui sauve la face peut l’intéresser."], ["monnaie orientale|mark de l’est|ost", "+", "Accepter la monnaie soviétique dans toute la ville serait pour lui une victoire."], ["échec|humili|défaite", "-", "Évoquer son échec le pousse à durcir le blocus."]], "real": "Berlin-Ouest tient onze mois et devient le symbole de la résistance démocratique ; Reuter en est la voix. La ville reste divisée jusqu’en 1990. Leçon : le moral d’une population assiégée est une arme stratégique à part entière.", "turns": [["Organiser une manifestation de masse", null, "Le 24 juin, Reuter s’adresse à des dizaines de milliers de Berlinois et les appelle à refuser la mainmise soviétique. Il assure ensuite le général Clay que la population tiendra."], ["Appeler les Alliés à maintenir coûte que coûte les vols", null, "La promesse de Reuter que les Berlinois supporteront les privations pèse dans la décision américaine de tenir. Le pont aérien monte en puissance au fil de l’été."], ["Prononcer un appel public à la solidarité mondiale", null, "Le 9 septembre 1948, devant le Reichstag en ruine, Reuter lance à plus de 300 000 personnes : « Peuples du monde, regardez cette ville ! »"], ["Établir un rationnement transparent", null, "L’électricité est limitée à quelques heures par jour. Des milliers de Berlinois, dont beaucoup de femmes, construisent en trois mois l’aéroport de Tegel."], ["Consolider les institutions démocratiques de Berlin-Ouest", null, "Depuis décembre 1948, la ville a deux administrations ; Reuter est devenu maire de Berlin-Ouest. Le blocus est levé le 12 mai 1949, mais la division de la ville durera quarante ans."]], "l": {"Demander un dialogue municipal Est-Ouest": 1, "Préférer une négociation discrète avec Moscou": -2, "Proposer des mécanismes de liaison entre secteurs": 4}, "caps": {"Accepter des approvisionnements sous conditions soviétiques": 1}}, "suez-us": {"prof": "fier", "ctx": "Juillet 1956. Eisenhower brigue un second mandat, avec l’élection prévue le 6 novembre. Il veut éviter que le monde arabe ne bascule vers Moscou et refuse de voir ses alliés européens rejouer la politique de la canonnière. Mais Londres et Paris sont ses deux principaux alliés.", "ign": "Londres, Paris et Israël vous avaient caché le protocole de Sèvres. Ils comptaient sur votre prudence en pleine campagne électorale ; ils ont mal mesuré votre colère.", "lev": [["indemni|navigation|usagers", "+", "Garantir la navigation et indemniser les actionnaires lui convient."], ["souverain", "+", "Reconnaître la souveraineté égyptienne le met en confiance."], ["force|menace|contrôle international", "-", "Toute menace ou tutelle étrangère le rend intransigeant."]], "real": "Eisenhower contraint ses alliés à se retirer, par la pression financière et à l’ONU. L’épisode marque la fin des politiques impériales autonomes de Londres et de Paris. Leçon : la pression économique d’un allié peut peser plus lourd que la force militaire d’un adversaire.", "turns": [["Proposer un mécanisme international de navigation", null, "Eisenhower écarte l’usage de la force. Avec son secrétaire d’État John Foster Dulles, il soutient la conférence de Londres d’août 1956 sur un contrôle international du canal."], ["Multiplier les consultations avec les usagers", null, "Dulles propose une Association des usagers du canal. Londres et Paris y voient une manœuvre pour gagner du temps et poursuivent leurs préparatifs."], ["Demander des explications aux alliés", null, "Washington détecte la mobilisation israélienne mais croit à une opération contre la Jordanie. Londres et Paris l’ont tenu dans l’ignorance."], ["Exiger un cessez-le-feu immédiat", null, "Le 30 octobre, une résolution américaine au Conseil de sécurité exige le cessez-le-feu ; Londres et Paris y opposent leur veto. Washington porte alors l’affaire devant l’Assemblée générale."], ["Exercer une pression économique coordonnée", null, "Washington bloque l’aide du FMI à la livre sterling et retient ses livraisons de pétrole à l’Europe. Le 6 novembre, jour de la réélection d’Eisenhower, Londres accepte le cessez-le-feu."]], "caps": {"Envoyer des forces américaines contre l’Égypte": 0}}, "cuba-cu": {"prof": "prudent", "ctx": "Octobre 1962. Dix-huit mois après le débarquement manqué de la baie des Cochons, Fidel Castro redoute une invasion américaine. Il a accepté au printemps le déploiement de missiles soviétiques, qui restent sous le seul contrôle de Moscou. Cuba est l’enjeu de la crise, mais pas l’un de ses négociateurs.", "ign": "Khrouchtchev a négocié le retrait des missiles sans vous : vous apprenez l’accord par la radio, comme le reste du monde.", "lev": [["non[- ]?invasion|garanti", "+", "Une garantie de non-invasion est ce qu’il peut offrir."], ["inspection|vérifi", "+", "Accepter une vérification faciliterait tout."], ["guantánamo|guantanamo|riposte|abattre", "-", "Toute menace contre les forces américaines le braque."]], "real": "Cuba n’est pas envahie, mais Castro sort humilié d’avoir été tenu à l’écart du règlement. Il refuse toute inspection sur son sol. Leçon : un petit allié peut être sacrifié dans un marchandage entre grandes puissances, même quand il en est l’enjeu.", "turns": [["Accepter toutes les installations sans contrôle", null, "Castro a accepté le déploiement au printemps 1962, par solidarité avec le camp socialiste et pour dissuader une invasion. Les missiles et leurs ogives restent sous le contrôle exclusif de Moscou."], ["Mobiliser sans tirer et ouvrir les hôpitaux", null, "Le 22 octobre, Cuba décrète la mobilisation générale. Des centaines de milliers de Cubains rejoignent les milices et les unités de défense."], [null, null, "La quarantaine ne vise que les armes offensives : les navires civils sont autorisés à passer après contrôle. Cuba ne connaît pas de pénurie immédiate ; il n’y a pas d’équivalent historique direct à ces options."], ["Exiger une riposte immédiate contre les États-Unis", null, "Dans la nuit du 26 au 27, Castro écrit à Khrouchtchev de frapper le premier si les États-Unis envahissent l’île. Il ordonne de tirer sur les avions américains volant à basse altitude. Le U-2 du 27 est abattu par une batterie soviétique."], ["Exiger des garanties de non-invasion", null, "Furieux de ne pas avoir été consulté, Castro pose cinq conditions, dont la fin de l’embargo et la restitution de Guantánamo, et refuse toute inspection de l’ONU. Les relations avec Moscou se refroidissent, sans rupture."]], "l": {"Exiger des garanties de non-invasion": 6}, "caps": {"Exiger une riposte immédiate contre les États-Unis": 1}}, "dayton-ba": {"prof": "opportuniste", "ctx": "Août 1995. Président de la Bosnie-Herzégovine depuis l’indépendance de 1992, Alija Izetbegović dirige un État assiégé : Sarajevo est encerclée depuis trois ans, et le massacre de Srebrenica vient d’avoir lieu. L’opération croate Tempête et les frappes de l’OTAN changent soudain le rapport de forces.", "ign": "Milošević était prêt à céder Sarajevo pour obtenir la levée des sanctions. C’est lui qui, à Dayton, concède l’unification de la capitale sous l’autorité de la Fédération.", "lev": [["sanction", "+", "La levée des sanctions contre la Serbie est son obsession."], ["entité|republika|serbes de bosnie", "+", "La préservation d’une entité serbe est sa ligne rouge."], ["tribunal|crimin|justice", "-", "Évoquer la justice internationale le ferme."]], "real": "La guerre s’arrête, mais la Bosnie reste divisée en deux entités, avec des institutions complexes et souvent bloquées. Izetbegović qualifie l’accord de paix imparfaite, préférable à la poursuite de la guerre. Leçon : accepter une paix injuste peut sauver des vies, au prix de compromis durables.", "turns": [["Demander une offensive jusqu’à la victoire totale", null, "À l’automne 1995, l’armée bosniaque participe à l’offensive aux côtés des forces croates, sous la couverture des frappes de l’OTAN. Washington finit par imposer un cessez-le-feu le 12 octobre."], ["Négocier des institutions centrales fortes", null, "Le 8 septembre à Genève, les parties acceptent le principe d’un État unique composé de deux entités : la Fédération croato-bosniaque (51 % du territoire) et la Republika Srpska (49 %)."], ["Exiger un droit de retour supervisé", null, "L’annexe 7 des accords de Dayton garantit le droit au retour des réfugiés et des déplacés. Sa mise en œuvre sera lente et incomplète."], ["Accepter un compromis avec garanties militaires", null, "Izetbegović hésite jusqu’au dernier jour à Wright-Patterson. Il finit par accepter un accord qu’il juge injuste mais préférable à la guerre ; il est paraphé le 21 novembre."], ["Demander une force internationale robuste", null, "L’accord est signé à Paris le 14 décembre 1995. L’IFOR, force de l’OTAN de 60 000 soldats, remplace les Casques bleus."]], "l": {"Accepter un cessez-le-feu vérifié": 3, "Exiger un accès humanitaire immédiat": 5, "Créer une commission internationale des retours": 6}, "caps": {"Signer sans force internationale": 0}}, "orion-bo": {"prof": "fier", "ctx": "Monde fictif. Vous présidez la Fédération de Boréa, plus puissante que sa voisine Aster. Vos nationalistes réclament le contrôle du détroit d’Orion et de ses revenus, à quelques mois d’élections décisives.", "ign": "Aster n’avait que dix jours de réserves de blé. Après la tempête, votre blocus est devenu indéfendable aux yeux du monde, même de vos alliés.", "lev": [["blé|vivres|corridor|humanitaire", "+", "Nourrir les îles est la priorité absolue d’Aster."], ["partag|conjoint|commission", "+", "Une gestion partagée lui permet de rentrer avec une victoire."], ["péage|désarm|humili", "-", "Exiger son désarmement ou un péage le braque."]], "real": "Scénario fictif. Il montre comment l’État le plus fort peut perdre la bataille de l’opinion en maintenant une pression économique pendant une catastrophe humanitaire.", "turns": [], "l": {"Proposer une commission technique de navigation": 5, "Indemniser provisoirement les familles": 5}}};
